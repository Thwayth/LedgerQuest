          hooks.onSettle && hooks.onSettle(clearedCount, coins.length, AMMO_CHARGES - chargesUsed, { score });
          if (clearedCount < coins.length && chargesUsed < AMMO_CHARGES) spawnAmmo();
        }
      }
    }
    // Victory fires the moment the LAST coin is knocked out — no need to wait
    // for every block to stop moving, and never a need for another shot.
    if (!levelWon && coins.length && coins.every(c => c.dead)){
      levelWon = true;
      settledTimer = null;
      if (ammoBody){ world.destroyBody(ammoBody); ammoBody = null; dragging = false; }
      slowMoUntilMs = now + 1000;
      pendingVictoryArgs = { cleared: coins.length, total: coins.length, chargesLeft: AMMO_CHARGES - chargesUsed, score };
    }
    if (pendingVictoryArgs && now >= slowMoUntilMs){
      const a = pendingVictoryArgs; pendingVictoryArgs = null;
      // score re-read here (not a.score): coins resolved during the slow-mo still count
      hooks.onSettle && hooks.onSettle(a.cleared, a.total, a.chargesLeft, { score });
    }

    render();
    raf = requestAnimationFrame(step);
  }

  /* ======================================================================
     RENDERING — background baked once (+ on resize) into an offscreen
     canvas; blocks lit with a fully baked sprite (light always from the
     right, no per-frame gradients); glow replaced by pre-rendered sprites
     blitted with drawImage; floor shadows are one pre-blurred sprite drawn
     at the right scale; no ctx.filter and no bloom toggling in the loop.
     ====================================================================== */
  // sun center/radius per spec: can extend past the right edge, intended.
  // (batch-3) position/size now read from the palette's sunPosXFrac/
  // sunPosYFrac/sunRFrac when present, falling back to the original fixed
  // 0.80/0.40/0.30 otherwise — so purpleSunset/deepNight render byte-
  // identical to before, while pinkDawn can sit its sun lower + bigger.
  function sunSpec(pal){
    const xf = (pal && pal.sunPosXFrac != null) ? pal.sunPosXFrac : 0.80;
    const yf = (pal && pal.sunPosYFrac != null) ? pal.sunPosYFrac : 0.40;
    const rf = (pal && pal.sunRFrac != null) ? pal.sunRFrac : 0.30;
    return { x: cssW*xf, y: cssH*yf, r: cssW*rf };
  }

  let bgCanvas = null;       // sky + stars — static, zero parallax (infinitely distant)
  let sunCanvas = null;      // sun + halo — parallax factor 0.05
  let cloudsCanvas = null;   // cloud silhouettes — parallax factor 0.10
  let cityCanvas = null;     // city + distance haze — parallax factor 0.20
  let antennaLights = []; // [{x,y,phase}] in screen px, fixed once per build — only red tip lights left
  const palette = getPalette(levelDef.palette);

  /* ----------------------------------------------------------------------
     BACKGROUND v3 (#3, batch-1) — now PARAMETRIC by `palette` (see the
     PALETTES object + getPalette(), module-level, above createScene) and
     split into separate layer canvases so render()'s drawBackgroundLayers()
     can parallax-shift sun/clouds/city independently as the camera pans
     (#1) — sun at 0.05x the camera's pan offset, clouds at 0.10x, city at
     0.20x. The sky+stars layer gets NO offset (infinitely distant). The
     floor is NOT baked any more — it's drawn live, per frame, in
     drawFloorLive() below, because it now needs to show pit/gap terrain
     (#2) at the correct world-aligned screen position, which only a live
     camera-aware draw can do.
     Everything else about the look (bright saturated sky, clean sun disc
     with nothing drawn over it, 3-5 opaque flat-bottomed cloud
     silhouettes, one city layer confined to the lower screen, dark slab
     floor) is unchanged from the previous round's spec.
     ---------------------------------------------------------------------- */
  function buildBackground(){
    const W = Math.max(1, Math.round(cssW)), H = Math.max(1, Math.round(cssH));
    function mkLayer(){ const c = document.createElement("canvas"); c.width = W; c.height = H; return c; }
    bgCanvas = mkLayer(); sunCanvas = mkLayer(); cloudsCanvas = mkLayer(); cityCanvas = mkLayer();
    const rng = mulberry32(20261003);
    const sun = sunSpec(palette);
    antennaLights = [];

    // ---- 1. sky: 3-stop vertical gradient from the palette, bright at the
    // horizon — static layer, stars included ----
    const b = bgCanvas.getContext("2d");
    const g = b.createLinearGradient(0,0,0,cssH);
    g.addColorStop(0, palette.skyTop); g.addColorStop(0.55, palette.skyMid); g.addColorStop(1, palette.skyHorizon);
    b.fillStyle = g; b.fillRect(0,0,cssW,cssH);
    // 70 stars, 5 large ones with a soft flare/bloom
    for (let i=0;i<70;i++){
      const sx = rng()*cssW, sy = rng()*cssH*0.55;
      const big = i < 5;
      const size = big ? 2.6+rng()*1.4 : 0.8+rng()*1.1;
      b.globalAlpha = big ? 0.95 : (0.25 + rng()*0.5);
      b.fillStyle = "#ffffff";
      if (big) drawGlow(b, sx, sy, size*5, "#ffffff", 0.5);
      b.beginPath(); b.arc(sx,sy,size*0.5,0,Math.PI*2); b.fill();
    }
    b.globalAlpha = 1;

    // ---- 2. sun — own layer. NOTHING is drawn over the disc after this:
    // clouds and buildings are kept out of its bounding circle by
    // construction (see cloud/building placement below), never clipped
    // against it after the fact. ----
    drawSunBaked(sunCanvas.getContext("2d"), sun, palette);

    // ---- 3. clouds: 4-5 flat opaque silhouettes, kept clear of the sun's
    // disc + halo ----
    drawCloudsBaked(cloudsCanvas.getContext("2d"), rng, sun, palette);

    // ---- 4. ONE city layer, confined to the bottom 35% of the screen ----
    drawCityBaked(cityCanvas.getContext("2d"), rng, palette);
  }

  // Composites the 4 baked layers with parallax (#1): sun/clouds/city shift
  // opposite the camera's pan by a FRACTION of that pan distance (0.05 /
  // 0.10 / 0.20), so distant layers appear to move less than the gameplay
  // world — then draws the floor live (see drawFloorLive, below render()'s
  // other helpers) since it must reflect real pit/gap terrain.
  function drawBackgroundLayers(){
    if (!bgCanvas) return;
    const panPx = (camera.camX - CAM_LEFT_M) * SCALE * camera.zoom;
    ctx.drawImage(bgCanvas, 0, 0, cssW, cssH);
    ctx.drawImage(sunCanvas, -panPx*0.05, 0, cssW, cssH);
    ctx.drawImage(cloudsCanvas, -panPx*0.10, 0, cssW, cssH);
    ctx.drawImage(cityCanvas, -panPx*0.20, 0, cssW, cssH);
    drawFloorLive(panPx);
  }

  function drawSunBaked(b, sun, pal){
    const { x: sx, y: sy, r } = sun;
    // bright halo out to 1.6r
    const haloBase = pal.sunHalo.replace(/[\d.]+\)$/,"");
    const halo = b.createRadialGradient(sx,sy,r*0.3, sx,sy,r*1.6);
    halo.addColorStop(0,pal.sunHalo); halo.addColorStop(1,haloBase+"0)");
    b.fillStyle = halo; b.beginPath(); b.arc(sx,sy,r*1.6,0,Math.PI*2); b.fill();
    b.save();
    b.beginPath(); b.arc(sx,sy,r,0,Math.PI*2); b.clip();
    const body = b.createLinearGradient(sx-r*0.7,sy-r*0.7, sx+r*0.7,sy+r*0.7);
    body.addColorStop(0,pal.sunColors[0]); body.addColorStop(0.55,pal.sunColors[1]); body.addColorStop(1,pal.sunColors[2]);
    b.fillStyle = body; b.fillRect(sx-r,sy-r,r*2,r*2);
    // thin 1px scanlines every 4px, very subtle — nothing else over the disc
    b.strokeStyle = "rgba(20,4,16,.15)"; b.lineWidth = 1;
    for (let yy = sy-r; yy <= sy+r; yy += 4){
      b.beginPath(); b.moveTo(sx-r,yy+0.5); b.lineTo(sx+r,yy+0.5); b.stroke();
    }
    b.restore();
  }

  // rect-vs-circle test used to keep clouds clear of the sun's disc + halo
  // (a circle of radius r*1.6) — closest-point distance, not a blanket
  // circle-circle radius sum (which would exclude almost the whole screen).
  function overlapsSun(sun, rx, ry, rw, rh){
    const haloR = sun.r*1.6;
    const dx = Math.max(Math.abs(rx-sun.x)-rw/2, 0);
    const dy = Math.max(Math.abs(ry-sun.y)-rh/2, 0);
    return (dx*dx+dy*dy) < haloR*haloR;
  }

  // one flat-bottomed, bump-topped cloud silhouette (classic pixel-cloud
  // shape): a flat rectangle base topped by several overlapping rounded
  // bumps, all one opaque fill — never semi-transparent, never pink.
  function drawCloudSilhouette(b, rng, cx, baseY, w, h, bumps, pal){
    b.fillStyle = pal.cloudColor;
    const flatH = h*0.5;
    b.fillRect(cx-w/2, baseY-flatH, w, flatH);
    // each bump gets its OWN radius, independently randomized (seeded via
    // `rng`, never Math.random()/per-frame) in 0.4-1.0x the cloud's total
    // height h — no two clouds (or two bumps) share the same size ratio, so
    // the silhouette reads as one varied outline instead of a repeating row
    // of identical scallops.
    const n = bumps;
    const by = baseY - flatH; // center sits at the flat top, so only the upper half pokes out
    for (let i=0;i<n;i++){
      const t = (i+0.5)/n;
      const bx = cx - w/2 + t*w;
      const r = h * (0.4 + rng()*0.6);
      b.beginPath(); b.arc(bx, by, r, 0, Math.PI*2); b.fill();
    }
  }

  // Clouds live well above the (now much lower, see drawCityBaked) skyline:
  // positioned by an explicit stepped band in the upper-middle sky with a
  // hard programmatic check against the city's own ceiling, rather than the
  // old fixed 50-68%-from-top band, which sat BEHIND/inside the city layer
  // (drawn first, then painted over) and was therefore invisible — this is
  // the actual bug the "must not touch/merge with the city" requirement is
  // guarding against; the fix is to guarantee a real vertical gap, not just
  // use the literal number that produced the overlap.
  function drawCloudsBaked(b, rng, sun, pal){
    const count = 4 + (rng()>0.5?1:0); // 4-5
    const cityCeilingY = groundPxY - cssH*0.45; // highest any building (incl. spires) can ever reach
    const gapPx = cssH*0.035;
    let placed = 0, tries = 0;
    while (placed < count && tries < 60){
      tries++;
      const w = cssW*(0.30+rng()*0.20);   // 30-50% of screen width
      const h = cssH*(0.03+rng()*0.02);   // 3-5% of screen height
      // left + center, some spilling past the left edge
      const cx = cssW*(0.04 + rng()*0.50);
      const step = placed / Math.max(1, count-1);
      const baseY = cssH*0.22 + step*cssH*0.14 + rng()*cssH*0.04; // staggered/stepped, ~22-40% from top
      if (baseY > cityCeilingY - gapPx) continue; // keep clear of the city with margin
      if (overlapsSun(sun, cx, baseY-h*0.4, w, h)) continue;
      drawCloudSilhouette(b, rng, cx, baseY, w, h, 3 + Math.floor(rng()*3), pal);
      placed++;
    }
  }

  const BUILDING_TOPS = ["spire","antenna","slant","pyramid","penthouse","dome"];

  // ONE city layer: 18-22 multi-part buildings packed edge-to-edge across
  // the full width. The bulk of buildings sit at 25-38% of screen height;
  // at most 3 get a needle spire on top, and even those never exceed 45% of
  // screen height total (the hard ceiling drawCloudsBaked's gap check also
  // relies on). Muted/dim per spec: darker silhouette, dimmer windows.
  function drawCityBaked(b, rng, pal){
    const count = 18 + Math.floor(rng()*5); // 18-22
    const cityBaseY = groundPxY; // buildings stand on the floor line
    const bulkMaxH = cssH*0.38;
    const hardMaxH = cssH*0.45; // absolute ceiling, spire buildings only
    const minH = cssH*0.25;
    const bw = cssW/count;

    const spireCount = 2 + (rng()>0.5?1:0); // 2-3, never more than 3
    const spireSlots = new Set();
    while (spireSlots.size < spireCount) spireSlots.add(Math.floor(rng()*Math.min(count, Math.ceil(count*0.5)))); // left half

    for (let i=0;i<count;i++){
      const w = bw*(0.98); // packed edge-to-edge
      const x = i*bw;
      const isSpireBuilding = spireSlots.has(i);
      let totalH = minH + rng()*(bulkMaxH-minH); // bulk: 25-38%
      if (isSpireBuilding) totalH = Math.min(hardMaxH, totalH + (hardMaxH-bulkMaxH)); // spire buildings only: up to 45%
      const topType = isSpireBuilding ? "spire" : BUILDING_TOPS[Math.floor(rng()*BUILDING_TOPS.length)];
      drawOneBuilding(b, rng, x, w, cityBaseY, totalH, topType, pal);
    }

    // light purple haze OVER the whole city band, so it reads as distant/hazy.
    // Bugfix (2026-10-03): this used to be a single flat-alpha fillRect, whose
    // hard top edge happened to land partway down the sun disc (hazeTop ≈
    // 0.41*cssH, inside the sun's y-range) and showed up as a hard horizontal
    // color-step cutting across the sun. Faded in from 0 alpha over a soft
    // band instead of starting at full alpha immediately, so there is no
    // discontinuity anywhere the haze crosses other baked layers.
    const hazeTop = cityBaseY - hardMaxH - cssH*0.02;
    const hazeFadeH = cssH*0.08;
    const hazeGrad = b.createLinearGradient(0, hazeTop, 0, hazeTop + hazeFadeH);
    hazeGrad.addColorStop(0, `rgba(${pal.hazeRGB},0)`);
    hazeGrad.addColorStop(1, `rgba(${pal.hazeRGB},.25)`);
    b.fillStyle = hazeGrad;
    b.fillRect(0, hazeTop, cssW, hazeFadeH);
    b.fillStyle = `rgba(${pal.hazeRGB},.25)`;
    b.fillRect(0, hazeTop + hazeFadeH, cssW, cityBaseY - hazeTop - hazeFadeH);
  }

  // one building: main body + 1-2 setback tiers + a top ornament, silhouette
  // + a thin 1px rim along roof edges only (both from the palette), a window
  // grid at ~15% lit, and some buildings get a full lit neon edge-stripe.
  function drawOneBuilding(b, rng, x, w, baseY, totalH, topType, pal){
    const SIL = pal.cityColor, RIM = pal.cityRoofRim;
    const nTiers = 1 + Math.floor(rng()*2); // 1 or 2 setback tiers above the body
    const topH = totalH*(0.10+rng()*0.06);
    const tierTotalH = totalH - topH;
    const bodyH = tierTotalH * (nTiers===1 ? 0.62 : 0.5);
    const parts = []; // {x,w,topY,h} bottom-up, each narrower than the last
    let curW = w, curBottomY = baseY, curH = bodyH;
    parts.push({ x: x+(w-curW)/2, w:curW, topY: curBottomY-curH, h:curH });
    curBottomY -= curH;
    for (let t=0;t<nTiers;t++){
      curW *= 0.72 - t*0.08;
      curH = (tierTotalH-bodyH)/nTiers;
      const px = x + (w-curW)/2 + (rng()-0.5)*w*0.1;
      parts.push({ x:px, w:curW, topY: curBottomY-curH, h:curH });
      curBottomY -= curH;
    }

    b.fillStyle = SIL;
    parts.forEach(p => b.fillRect(p.x, p.topY, p.w, p.h));

    // thin rim light along each part's roof edge only
    b.strokeStyle = RIM; b.lineWidth = 1;
    parts.forEach(p => { b.beginPath(); b.moveTo(p.x+0.5, p.topY+0.5); b.lineTo(p.x+p.w-0.5, p.topY+0.5); b.stroke(); });

    const top = parts[parts.length-1];
    drawBuildingTop(b, rng, top, topH, topType, totalH, pal);

    // windows on body + tiers (not the top ornament)
    parts.forEach(p => drawBuildingWindows(b, rng, p, pal));
    // a few buildings (roughly 8% chance each) get a full lit neon edge-stripe
    if (rng() < 0.08){
      const stripeCol = rng() > 0.5 ? "#ff5ad0" : "#22e6ff";
      const onRight = rng() > 0.5;
      const sx = onRight ? top.x + top.w - 1 : top.x + 1;
      b.save();
      b.shadowColor = stripeCol; b.shadowBlur = 4;
      b.strokeStyle = stripeCol; b.lineWidth = 1.4; b.globalAlpha = 0.9;
      b.beginPath(); b.moveTo(sx, baseY); b.lineTo(sx, parts[0].topY); b.stroke();
      b.restore();
    }
  }

  function drawBuildingTop(b, rng, top, topH, type, totalH, pal){
    const { x, w, topY } = top;
    b.fillStyle = pal.cityColor;
    if (type === "spire"){
      // capped at 25% of the building's OWN total height — short, not a needle
      const spireH = Math.min(totalH*0.25, topH*1.6);
      b.beginPath(); b.moveTo(x+w*0.5, topY-spireH); b.lineTo(x+w*0.62, topY); b.lineTo(x+w*0.38, topY); b.closePath(); b.fill();
    } else if (type === "antenna"){
      b.fillRect(x+w*0.47, topY-topH*1.8, w*0.06, topH*1.8);
      antennaLights.push({ x: x+w*0.5, y: topY-topH*1.8, phase: rng()*Math.PI*2 });
    } else if (type === "slant"){
      b.beginPath(); b.moveTo(x,topY+topH*0.3); b.lineTo(x+w*0.5,topY-topH*0.4); b.lineTo(x+w,topY+topH*0.3); b.closePath(); b.fill();
    } else if (type === "pyramid"){
      b.beginPath(); b.moveTo(x+w*0.5,topY-topH); b.lineTo(x+w,topY); b.lineTo(x,topY); b.closePath(); b.fill();
    } else if (type === "penthouse"){
      b.fillRect(x+w*0.2, topY-topH*0.8, w*0.6, topH*0.8);
    } else if (type === "dome"){
      b.beginPath(); b.arc(x+w*0.5, topY, w*0.5, Math.PI, 0); b.fill();
    }
    b.strokeStyle = pal.cityRoofRim; b.lineWidth = 1;
    b.beginPath(); b.moveTo(x+0.5, topY-topH*0.02); b.lineTo(x+w-0.5, topY-topH*0.02); b.stroke();
  }

  // window grid: 2x3px cells, 5x7px spacing, ~15% lit, alpha 0.5, restricted
  // to the palette's own cityWindow pair (no cyan) — dimmer and more muted
  // than before.
  function drawBuildingWindows(b, rng, p, pal){
    const { x, w, topY, h } = p;
    if (w < 6 || h < 8) return;
    b.save();
    b.beginPath(); b.rect(x, topY, w, h); b.clip();
    const marginX = 3, marginY = 3, cellW = 5, cellH = 7, winW = 2, winH = 3;
    const availW = w - marginX*2, availH = h - marginY*2;
    const cols = Math.max(1, Math.floor(availW/cellW));
    const rows = Math.max(1, Math.floor(availH/cellH));
    const startX = x + marginX + (availW - cols*cellW)/2;
    const startY = topY + marginY + (availH - rows*cellH)/2;
    const litColors = pal.cityWindow;
    for (let cx=0;cx<cols;cx++){
      for (let cy=0;cy<rows;cy++){
        if (rng() >= 0.15) continue; // ~15% lit
        const wx = startX + cx*cellW, wy = startY + cy*cellH;
        b.fillStyle = hexToRgba(litColors[Math.floor(rng()*litColors.length)], 0.5);
        b.fillRect(wx, wy, winW, winH);
      }
    }
    b.restore();
  }

  /* ----------------------------------------------------------------------
     FLOOR — drawn LIVE every frame (#2/#3, batch-1), not baked, because it
     must show real pit/gap terrain at the correct world-aligned screen
     position (via toPx) as the camera pans/zooms — a static baked image
     can't do that. `panPx` is drawBackgroundLayers()'s own camera-pan
     amount, reused here so the tile grid shifts at parallax factor 1.0
     (full rate — the floor IS the world, not a distant layer), while the
     pit holes below are positioned with an actual toPx() call, so they are
     always exactly where the physics ground gap really is.
     ---------------------------------------------------------------------- */
  function drawFloorLive(panPx){
    const b = ctx;
    // base of the city: soft glow fading upward smoothly — a gradient,
    // never a hard-edged band.
    const glowY0 = groundPxY, glowY1 = groundPxY - cssH*0.22;
    const bg = b.createLinearGradient(0,glowY0, 0,glowY1);
    bg.addColorStop(0,"rgba(154,58,208,.3)"); bg.addColorStop(1,"rgba(154,58,208,0)");
    b.fillStyle = bg; b.fillRect(0, glowY1, cssW, glowY0-glowY1);

    // base slab fill
    const fg = b.createLinearGradient(0,groundPxY,0,cssH);
    fg.addColorStop(0,palette.floorNear); fg.addColorStop(1,palette.floorFar);
    b.fillStyle = fg; b.fillRect(0,groundPxY,cssW,cssH-groundPxY);

    // tile-blocks in perspective: 1.5x0.5m tiles, seams from the palette,
    // front row lighter, shifted horizontally by the camera's own pan.
    const vpX = cssW*0.5;
    const tileW = 1.5*SCALE*camera.zoom, tileH = 0.5*SCALE*camera.zoom;
    const rows = Math.max(3, Math.ceil((cssH-groundPxY)/ (tileH*0.8)));
    b.strokeStyle = palette.floorSeam; b.lineWidth = 1;
    for (let j=0;j<=rows;j++){
      const t = j/rows;
      const ly = groundPxY + (cssH-groundPxY)*t;
      b.beginPath(); b.moveTo(0,ly); b.lineTo(cssW,ly); b.stroke();
      if (j < rows && j > 0){
        const ly2 = groundPxY + (cssH-groundPxY)*((j+1)/rows);
        const rowCol = j === rows-1 ? palette.floorFrontRow : null;
        if (rowCol){ b.fillStyle = rowCol; b.fillRect(0, ly, cssW, ly2-ly); }
      }
    }
    const cols = Math.ceil(cssW/tileW)+2;
    const bxOffset = -(panPx % tileW);
    for (let i=-2;i<=cols+1;i++){
      const bx = i*tileW + bxOffset;
      b.beginPath(); b.moveTo(bx, cssH); b.lineTo(vpX + (bx-vpX)*0.15, groundPxY); b.stroke();
    }

    // (reference pass) neon circuit traces etched into the floor: short
    // horizontal runs along the tile rows with a drop to the next row and a
    // node dot at each end. Deterministic per WORLD tile index (hash01), so
    // the pattern scrolls with the camera and never flickers.
    if (rows >= 3){
      b.save();
      b.globalCompositeOperation = "lighter";
      b.lineWidth = 1.4; b.lineCap = "round";
      const baseIdx = Math.floor(panPx / tileW);
      for (let i=-3;i<=cols+1;i++){
        const idx = baseIdx + i;
        if (hash01(idx*7.31 + 3.7) < 0.5) continue;
        const r0 = 1 + Math.floor(hash01(idx*3.17 + 1.1) * (rows-2));
        const len = 1 + Math.floor(hash01(idx*5.93 + 2.3) * 2.5);
        const y0 = groundPxY + (cssH-groundPxY)*((r0+0.5)/rows);
        const y1 = groundPxY + (cssH-groundPxY)*(Math.min(rows-0.5, r0+1.5)/rows);
        const x0 = i*tileW + bxOffset + tileW*0.3, x1 = x0 + len*tileW*0.9;
        const col = hash01(idx*1.7) > 0.5 ? palette.accentNeon1 : palette.accentNeon2;
        b.strokeStyle = col; b.fillStyle = col;
        b.globalAlpha = 0.18; b.lineWidth = 4;
        b.beginPath(); b.moveTo(x0,y0); b.lineTo(x1,y0); b.lineTo(x1+(y1-y0)*0.6,y1); b.stroke();
        b.globalAlpha = 0.7; b.lineWidth = 1.3;
        b.beginPath(); b.moveTo(x0,y0); b.lineTo(x1,y0); b.lineTo(x1+(y1-y0)*0.6,y1); b.stroke();
        b.globalAlpha = 0.9;
        b.beginPath(); b.arc(x0,y0,2,0,Math.PI*2); b.fill();
        b.beginPath(); b.arc(x1+(y1-y0)*0.6,y1,2,0,Math.PI*2); b.fill();
      }
      b.restore();
    }

    // thin soft reflected highlight from the sky color, right at the horizon
    const refl = b.createLinearGradient(0,groundPxY, 0,groundPxY+cssH*0.05);
    refl.addColorStop(0,"rgba(122,60,200,.35)"); refl.addColorStop(1,"rgba(122,60,200,0)");
    b.fillStyle = refl; b.fillRect(0,groundPxY,cssW,cssH*0.05);

    // Pit/gap terrain (#2): dark hole + neon rim, drawn exactly where the
    // physics ground segments actually leave a gap — see `pits` (built
    // from levelDef.pits at scene creation).
    for (const p of pits){
      const xa = toPx(p.x0, groundTopM).x, xb = toPx(p.x1, groundTopM).x;
      if (xb < -5 || xa > cssW+5) continue;
      b.fillStyle = "#05030c";
      b.fillRect(xa, groundPxY, Math.max(0,xb-xa), cssH-groundPxY);
      b.save();
      b.shadowColor = palette.accentNeon2; b.shadowBlur = 10;
      b.strokeStyle = palette.accentNeon2; b.lineWidth = 2.5;
      b.beginPath(); b.moveTo(xa,groundPxY+1); b.lineTo(xa, cssH); b.stroke();
      b.beginPath(); b.moveTo(xb,groundPxY+1); b.lineTo(xb, cssH); b.stroke();
      b.shadowColor = palette.accentNeon1; b.strokeStyle = palette.accentNeon1; b.lineWidth = 1.6;
      b.beginPath(); b.moveTo(xa,groundPxY+3); b.lineTo(xb,groundPxY+3); b.stroke();
      b.restore();
    }

    // thin neon edge trim along the floor's front (bottom) edge
    b.save();
    b.shadowColor = palette.accentNeon1; b.shadowBlur = 6;
    b.strokeStyle = palette.accentNeon1; b.lineWidth = 2;
    b.beginPath(); b.moveTo(0,cssH-1.5); b.lineTo(cssW,cssH-1.5); b.stroke();
    b.restore();
  }

  function drawAntennaLightsLive(){
    for (const a of antennaLights){
      const alpha = 0.3 + 0.55*((Math.sin(sceneTime*0.035 + a.phase)+1)/2); // smooth, ~2.3-3s period
      ctx.fillStyle = "#ff4d4d";
      ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.arc(a.x,a.y,1.6,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      drawGlow(ctx, a.x, a.y, 7, "#ff4d4d", alpha*0.5);
    }
  }

  /* ---- block sprites: fully baked lighting (light always from the upper
     right — fixed, never varies), 4 texture variants per (material,size)
     picked by block id. No gradients or randomness at draw time. ---- */
  const spriteCache = new Map();
  function getBlockSprite(mat, w, h, variant, shape){
    const key = mat+"_"+w+"_"+h+"_"+variant+"_"+(shape||"box")+"_"+SCALE.toFixed(2);
    let spr = spriteCache.get(key);
    if (spr) return spr;
    const wpx = Math.max(4, Math.round(w*SCALE)), hpx = Math.max(4, Math.round(h*SCALE));
    const pad = 4;
    const oc = document.createElement("canvas");
    oc.width = wpx+pad*2; oc.height = hpx+pad*2;
    const o = oc.getContext("2d");
    o.translate(pad, pad);
    const isBeam = w >= h*2;
    const seed = w*31.7 + h*53.1 + variant*101.3;
    const tone = 1 + (hash01(seed+40)-0.5)*0.12;
    let neonColor = null, neonEdge = null;

    if (mat === "glass"){
      o.globalAlpha = 0.55;
      const g = o.createLinearGradient(0,0,wpx,hpx);
      g.addColorStop(0,"#1c3a52"); g.addColorStop(0.5,"#2f5d82"); g.addColorStop(1,"#163044");
      o.fillStyle = g; o.fillRect(0,0,wpx,hpx);
      o.globalAlpha = 1;
      o.save(); o.beginPath(); o.rect(0,0,wpx,hpx); o.clip();
      const refl = o.createRadialGradient(wpx*0.7,hpx*0.25,2, wpx*0.7,hpx*0.25,wpx*0.7);
      refl.addColorStop(0,"rgba(255,200,160,.25)"); refl.addColorStop(1,"rgba(255,200,160,0)");
      o.fillStyle = refl; o.fillRect(0,0,wpx,hpx);
      o.restore();
      o.strokeStyle = "rgba(170,230,255,.8)"; o.lineWidth = Math.max(1,wpx*0.02);
      o.strokeRect(0.5,0.5,wpx-1,hpx-1);
      o.save();
      o.beginPath(); o.rect(0,0,wpx,hpx); o.clip();
      const hg = o.createLinearGradient(0,0,wpx*0.5,hpx);
      hg.addColorStop(0,"rgba(255,255,255,0)");
      hg.addColorStop(0.5,"rgba(255,255,255,.4)");
      hg.addColorStop(1,"rgba(255,255,255,0)");
      o.fillStyle = hg;
      o.beginPath();
      o.moveTo(-hpx*0.3,0); o.lineTo(hpx*0.15,0); o.lineTo(wpx*0.6,hpx); o.lineTo(wpx*0.15,hpx);
      o.closePath(); o.fill();
      o.restore();
    } else {
      /* (2026-10-04, reference pass) industrial scaffold look: a dark
         riveted steel FRAME with a recessed inner panel, X cross-bracing on
         metal crates (split into stacked cells on tall blocks), a glowing
         slot on concrete panels, a truss on long beams, and a thin neon
         trim. Everything is deterministic per block (hash01 on the seed),
         baked once into the cached sprite — no per-frame cost. */
      const isBoard = shape === "board" || shape === "platform" || isBeam;
      const isConcrete = mat === "concrete";
      const m = Math.min(wpx, hpx);
      const fw = Math.max(2.5, Math.min(8, m*0.16));          // frame thickness, px
      neonColor = isConcrete ? "#ff2bd6" : (hash01(seed+13) > 0.45 ? "#22e6ff" : "#ff2bd6");
      const frameTop = shade(isConcrete ? "#5a4a62" : "#55506e", tone);
      const frameBot = shade(isConcrete ? "#3a2e44" : "#34304a", tone);
      const inner0 = isConcrete ? "#2a2132" : "#221f33", inner1 = isConcrete ? "#1a1420" : "#15131f";

      // recessed inner panel
      const ig = o.createLinearGradient(0,0,0,hpx);
      ig.addColorStop(0, inner0); ig.addColorStop(1, inner1);
      o.fillStyle = ig; o.fillRect(0,0,wpx,hpx);

      const ix = fw, iy = fw, iw = wpx-2*fw, ih = hpx-2*fw;
      const braceCol = shade(isConcrete ? "#4a3c52" : "#463f5e", tone);
      const brace = (x0,y0,x1,y1,wid) => {
        o.strokeStyle = "rgba(0,0,0,.55)"; o.lineWidth = wid+2;
        o.beginPath(); o.moveTo(x0,y0+1); o.lineTo(x1,y1+1); o.stroke();
        o.strokeStyle = braceCol; o.lineWidth = wid;
        o.beginPath(); o.moveTo(x0,y0); o.lineTo(x1,y1); o.stroke();
        o.strokeStyle = "rgba(255,255,255,.12)"; o.lineWidth = 1;
        o.beginPath(); o.moveTo(x0,y0-wid*0.35); o.lineTo(x1,y1-wid*0.35); o.stroke();
      };

      if (isBoard && iw > 6 && ih > 2){
        // beam: a zig-zag truss between two chords
        o.save(); o.beginPath(); o.rect(ix,iy,iw,ih); o.clip();
        const n = Math.max(1, Math.round(iw / Math.max(ih*1.6, 10)));
        const step = iw / n;
        for (let i=0;i<n;i++){
          const x0 = ix + i*step;
          brace(x0, i%2 ? iy+ih : iy, x0+step, i%2 ? iy : iy+ih, Math.max(1.5, fw*0.55));
        }
        o.restore();
      } else if (!isConcrete && iw > 8 && ih > 8){
        // metal crate: X-brace per roughly-square cell
        const cells = Math.max(1, Math.round(ih / Math.max(iw, 1)));
        const ch = ih / cells;
        o.save(); o.beginPath(); o.rect(ix,iy,iw,ih); o.clip();
        for (let c=0;c<cells;c++){
          const cy = iy + c*ch;
          const bw = Math.max(1.5, Math.min(iw,ch)*0.13);
          brace(ix, cy, ix+iw, cy+ch, bw);
          brace(ix+iw, cy, ix, cy+ch, bw);
          if (c > 0){ // horizontal strut between cells
            o.fillStyle = frameBot; o.fillRect(ix, cy-fw*0.35, iw, fw*0.7);
          }
        }
        o.restore();
      } else if (isConcrete && iw > 8 && ih > 8){
        // concrete panel: horizontal seams + a recessed glowing slot
        o.strokeStyle = "rgba(0,0,0,.45)"; o.lineWidth = 1;
        const seams = Math.max(1, Math.floor(ih / 22));
        for (let i=1;i<=seams;i++){ const y = iy + ih*i/(seams+1); o.beginPath(); o.moveTo(ix,y); o.lineTo(ix+iw,y); o.stroke(); }
        const sw = Math.min(iw*0.6, 40), sh = Math.max(3, Math.min(ih*0.14, 7));
        const sx = ix + (iw - sw)/2, sy = iy + ih*(0.3 + hash01(seed+77)*0.4) - sh/2;
        o.fillStyle = "#0a0710"; o.fillRect(sx-1.5, sy-1.5, sw+3, sh+3);
        o.save(); o.shadowColor = neonColor; o.shadowBlur = 8;
        o.fillStyle = neonColor; o.globalAlpha = 0.9; o.fillRect(sx, sy, sw, sh);
        o.restore();
        o.fillStyle = "rgba(255,255,255,.55)"; o.fillRect(sx+1, sy+0.5, sw-2, Math.max(1, sh*0.25));
      }

      // the frame itself: 4 bevelled bars
      const fg = o.createLinearGradient(0,0,0,hpx);
      fg.addColorStop(0, frameTop); fg.addColorStop(1, frameBot);
      o.fillStyle = fg;
      o.fillRect(0,0,wpx,fw); o.fillRect(0,hpx-fw,wpx,fw);
      o.fillRect(0,fw,fw,hpx-2*fw); o.fillRect(wpx-fw,fw,fw,hpx-2*fw);
      o.fillStyle = "rgba(255,255,255,.22)"; o.fillRect(0,0,wpx,1.5); o.fillRect(0,0,1.5,hpx);          // lit top/left edge
      o.fillStyle = "rgba(0,0,0,.45)"; o.fillRect(0,hpx-1.5,wpx,1.5); o.fillRect(wpx-1.5,0,1.5,hpx);    // shaded bottom/right
      o.strokeStyle = "rgba(0,0,0,.5)"; o.lineWidth = 1; o.strokeRect(ix+0.5, iy+0.5, Math.max(0,iw-1), Math.max(0,ih-1)); // inner lip

      // rivets in the frame corners (and mid-span on long sides)
      if (fw >= 3){
        const rr = Math.max(0.9, fw*0.22);
        const pts = [[fw/2,fw/2],[wpx-fw/2,fw/2],[fw/2,hpx-fw/2],[wpx-fw/2,hpx-fw/2]];
        if (wpx > 70){ pts.push([wpx/2,fw/2],[wpx/2,hpx-fw/2]); }
        if (hpx > 70){ pts.push([fw/2,hpx/2],[wpx-fw/2,hpx/2]); }
        for (const [rx,ry] of pts){
          o.fillStyle = "rgba(0,0,0,.5)"; o.beginPath(); o.arc(rx+0.6,ry+0.6,rr,0,Math.PI*2); o.fill();
          o.fillStyle = "#8f88a8"; o.beginPath(); o.arc(rx,ry,rr,0,Math.PI*2); o.fill();
        }
      }

      // neon trim: beams glow along the bottom chord, crates/panels along
      // one vertical inner edge, plus a small indicator light on crates
      o.save();
      o.shadowColor = neonColor; o.shadowBlur = 7;
      o.strokeStyle = neonColor; o.lineWidth = Math.max(1.5, fw*0.35);
      if (isBoard){
        neonEdge = "bottom";
        o.beginPath(); o.moveTo(fw, hpx-fw*0.5); o.lineTo(wpx-fw, hpx-fw*0.5); o.stroke();
      } else {
        const onRight = hash01(seed+21) > 0.5;
        neonEdge = onRight ? "right" : "left";
        const x = onRight ? wpx-fw*0.5 : fw*0.5;
        o.beginPath(); o.moveTo(x, hpx*0.12); o.lineTo(x, hpx*0.88); o.stroke();
        if (!isConcrete && iw > 14 && ih > 14 && hash01(seed+31) > 0.35){
          const ls = Math.max(3, Math.min(iw, ih)*0.16);
          const lx = onRight ? ix + 3 : ix + iw - ls - 3, ly = iy + 3;
          o.fillStyle = "#0a0710"; o.fillRect(lx-1, ly-1, ls+2, ls+2);
          o.fillStyle = hash01(seed+33) > 0.5 ? "#ff2bd6" : "#22e6ff"; o.fillRect(lx, ly, ls, ls);
        }
      }
      o.restore();
      // warm rim from the sun side (upper right), like the rest of the scene
      o.strokeStyle = "rgba(255,154,106,.35)"; o.lineWidth = 1.5;
      o.beginPath(); o.moveTo(wpx-0.75, 1); o.lineTo(wpx-0.75, hpx-1); o.stroke();
    }
    // 3px dark outline around the whole sprite, all materials
    o.strokeStyle = "#0b0816"; o.lineWidth = 3;
    o.strokeRect(1.5, 1.5, wpx-3, hpx-3);
    spr = { canvas: oc, pad, neonColor, neonEdge, w, h };
    spriteCache.set(key, spr);

  }
  function shade(hex, tone){
    const n = parseInt(hex.slice(1),16);
    let r=(n>>16)&255, g=(n>>8)&255, bl=n&255;
    r=Math.max(0,Math.min(255,r*tone)); g=Math.max(0,Math.min(255,g*tone)); bl=Math.max(0,Math.min(255,bl*tone));
    return `rgb(${r|0},${g|0},${bl|0})`;
  }
  function hexToRgba(hex, a){
    const n = parseInt(hex.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }
  function applyShadeAndRim(o, wpx, hpx){
    // light is always from the upper right — baked once, fixed forever
    const shadeG = o.createLinearGradient(0,0,wpx,hpx);
    shadeG.addColorStop(0,"rgba(0,0,0,.22)"); shadeG.addColorStop(0.45,"rgba(0,0,0,0)");
    o.fillStyle = shadeG; o.fillRect(0,0,wpx,hpx);
    const aoH = Math.max(6, Math.min(hpx*0.3, 12));
    const aoG = o.createLinearGradient(0,hpx-aoH,0,hpx);
    aoG.addColorStop(0,"rgba(0,0,0,0)"); aoG.addColorStop(1,"rgba(0,0,0,.4)");
    o.fillStyle = aoG; o.fillRect(0,hpx-aoH,wpx,aoH);
    // rim light — only the right edge, 2px, warm color (no top/left strokes)
    o.strokeStyle = "rgba(255,154,106,.6)"; o.lineWidth = 2;
    o.beginPath(); o.moveTo(wpx-1,1); o.lineTo(wpx-1,hpx-1); o.stroke();
  }

  // local vertex lists in METERS (y-up, physics convention) → px (y-down)
  function drawPolyLocal(vertsM, fillStyle, strokeStyle, lineWidth){
    ctx.beginPath();
    vertsM.forEach((v,i) => {
      const x = v.x*SCALE, y = -v.y*SCALE;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = fillStyle; ctx.fill();
    if (strokeStyle){ ctx.strokeStyle = strokeStyle; ctx.lineWidth = lineWidth||1; ctx.stroke(); }
  }
  function drawCircleBlock(rec, pp, ang){
    const rpx = rec.r*SCALE;
    const matDef = MATERIALS[rec.mat];
    ctx.save();
    ctx.translate(pp.x, pp.y); ctx.rotate(-ang);
    const g = ctx.createRadialGradient(-rpx*0.3,-rpx*0.35,rpx*0.1, 0,0,rpx);
    g.addColorStop(0, "#5a5870"); g.addColorStop(0.6,"#2c2a3a"); g.addColorStop(1,"#141220");
    ctx.beginPath(); ctx.arc(0,0,rpx,0,Math.PI*2); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "#0d0a18"; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = matDef.glow; ctx.lineWidth = Math.max(1.5, rpx*0.12);
    ctx.beginPath(); ctx.arc(0,0,rpx*0.82,0,Math.PI*2); ctx.stroke();
    // spoke rivets so the rotation reads clearly
    ctx.fillStyle = "rgba(255,255,255,.3)";
    for (let i=0;i<4;i++){ const a=i*Math.PI/2; ctx.beginPath(); ctx.arc(Math.cos(a)*rpx*0.55, Math.sin(a)*rpx*0.55, Math.max(1,rpx*0.08),0,Math.PI*2); ctx.fill(); }
    if (rec.crackStage>=1){ ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-rpx*0.3,-rpx*0.2); ctx.lineTo(rpx*0.1,0); ctx.lineTo(-rpx*0.1,rpx*0.3); ctx.stroke(); }
    ctx.restore();
  }
  function drawTriBlock(rec, pp, ang){
    const matDef = MATERIALS[rec.mat];
    // "wedge" (dynamic/destructible) and "rampStatic" (indestructible
    // terrain primitive, #2) share the same right-triangle silhouette.
    const verts = rec.shape === "tri" ? triVerts(rec.w, rec.h) : rightTriVerts(rec.w, rec.h, rec.mirror);
    const vertsM = verts.map(v => ({x:v.x, y:v.y}));
    ctx.save();
    ctx.translate(pp.x, pp.y); ctx.rotate(-ang);
    const g = ctx.createLinearGradient(0,-rec.h*SCALE/2,0,rec.h*SCALE/2);
    g.addColorStop(0, matDef.glass?"#2f5d82":"#4a4656"); g.addColorStop(1, matDef.glass?"#163044":"#242129");
    drawPolyLocal(vertsM, g, "#0d0a18", 3);
    if (!matDef.glass){
      // (reference pass) inset frame + corner rivets, same language as the crates
      const inset = vertsM.map(v => ({ x:v.x*0.68, y:v.y*0.68 }));
      drawPolyLocal(inset, "rgba(10,7,16,.55)", "rgba(255,255,255,.10)", 1);
      ctx.fillStyle = "#8f88a8";
      for (const v of vertsM){ ctx.beginPath(); ctx.arc(v.x*0.82*SCALE, -v.y*0.82*SCALE, Math.max(0.9, SCALE*0.035), 0, Math.PI*2); ctx.fill(); }
    }
    drawPolyLocal(vertsM, "rgba(0,0,0,0)", matDef.glow, Math.max(1, SCALE*0.03));
    if (rec.crackStage>=1){ ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-rec.w*SCALE*0.2,0); ctx.lineTo(rec.w*SCALE*0.1,rec.h*SCALE*0.2); ctx.stroke(); }
    ctx.restore();
  }
  function drawBlock(rec){
    if (rec.dead) return;
    const p = rec.body.getPosition();
    const ang = rec.body.getAngle();
    const pp = toPx(p.x, p.y);

    if (rec.shape === "circle"){ drawCircleBlock(rec, pp, ang); return; }
    if (rec.shape === "tri" || rec.shape === "wedge" || rec.shape === "rampStatic"){ drawTriBlock(rec, pp, ang); return; }

    const wpx = rec.w*SCALE, hpx = rec.h*SCALE;
    const spr = getBlockSprite(rec.mat, rec.w, rec.h, rec.variant, rec.shape);

    // Roof platform (#2, batch-1): cosmetic support legs/struts drawn
    // UNDERNEATH the slab, in world space, before the slab sprite itself —
    // these are pure decoration (no physics bodies), so they always track
    // the platform's live position/angle like everything else here.
    if (rec.shape === "platform"){
      ctx.save();
      ctx.translate(pp.x, pp.y);
      ctx.rotate(-ang);
      const legCol = "#2a2838", legW = Math.max(2, hpx*0.22);
      ctx.strokeStyle = legCol; ctx.lineWidth = legW; ctx.lineCap = "round";
      const downPx = (groundPxY - toPx(0, groundTopM).y); // not used directly; legs just reach toward the floor
      const legBottomY = (groundPxY - pp.y); // local-space distance down to the floor line (platform isn't rotated in practice)
      if (rec.legStyle === "pillars"){
        [-0.32, 0.32].forEach(f => {
          ctx.beginPath(); ctx.moveTo(wpx*f, hpx*0.4); ctx.lineTo(wpx*f, hpx*0.4 + Math.min(legBottomY*0.6, hpx*3)); ctx.stroke();
        });
      } else {
        ctx.beginPath(); ctx.moveTo(-wpx*0.38, hpx*0.4); ctx.lineTo(0, hpx*0.4+Math.min(legBottomY*0.55, hpx*2.6)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(wpx*0.38, hpx*0.4); ctx.lineTo(0, hpx*0.4+Math.min(legBottomY*0.55, hpx*2.6)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-wpx*0.38, hpx*0.4+Math.min(legBottomY*0.55, hpx*2.6)*0.55); ctx.lineTo(wpx*0.38, hpx*0.4+Math.min(legBottomY*0.55, hpx*2.6)*0.55); ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.translate(pp.x, pp.y);
    ctx.rotate(-ang);
    ctx.drawImage(spr.canvas, -wpx/2-spr.pad, -hpx/2-spr.pad);

    // live glow over the baked neon edge so it actually reads as glowing,
    // not just a flat bright line — small fixed radius per spec, drawn in
    // the block's own (already rotated) local space.
    if (spr.neonColor){
      let gx = 0, gy = 0;
      if (spr.neonEdge === "bottom") gy = hpx/2;
      else if (spr.neonEdge === "right") gx = wpx/2;
      else if (spr.neonEdge === "left") gx = -wpx/2;
      drawGlow(ctx, gx, gy, 10, spr.neonColor, 0.6);
    }


    if (rec.crackStage >= 1){
      ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-wpx*0.2,-hpx*0.3); ctx.lineTo(wpx*0.05,0); ctx.lineTo(-wpx*0.1,hpx*0.3);
      ctx.stroke();
    }
    if (rec.crackStage >= 2){
      ctx.beginPath();
      ctx.moveTo(wpx*0.25,-hpx*0.35); ctx.lineTo(0,hpx*0.05); ctx.lineTo(wpx*0.3,hpx*0.35);
      ctx.stroke();
    }
    ctx.restore();

    // no live glow blotch here — the neon's light is a narrow strip baked
    // directly into the sprite itself (see getBlockSprite), not a radial spot
  }

  // decorative niche glass — a static backdrop sprite with NO body, drawn
  // UNDER the coin (see render() draw order): never physically overlaps
  // anything, so it can never eject the coin.
  function drawDecor(rec){
    const pp = toPx(rec.x, rec.y);
    const wpx = rec.w*SCALE, hpx = rec.h*SCALE;
    ctx.save();
    ctx.translate(pp.x, pp.y);
    ctx.globalAlpha = 0.5;
    const g = ctx.createLinearGradient(-wpx/2,-hpx/2,wpx/2,hpx/2);
    g.addColorStop(0,"#1c3a52"); g.addColorStop(0.5,"#2f5d82"); g.addColorStop(1,"#163044");
    ctx.fillStyle = g; ctx.fillRect(-wpx/2,-hpx/2,wpx,hpx);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "rgba(170,230,255,.5)"; ctx.lineWidth = Math.max(1,wpx*0.02);
    ctx.strokeRect(-wpx/2,-hpx/2,wpx,hpx);
    ctx.restore();
  }

  // blinking tip lights on antenna/spire blocks — same smooth sine pulse as
  // the background's antenna lights, no flicker
  function drawSpireLights(){
    for (const s of spireLights){
      if (!s.rec || s.rec.dead) continue;
      const p = s.rec.body.getPosition();
      const pp = toPx(p.x, p.y + s.dy);
      const alpha = 0.35 + 0.55*((Math.sin(sceneTime*0.05 + p.x)+1)/2);
      ctx.fillStyle = "#ff4d4d"; ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.arc(pp.x, pp.y, Math.max(2,SCALE*0.05), 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      drawGlow(ctx, pp.x, pp.y, 8, "#ff4d4d", alpha*0.5);
    }
  }

  function drawCoinSymbol(key, s, color){
    color = color || "rgba(255,255,255,.95)";
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1.4, s*0.16);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (key === "bitcoin"){
      ctx.beginPath(); ctx.moveTo(-s*0.18,-s*0.75); ctx.lineTo(-s*0.18, s*0.75); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s*0.18,-s*0.65);
      ctx.quadraticCurveTo(s*0.55,-s*0.65, s*0.55,-s*0.18);
      ctx.quadraticCurveTo(s*0.55, s*0.05, -s*0.18, s*0.05);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s*0.18, s*0.05);
      ctx.quadraticCurveTo(s*0.6, s*0.05, s*0.6, s*0.45);
      ctx.quadraticCurveTo(s*0.6, s*0.75, -s*0.18, s*0.75);
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*0.08,-s*0.95); ctx.lineTo(s*0.08,-s*0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*0.08, s*0.6); ctx.lineTo(s*0.08, s*0.95); ctx.stroke();
    } else if (key === "ethereum"){
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.moveTo(0,-s*0.95); ctx.lineTo(s*0.5,-s*0.08); ctx.lineTo(0,s*0.05); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.moveTo(0,-s*0.95); ctx.lineTo(-s*0.5,-s*0.08); ctx.lineTo(0,s*0.05); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.65;
      ctx.beginPath(); ctx.moveTo(0,s*0.15); ctx.lineTo(s*0.5,s*0.42); ctx.lineTo(0,s*0.85); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.32;
      ctx.beginPath(); ctx.moveTo(0,s*0.15); ctx.lineTo(-s*0.5,s*0.42); ctx.lineTo(0,s*0.85); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (key === "solana"){
      ctx.fillStyle = color;
      function bar(cy, skew){
        ctx.beginPath();
        ctx.moveTo(-s*0.7+skew, cy-s*0.11);
        ctx.lineTo(s*0.7+skew, cy-s*0.11);
        ctx.lineTo(s*0.55+skew, cy+s*0.11);
        ctx.lineTo(-s*0.85+skew, cy+s*0.11);
        ctx.closePath(); ctx.fill();
      }
      bar(-s*0.5, s*0.08); bar(0,0); bar(s*0.5,-s*0.08);
    } else if (key === "ripple"){
      // stylized two-arc "wings" mark — swooping curves meeting at the
      // center, deliberately NOT a straight-line X
      ctx.beginPath();
      ctx.moveTo(-s*0.75,-s*0.7);
      ctx.quadraticCurveTo(-s*0.15,-s*0.5, 0,-s*0.05);
      ctx.quadraticCurveTo(s*0.15,-s*0.5, s*0.75,-s*0.7);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s*0.75, s*0.7);
      ctx.quadraticCurveTo(-s*0.15, s*0.5, 0, s*0.05);
      ctx.quadraticCurveTo(s*0.15, s*0.5, s*0.75, s*0.7);
      ctx.stroke();
    }
    ctx.restore();
  }

  // smooth sine pulse, brightness amplitude only (no size/scale change) —
  // swings between 0.85 and 1.0, i.e. at most a 15% brightness change
  function coinPulse(){ return 0.925 + 0.075*Math.sin(sceneTime*0.05); }

  // Coin per-network symbol colors (lighter than the disc, used for the
  // crisp centered symbol — see drawCoinSymbol calls below).
  const COIN_SYMBOL_COLOR = {
    bitcoin:"#ffb02a", ethereum:"#a259ff", solana:"#0c2442", ripple:"#ff3ac8",
  };
  function drawCoinAt(xm, ym, key){
    const net = NETWORKS[key];
    const pp = toPx(xm, ym);
    const r = COIN_R*SCALE;
    const pulse = coinPulse();
    // glow drawn BEHIND the coin, radius 1.7x the coin radius, brightest
    // object after the sun
    drawGlow(ctx, pp.x, pp.y, r*1.7, net.rim || net.color, 0.8*pulse);
    ctx.save();
    ctx.translate(pp.x, pp.y);
    // (reference pass) bright neon halo ring around the coin — additive
    // strokes, no per-frame shadowBlur
    {
      const neon = COIN_NEON[key] || net.rim || net.color;
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = neon;
      ctx.globalAlpha = 0.22*pulse; ctx.lineWidth = Math.max(4, r*0.34);
      ctx.beginPath(); ctx.arc(0,0,r*1.1,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 0.45*pulse; ctx.lineWidth = Math.max(2.5, r*0.16);
      ctx.beginPath(); ctx.arc(0,0,r*1.05,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 0.95; ctx.lineWidth = Math.max(1.2, r*0.06);
      ctx.beginPath(); ctx.arc(0,0,r*1.03,0,Math.PI*2); ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.globalAlpha = pulse;

    // layered, glossy structure: dark outline -> outer ring (light color) ->
    // thin dark groove -> disc (main color) -> symbol. No white blob/smudge.
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fillStyle = "#0d0a18"; ctx.fill(); // 3px dark outline, via the ring sitting inset on top
    const ringCol = net.rim || net.color;
    ctx.beginPath(); ctx.arc(0,0,r-1.5,0,Math.PI*2); ctx.fillStyle = ringCol; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,r*0.82,0,Math.PI*2); ctx.fillStyle = "#0d0a18"; ctx.fill(); // thin dark groove
    ctx.beginPath(); ctx.arc(0,0,r*0.76,0,Math.PI*2); ctx.fillStyle = net.color; ctx.fill(); // main disc

    // gloss: top half of the disc lighter via a linear gradient, clipped to the disc
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r*0.76,0,Math.PI*2); ctx.clip();
    const glossG = ctx.createLinearGradient(0,-r*0.76,0,r*0.76);
    glossG.addColorStop(0,"rgba(255,255,255,.28)"); glossG.addColorStop(0.5,"rgba(255,255,255,0)"); glossG.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = glossG; ctx.fillRect(-r,-r,r*2,r*2);
    ctx.restore();

    // narrow white highlight arc along the top edge of the ring, alpha 0.6
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = Math.max(1, r*0.07);
    ctx.beginPath(); ctx.arc(0,0, r*0.94, Math.PI*1.08, Math.PI*1.92); ctx.stroke();

    ctx.globalAlpha = 1;
    // embossed/raised symbol: dark shadow offset + crisp lighter symbol on top
    const symR = r*0.55;
    ctx.save(); ctx.translate(1.2,1.2); ctx.globalAlpha = 0.35; drawCoinSymbol(key, symR, "#000000"); ctx.restore();
    drawCoinSymbol(key, symR, COIN_SYMBOL_COLOR[key]);

    // "Life"/juice (#4): a sheen/highlight streak sweeps across the coin
    // every ~3.5s — purely visual (no physics, coins never bob). Each
    // coin's phase is offset by a stable hash of its world x so the whole
    // level's coins don't all sheen in unison. sceneTime increments once
    // per step() tick (~60/s), so periodMs below is really period-in-ticks.
    const periodTicks = 210; // ~3.5s at 60 ticks/s
    const phaseOffset = Math.floor(hash01(xm*13.7)*periodTicks);
    const tick = (sceneTime + phaseOffset) % periodTicks;
    const sweepWindow = 36; // the streak is visible for the first ~0.6s of each cycle
    if (tick < sweepWindow){
      const st = tick/sweepWindow; // 0..1 across the sweep
      ctx.save();
      ctx.beginPath(); ctx.arc(0,0,r*0.76,0,Math.PI*2); ctx.clip();
      const sx = -r*1.3 + st*r*2.6;
      const sheenG = ctx.createLinearGradient(sx-r*0.35,-r, sx+r*0.35,r);
      sheenG.addColorStop(0,"rgba(255,255,255,0)");
      sheenG.addColorStop(0.5,`rgba(255,255,255,${0.55*(1-Math.abs(st-0.5)*1.4)})`);
      sheenG.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle = sheenG;
      ctx.fillRect(-r,-r,r*2,r*2);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawAmmoAt(xm, ym, angle, rM){
    const pp = toPx(xm, ym);
    const r = (rM != null ? rM : AMMO_R)*SCALE;
    ctx.save();
    ctx.translate(pp.x,pp.y);
    ctx.rotate(-angle);
    const grad = ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.15, 0,0,r);
    grad.addColorStop(0,"#4a5570"); grad.addColorStop(0.55,"#1c2130"); grad.addColorStop(1,"#07080f");
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle = grad; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.stroke();
    ctx.strokeStyle = "rgba(186,246,255,.9)"; ctx.lineWidth = Math.max(1,r*0.14);
    ctx.beginPath(); ctx.arc(0,0,r*0.78,0,Math.PI*2); ctx.stroke();
    const coreG = ctx.createRadialGradient(0,0,0, 0,0,r*0.4);
    coreG.addColorStop(0,"#bdf6ff"); coreG.addColorStop(1,"rgba(34,230,255,0)");
    ctx.fillStyle = coreG; ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
    drawGlow(ctx, pp.x, pp.y, r*2, "#22e6ff", 0.25);
  }

  // groundYM (optional, batch-3): the world-m height this shadow is cast
  // onto — defaults to the true ground (groundTopM/groundPxY) exactly as
  // before for every existing call site; only the elevated slingshot's own
  // shadow (drawSlingshot, below) passes standTopM so its shadow lands on
  // the platform it's actually standing on instead of the true ground far
  // below it.
  function drawShadowAtWorldX(xm, halfWPx, alpha, groundYM){
    const gy = groundYM != null ? toPx(xm, groundYM).y : groundPxY;
    const gx = toPx(xm, groundYM != null ? groundYM : groundTopM).x;
    const sw = halfWPx*2.6, sh = sw*0.5;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(shadowSprite, gx-sw/2-halfWPx*0.22, gy-sh*0.35, sw, sh);
    ctx.restore();
  }

  /* ---- slingshot geometry helpers: everything drawn as FILLED shapes
     (quadratic-bezier ribbons), never thin strokes for the structure
     itself — only thin accents (bevel/rim/neon) are stroked on top. ---- */
  function quadPoint(p0,p1,p2,t){
    const mt = 1-t;
    return { x: mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x, y: mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y };
  }
  function strokePolyline(pts, color, width){
    if (width <= 0) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  }
  // Fills a tapered ribbon along a quadratic bezier (p0->pc->p2), width
  // easing from w0 (at p0) to w1 (at p2). Returns the two edge polylines so
  // callers can add a bevel/rim/neon stroke along whichever edge they need.
  function fillTaperedCurve(p0, pc, p2, w0, w1, fillStyle){
    const N = 14;
    const left = [], right = [];
    for (let i=0;i<=N;i++){
      const t = i/N;
      const pt = quadPoint(p0,pc,p2,t);
      const tN = Math.min(1, t+0.01);
      const ptN = quadPoint(p0,pc,p2,tN);
      let dx = ptN.x-pt.x, dy = ptN.y-pt.y;
      const len = Math.hypot(dx,dy) || 1; dx/=len; dy/=len;
      const nx = -dy, ny = dx;
      const w = (w0 + (w1-w0)*t)/2;
      left.push({ x: pt.x+nx*w, y: pt.y+ny*w });
      right.push({ x: pt.x-nx*w, y: pt.y-ny*w });
    }
    ctx.beginPath();
    ctx.moveTo(left[0].x, left[0].y);
    for (let i=1;i<left.length;i++) ctx.lineTo(left[i].x, left[i].y);
    for (let i=right.length-1;i>=0;i--) ctx.lineTo(right[i].x, right[i].y);
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.fill();
    ctx.strokeStyle = "#0d0a18"; ctx.lineWidth = 3; ctx.stroke();
    return { left, right };
  }
  function darkMetalGradient(p0, p2){
    const g = ctx.createLinearGradient(p0.x,p0.y,p2.x,p2.y);
    g.addColorStop(0,"#3e3c55"); g.addColorStop(1,"#232133");
    return g;
  }
  // Physical left/right edges regardless of which way the curve bends, so
  // "bevel on the left, rim on the right" always lands on the correct side.
  function physicalEdges(poly){
    const avgL = poly.left.reduce((s,p)=>s+p.x,0)/poly.left.length;
    const avgR = poly.right.reduce((s,p)=>s+p.x,0)/poly.right.length;
    return avgL <= avgR ? { leftEdge: poly.left, rightEdge: poly.right } : { leftEdge: poly.right, rightEdge: poly.left };
  }
  function drawCapsule(tipPt, awayFromPt, color, lengthM){
    const lenPx = lengthM*SCALE;
    let dx = tipPt.x-awayFromPt.x, dy = tipPt.y-awayFromPt.y;
    const l = Math.hypot(dx,dy) || 1; dx/=l; dy/=l;
    const cx = tipPt.x + dx*lenPx*0.25, cy = tipPt.y + dy*lenPx*0.25;
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(Math.atan2(dy,dx));
    ctx.fillStyle = color;
    // rounded capsule end cap, 0.4m (long axis) x 0.55m (thickness) per spec
    ctx.beginPath(); ctx.ellipse(0,0, Math.max(2,0.2*SCALE), Math.max(2,0.275*SCALE), 0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    drawGlow(ctx, cx, cy, lenPx*2.0, color, 0.55);
  }
  function drawBand(fromPx, toPx_, thicknessPx){
    ctx.strokeStyle = "rgba(20,4,10,.9)"; ctx.lineWidth = thicknessPx*1.35;
    ctx.beginPath(); ctx.moveTo(fromPx.x,fromPx.y); ctx.lineTo(toPx_.x,toPx_.y); ctx.stroke();
    ctx.strokeStyle = "#ff3a5c"; ctx.lineWidth = thicknessPx;
    ctx.beginPath(); ctx.moveTo(fromPx.x,fromPx.y); ctx.lineTo(toPx_.x,toPx_.y); ctx.stroke();
  }
  function drawPouchLeather(pt){
    // large black 0.9x0.6m "bowl", drawn a bit oversized + offset down so it
    // visibly cradles the ammo ball instead of being fully hidden behind it
    const wPx = 1.15*SCALE, hPx = 0.75*SCALE;
    const by = pt.y + hPx*0.18;
    ctx.fillStyle = "#17100f";
    ctx.beginPath(); ctx.ellipse(pt.x, by, wPx/2, hPx/2, 0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#0d0a18"; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(pt.x-wPx*0.18, by-hPx*0.15, wPx*0.22, hPx*0.3, -0.4, 0, Math.PI*2); ctx.stroke();
  }

  let pouchReleaseT = -1;
  let pouchReleaseFromM = { x: anchorM.x, y: anchorM.y };

  function drawSlingshot(){
    // (batch-3) every one of these is measured from standTopM (= groundTopM
    // + anchorLiftM) rather than bare groundTopM, so the whole cosmetic
    // pedestal/leg/horn stack starts at wherever the shooter is actually
    // standing — the true ground when anchorLiftM is 0 (every level before
    // level 6), or the top of the level's own elevated platform otherwise.
    // anchorM itself (the physics-exact pull/launch origin) already bakes
    // anchorLiftM in and is completely untouched here.
    const tip = toPx(anchorM.x, anchorM.y); // ammo's true rest point — physics-exact, never fudged
    const groundPx = toPx(anchorM.x, standTopM);
    const splitPx = toPx(anchorM.x, standTopM + SPLIT_H_M);
    const tipHalfPx = (TIP_SPREAD_M/2)*SCALE;
    const hornBasePx = HORN_THICK_M*SCALE, hornTipPx = HORN_TIP_THICK_M*SCALE;
    const legPx = LEG_THICK_M*SCALE;
    const baseBotWPx = BASE_BOTTOM_W_M*SCALE, baseMidWPx = BASE_MID_W_M*SCALE, baseTopWPx = BASE_TOP_W_M*SCALE, baseHPx = BASE_H_M*SCALE;
    const tipYPx = toPx(anchorM.x, standTopM + TIP_H_M).y;
    const leftTip = { x: tip.x - tipHalfPx, y: tipYPx };
    const rightTip = { x: tip.x + tipHalfPx, y: tipYPx };
    const leftCtrl = { x: splitPx.x - tipHalfPx*0.6, y: splitPx.y - (splitPx.y - tipYPx)*0.5 };
    const rightCtrl = { x: splitPx.x + tipHalfPx*0.6, y: splitPx.y - (splitPx.y - tipYPx)*0.5 };

    ctx.save(); ctx.lineCap="round"; ctx.lineJoin="round";

    drawShadowAtWorldX(anchorM.x, baseBotWPx*0.55, 0.4, standTopM);

    // ---- base: massive two-step pedestal, bolts, magenta/cyan neon stripes ----
    const stepY = groundPx.y - baseHPx*0.5; // split between the two steps
    const topY = groundPx.y - baseHPx;
    const baseGrad = ctx.createLinearGradient(tip.x-baseBotWPx/2,0, tip.x+baseBotWPx/2,0);
    baseGrad.addColorStop(0,"#3a3850"); baseGrad.addColorStop(0.5,"#201e30"); baseGrad.addColorStop(1,"#13111c");
    // step 1 (bottom, wider)
    ctx.beginPath();
    ctx.moveTo(tip.x-baseBotWPx/2, groundPx.y);
    ctx.lineTo(tip.x+baseBotWPx/2, groundPx.y);
    ctx.lineTo(tip.x+baseMidWPx/2, stepY);
    ctx.lineTo(tip.x-baseMidWPx/2, stepY);
    ctx.closePath();
    ctx.fillStyle = baseGrad; ctx.fill();
    ctx.strokeStyle = "#0d0a18"; ctx.lineWidth = 3; ctx.stroke();
    // step 2 (top, narrower)
    ctx.beginPath();
    ctx.moveTo(tip.x-baseMidWPx/2, stepY);
    ctx.lineTo(tip.x+baseMidWPx/2, stepY);
    ctx.lineTo(tip.x+baseTopWPx/2, topY);
    ctx.lineTo(tip.x-baseTopWPx/2, topY);
    ctx.closePath();
    ctx.fillStyle = baseGrad; ctx.fill();
    ctx.strokeStyle = "#0d0a18"; ctx.lineWidth = 3; ctx.stroke();
    // bolts along the step-1 face
    ctx.fillStyle = "rgba(230,230,240,.5)";
    [-0.28,0.28].forEach(f=>{ ctx.beginPath(); ctx.arc(tip.x+baseBotWPx*f, groundPx.y-baseHPx*0.22, Math.max(1.6,baseHPx*0.1),0,Math.PI*2); ctx.fill(); });
    // magenta/cyan neon stripes, one per step
    ctx.strokeStyle = "#22e6ff"; ctx.lineWidth = Math.max(1.6,baseHPx*0.1);
    ctx.beginPath(); ctx.moveTo(tip.x-baseTopWPx*0.38, topY+ (groundPx.y-topY)*0.22); ctx.lineTo(tip.x+baseTopWPx*0.38, topY+ (groundPx.y-topY)*0.22); ctx.stroke();
    ctx.strokeStyle = "#ff2bd6";
    ctx.beginPath(); ctx.moveTo(tip.x-baseBotWPx*0.4, groundPx.y-baseHPx*0.12); ctx.lineTo(tip.x+baseBotWPx*0.4, groundPx.y-baseHPx*0.12); ctx.stroke();
    drawGlow(ctx, tip.x, groundPx.y-baseHPx*0.3, baseBotWPx*0.5, "#22e6ff", 0.15);

    // ---- leg: filled, straight (quad with midpoint control = a straight ribbon) ----
    const legBaseM = { x: tip.x, y: topY };
    const legMid = { x: (legBaseM.x+splitPx.x)/2, y: (legBaseM.y+splitPx.y)/2 };
    const legPoly = fillTaperedCurve(legBaseM, legMid, splitPx, legPx, legPx*0.92, darkMetalGradient(legBaseM, splitPx));
    { const { leftEdge, rightEdge } = physicalEdges(legPoly);
      // light highlight strip along the left side of the tube
      strokePolyline(leftEdge, "rgba(255,255,255,.3)", Math.max(1.5, legPx*0.12));
      strokePolyline(rightEdge, "rgba(255,154,106,.5)", Math.max(1, legPx*0.1));
      // 2 short neon inlays on the leg: one magenta, one cyan
      const inlayA = leftEdge.slice(Math.floor(leftEdge.length*0.18), Math.floor(leftEdge.length*0.38));
      const inlayB = rightEdge.slice(Math.floor(rightEdge.length*0.55), Math.floor(rightEdge.length*0.75));
      ctx.save(); ctx.shadowBlur = 6;
      ctx.shadowColor = "#ff2bd6"; strokePolyline(inlayA, "#ff2bd6", Math.max(1.5, legPx*0.14));
      ctx.shadowColor = "#22e6ff"; strokePolyline(inlayB, "#22e6ff", Math.max(1.5, legPx*0.14));
      ctx.restore(); }

    function drawHorn(tipPt, ctrlPt, isLeft){
      const poly = fillTaperedCurve(splitPx, ctrlPt, tipPt, hornBasePx, hornTipPx, darkMetalGradient(splitPx, tipPt));
      const { leftEdge, rightEdge } = physicalEdges(poly);
      strokePolyline(leftEdge, "rgba(255,255,255,.22)", Math.max(1, hornBasePx*0.14));
      strokePolyline(rightEdge, "rgba(255,154,106,.55)", Math.max(1, hornBasePx*0.14));
      const outer = isLeft ? leftEdge : rightEdge;
      strokePolyline(outer, isLeft ? "#ff2bd6" : "#22e6ff", Math.max(2, hornBasePx*0.2));
    }

    // draw order (as specified): right horn → back band → pouch → ammo → front band → left horn
    drawHorn(rightTip, rightCtrl, false);
    drawCapsule(rightTip, splitPx, "#22e6ff", 0.4);

    const pullFrac = ammoBody ? Math.min(1, Math.hypot(ammoBody.getPosition().x-anchorM.x, ammoBody.getPosition().y-anchorM.y)/MAX_PULL_M) : 0;
    const bandThickPx = BAND_THICK_M*SCALE * (1 - pullFrac*0.5); // thinner the more it's stretched

    let pouchM;
    if (ammoBody){
      pouchM = ammoBody.getPosition();
    } else if (pouchReleaseT >= 0 && (sceneTime - pouchReleaseT) < 18){
      const t = (sceneTime - pouchReleaseT)/18;
      const damp = Math.exp(-t*4) * Math.sin(t*Math.PI*3) * 0.05;
      const ease = Math.max(0,1-t)*0.4;
      pouchM = {
        x: anchorM.x + (pouchReleaseFromM.x-anchorM.x)*ease + damp,
        y: anchorM.y + (pouchReleaseFromM.y-anchorM.y)*ease + damp,
      };
    } else {
      pouchM = anchorM;
    }
    const pouch = toPx(pouchM.x, pouchM.y);
    const sagPx = (0.12*SCALE) * (1-pullFrac); // slight rest sag, vanishes once taut
    const pouchDraw = { x: pouch.x, y: pouch.y + sagPx };

    drawBand(rightTip, pouchDraw, bandThickPx);     // back band
    drawPouchLeather(pouchDraw);                     // pouch
    if (ammoBody) drawAmmoAt(pouchM.x, pouchM.y, ammoBody.getAngle()); // ammo — exact physics position, no sag
    drawBand(leftTip, pouchDraw, bandThickPx);       // front band

    drawHorn(leftTip, leftCtrl, true);
    drawCapsule(leftTip, splitPx, "#ff2bd6", 0.4);

    ctx.restore();
    drawReserveAmmo();
  }

  function drawReserveAmmo(){
    // reserve ammo — pictures only, no physics; a row to the LEFT of the
    // base, never touching it, and always kept at x >= 0.6 (drawn smaller
    // so several fit in the tight space between the world edge and the base)
    const reserve = AMMO_CHARGES - chargesUsed - (ammoBody ? 1 : 0);
    if (reserve <= 0) return;
    const previewR = 0.3;
    const rightBound = (anchorM.x - BASE_BOTTOM_W_M/2) - 0.1 - previewR; // just left of the base
    const leftBound = 0.6 + previewR;                                    // left edge never below x=0.6
    const span = Math.max(0, rightBound - leftBound);
    for (let i=0;i<reserve;i++){
      const t = reserve === 1 ? 1 : i/(reserve-1);
      // standTopM (batch-3), not bare groundTopM, so these icons sit beside
      // the base wherever it actually stands (true ground normally, or the
      // level's elevated platform when anchorLiftM is set) instead of
      // floating down at true-ground height under a lifted slingshot.
      drawAmmoAt(rightBound - t*span, standTopM + previewR*0.8, 0, previewR);
    }
  }

  function drawShadows(){
    for (const rec of blocks){
      if (rec.dead) continue;
      const p = rec.body.getPosition();
      const halfWPx = Math.max(rec.w,rec.h*0.6)*SCALE*0.5;
      drawShadowAtWorldX(p.x, halfWPx, (p.y-groundTopM) < 1.2 ? 0.4 : 0.3);
    }
    if (flying){
      const p = flying.getPosition();
      const heightM = p.y - groundTopM;
      if (heightM < 3){
        const alpha = 0.3 * (1 - heightM/3);
        if (alpha > 0.02) drawShadowAtWorldX(p.x, AMMO_R*SCALE*0.9, alpha);
      }
    } else if (ammoBody){
      drawShadowAtWorldX(ammoBody.getPosition().x, AMMO_R*SCALE*0.9, 0.3);
    }
  }

  // static scanline pattern tile, built once
  let scanTile = null;
  function ensureScanTile(){
    if (scanTile) return;
    scanTile = document.createElement("canvas");
    scanTile.width = 1; scanTile.height = 3;
    const sctx = scanTile.getContext("2d");
    sctx.fillStyle = "rgba(0,0,0,1)"; sctx.fillRect(0,0,1,1);
  }
  function postFX(){
    const rg = ctx.createRadialGradient(cssW/2,cssH/2,Math.min(cssW,cssH)*0.3, cssW/2,cssH/2, Math.max(cssW,cssH)*0.75);
    rg.addColorStop(0,"rgba(0,0,0,0)"); rg.addColorStop(1,"rgba(0,0,0,.35)");
    ctx.fillStyle = rg; ctx.fillRect(0,0,cssW,cssH);

    ensureScanTile();
    ctx.save(); ctx.globalAlpha = 0.06; ctx.fillStyle = ctx.createPattern(scanTile,"repeat"); ctx.fillRect(0,0,cssW,cssH); ctx.restore();

    ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(120,90,200,.06)"; ctx.fillRect(0,0,cssW,cssH); ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = "screen"; ctx.fillStyle = "rgba(255,170,120,.04)"; ctx.fillRect(0,0,cssW,cssH); ctx.restore();
  }

  let emaFPS = 60, lastFrameT = performance.now();
  function render(){
    const now = performance.now();
    const dtMs = now - lastFrameT; lastFrameT = now;
    const fps = dtMs>0 ? 1000/dtMs : 60;
    emaFPS = emaFPS*0.9 + fps*0.1;

    ctx.clearRect(0,0,cssW,cssH);
    ctx.save();
    if (shakeTime > 0) ctx.translate((Math.random()-0.5)*shakeTime*8, (Math.random()-0.5)*shakeTime*8);

    drawBackgroundLayers();
    drawAntennaLightsLive();
    drawAmbientFX();
    drawShadows();

    if (dragging && ammoBody){
      for (const pt of trajectoryPoints()){
        const pp = toPx(pt.x, pt.y);
        ctx.globalAlpha = pt.a*0.8;
        ctx.fillStyle = "#22e6ff";
        ctx.beginPath(); ctx.arc(pp.x, pp.y, 2.6, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    for (let i=0;i<trail.length;i++){
      const tpx = toPx(trail[i].x, trail[i].y);
      ctx.globalAlpha = (i/trail.length)*0.5;
      ctx.fillStyle = "#b388ff";
      ctx.beginPath(); ctx.arc(tpx.x,tpx.y, 2.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const d of debris){
      const pp = toPx(d.x, d.y);
      const sz = d.size*SCALE;
      ctx.save();
      ctx.globalAlpha = d.fade;
      ctx.translate(pp.x,pp.y); ctx.rotate(d.rot);
      const matDef = MATERIALS[d.mat] || MATERIALS.metal;
      ctx.fillStyle = matDef.glass ? "rgba(70,150,190,.6)" : (d.mat==="concrete" ? "#3a3640" : "#34323f");
      ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth=1;
      if (d.shape === "circle"){
        ctx.beginPath(); ctx.arc(0,0,sz*0.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
      } else if (d.shape === "tri"){
        ctx.beginPath(); ctx.moveTo(0,-sz*0.6); ctx.lineTo(sz*0.55,sz*0.4); ctx.lineTo(-sz*0.55,sz*0.4); ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else {
        ctx.fillRect(-sz/2,-sz/2,sz,sz*0.75);
        ctx.strokeRect(-sz/2,-sz/2,sz,sz*0.75);
      }
      ctx.restore();
    }

    drawSlingshot();
    for (const rec of decor){
      // never draw a niche-glass backdrop once every block it's linked to
      // (its flanking pillars/beams) has been destroyed — it must die with
      // the structure it belongs to, never hang on its own as an orphan.
      if (rec.linkedBlocks && rec.linkedBlocks.length && rec.linkedBlocks.every(b => b.dead)) continue;
      drawDecor(rec);
    }
    for (const rec of blocks) drawBlock(rec);
    for (const c of coins) if (!c.dead){ const cp = c.body.getPosition(); drawCoinAt(cp.x, cp.y, c.key); }
    drawSpireLights();
    if (flying) drawAmmoAt(flying.getPosition().x, flying.getPosition().y, flying.getAngle());

    for (const pt of particles){
      const pp = toPx(pt.x, pt.y);
      ctx.globalAlpha = Math.max(0, pt.life);
      if (pt.kind === "spark"){
        ctx.strokeStyle = pt.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pp.x,pp.y); ctx.lineTo(pp.x-pt.vx*2, pp.y-pt.vy*2); ctx.stroke();
      } else if (pt.kind === "shard"){
        ctx.save(); ctx.translate(pp.x,pp.y); ctx.rotate(pt.rot);
        const s = pt.size*SCALE;
        ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0,pt.life*0.8);
        ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*0.8,s*0.6); ctx.lineTo(-s*0.8,s*0.6); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth=1; ctx.stroke();
        ctx.restore();
      } else if (pt.kind === "flash"){
        const rr = (1-pt.life)*pt.size*SCALE*3 + pt.size*SCALE;
        drawGlow(ctx, pp.x, pp.y, rr, pt.color, 0.5*pt.life);
      } else {
        ctx.save(); ctx.translate(pp.x,pp.y); ctx.rotate(pt.rot);
        const s = pt.size*SCALE;
        ctx.fillStyle = pt.color; ctx.fillRect(-s/2,-s/2,s,s);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    for (const d of dust){
      const dp = toPx(d.x, d.y);
      ctx.globalAlpha = Math.max(0, d.life*0.3);
      ctx.fillStyle = "#8a7aa8";
      ctx.beginPath(); ctx.arc(dp.x,dp.y,d.r*SCALE,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const r of rings){
      const pp = toPx(r.x, r.y);
      const rr = (1-r.life)*r.maxR*SCALE;
      ctx.globalAlpha = Math.max(0, r.life*0.7);
      ctx.strokeStyle = r.color; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(pp.x,pp.y,rr,0,Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const ft of floatTexts){
      const pp = toPx(ft.x, ft.y);
      ctx.globalAlpha = Math.max(0, ft.life);
      drawGlow(ctx, pp.x, pp.y, 22, ft.color, 0.3*ft.life);
      ctx.font = "800 20px system-ui";
      ctx.textAlign = "center";
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, pp.x, pp.y);
    }
    ctx.globalAlpha = 1;

    // Combo text (#4): bigger, glowing, briefly scales in then fades.
    for (const ct of comboTexts){
      const pp = toPx(ct.x, ct.y);
      const scale = ct.life > 0.85 ? 1 + (1-((1-ct.life)/0.15))*0.4 : 1;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, ct.life*1.3));
      ctx.translate(pp.x, pp.y - 30);
      ctx.scale(scale, scale);
      drawGlow(ctx, 0, 0, 44, "#ffcc33", 0.6*ct.life);
      ctx.font = "900 26px system-ui";
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffcc33";
      ctx.fillText(ct.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    postFX();

    if (showFPS) fpsCounterEl.textContent = "FPS: " + Math.round(emaFPS);
  }

  buildBackground();
  if (!SNAPSHOT) raf = requestAnimationFrame(step);

  // (stage 2) one-frame render for the menu, into a fresh offscreen canvas.
  //   kind "rest"  -> the normal resting framing, full frame (menu bg)
  //   kind "thumb" -> camera framed on the target structure only (blocks +
  //                   coins, excluding anything under the slingshot), then
  //                   cropped to outW:outH with a strip of floor below.
  function snapshot(kind, outW, outH){
    const off = document.createElement("canvas");
    off.width = Math.round(cssW*dpr); off.height = Math.round(cssH*dpr);
    const offCtx = off.getContext("2d");
    offCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let crop = null;
    if (kind === "thumb"){
      let minX = Infinity, maxX = -Infinity, maxY = groundTopM + 1;
      const skipX = anchorM.x + 3; // the slingshot's own stand (level 6's roof) is not "the structure"
      for (const rec of blocks){
        for (let f = rec.body.getFixtureList(); f; f = f.getNext()){
          const bb = f.getAABB(0);
          if (bb.upperBound.x < skipX) continue;
          minX = Math.min(minX, bb.lowerBound.x); maxX = Math.max(maxX, bb.upperBound.x);
          maxY = Math.max(maxY, bb.upperBound.y);
        }
      }
      for (const c of coins){
        const cp = c.body.getPosition();
        minX = Math.min(minX, cp.x-COIN_R); maxX = Math.max(maxX, cp.x+COIN_R); maxY = Math.max(maxY, cp.y+COIN_R);
      }
      if (!isFinite(minX)){ minX = 0; maxX = VISIBLE_W_M; }
      const A = outW/outH, FLOOR_M = 0.9;
      const Wm = maxX-minX, Hm = maxY-groundTopM;
      const visW = Math.max(Wm*1.12, (Hm*1.08 + FLOOR_M + 0.6)*A);
      camera.zoom = VISIBLE_W_M / visW;
      camera.camX = (minX+maxX)/2 - visW/2;
      const sc = SCALE*camera.zoom;
      const cropHpx = cssW / A;
      const bottom = Math.min(cssH, groundPxY + FLOOR_M*sc);
      crop = { x:0, y:Math.max(0, bottom - cropHpx), w:cssW, h:cropHpx };
    } else {
      camera.camX = CAM_LEFT_M; camera.zoom = 1;
    }
    camera.state = "resting"; camera.easing = false;
    const savedCtx = ctx;
    ctx = offCtx;
    try { render(); } finally { ctx = savedCtx; }
    if (!crop) return off;
    const out = document.createElement("canvas");
    out.width = outW; out.height = outH;
    out.getContext("2d").drawImage(off, crop.x*dpr, crop.y*dpr, crop.w*dpr, crop.h*dpr, 0, 0, outW, outH);
    return out;
  }

  return {
    snapshot,
    // Test/QA hook (used by the automated balance sweep): fire the loaded
    // ammo at `angleDeg` above horizontal with `pullFrac` (0..1) of the max
    // pull, exactly as a finger release would. Game rules are unaffected.
    __debug: {
      shoot(angleDeg, pullFrac){
        if (!ammoBody || flying || dragging) return false;
        const a = angleDeg*Math.PI/180, pull = Math.max(0, Math.min(1, pullFrac))*MAX_PULL_M;
        ammoBody.setPosition(planck.Vec2(anchorM.x - Math.cos(a)*pull, anchorM.y - Math.sin(a)*pull));
        return releaseShot();
      },
      wakeAll(){ for (const r of blocks) if (!r.dead) r.body.setAwake(true); },
      state(){
        return {
          ready: !!ammoBody && !flying && !settledTimer,
          flying: !!flying, shotMaxX, chargesUsed, charges: AMMO_CHARGES,
          coinsAlive: coins.filter(c => !c.dead).length, coinsTotal: coins.length,
          blocksAlive: blocks.filter(b => !b.dead && !b.terrain).length,
          coins: coins.map(c => ({ x:+c.x.toFixed(2), y:+c.y.toFixed(2), dead:c.dead, reason:c.reason, tick:c.deadAtTick })),
          tick: sceneTime,
          anchor: { x:anchorM.x, y:anchorM.y },
        };
      },
    },
    onResize(){
      computeCamera();
      spriteCache.clear();
      buildBackground();
    },
    destroy(){
      destroyed = true;
      if (raf) cancelAnimationFrame(raf);
      canvas.removeEventListener("pointerdown", onDown);
      canvas.removeEventListener("pointermove", onMove);
      canvas.removeEventListener("pointerup", onUp);
      canvas.removeEventListener("pointercancel", onUp);
    }
  };
}
</script>
</body>
</html>
