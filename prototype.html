<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger Quest Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#22e6ff; --magenta:#ff2bd6; --violet:#b388ff; --gold:#ffcc33;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden; background:#0d0620; overscroll-behavior:none;}
  body{
    font-family:"Segoe UI", Roboto, system-ui, sans-serif;
    color:#eaf6ff;
    touch-action:none; user-select:none;
  }
  /* #stage fills the whole window and centers the single 9:16 #app box.
     #app itself is sized in pixels by JS (resizeCanvas) — no vh/dvh/min()
     — and is the ONE container every screen (menu/game/win/lose) lives in,
     so the menu can never render at full-window width while the game sits
     in a smaller framed box: there is only one frame. */
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#0d0620; overflow:hidden;
  }
  #app{
    position:relative;
    background:#0d0620; overflow:hidden;
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- MENU (stage 2) — level 1's real scene, rendered once by the
     game's own renderer (createScene snapshot mode), blurred/darkened behind
     everything; content scrolls in .menu-scroll above it. ---------- */
  #levels-wrap{background:#0d0620;}
  #menu-bg{
    position:absolute; inset:-14px; width:calc(100% + 28px); height:calc(100% + 28px);
    filter:blur(5px) brightness(.42) saturate(1.2); opacity:0; transition:opacity .6s;
    pointer-events:none;
  }
  #menu-bg.ready{opacity:1;}
  .menu-shade{
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(179,136,255,.18), transparent 60%),
      linear-gradient(180deg, rgba(13,6,32,.25) 0%, rgba(13,6,32,.55) 45%, rgba(13,6,32,.85) 100%);
  }
  .menu-scroll{
    position:relative; flex:1; overflow-y:auto; overflow-x:hidden;
    padding:18px 16px 28px; touch-action:pan-y; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .menu-scroll::-webkit-scrollbar{display:none;}

  /* neon logo */
  .logo{text-align:center; margin:4px 0 14px; animation:fadeDown .6s ease-out both;}
  .logo-main{
    font-family:"Russo One","Segoe UI",sans-serif; font-size:30px; letter-spacing:3px; line-height:1;
    color:#d9fbff;
    text-shadow:0 0 4px #fff, 0 0 10px var(--cyan), 0 0 22px var(--cyan), 0 0 42px rgba(34,230,255,.6);
  }
  .logo-sub{
    display:inline-flex; align-items:center; gap:10px; margin-top:8px;
    font-family:"Russo One","Segoe UI",sans-serif; font-size:17px; letter-spacing:9px; padding-left:9px;
    color:#ffd6f6;
    text-shadow:0 0 4px #fff, 0 0 10px var(--magenta), 0 0 24px var(--magenta);
    animation:neonFlicker 5s infinite;
  }
  .logo-sub i{display:block; width:26px; height:0; border-top:2px solid var(--magenta); box-shadow:0 0 8px var(--magenta);}
  @keyframes neonFlicker{
    0%,18%,22%,62%,64%,100%{opacity:1;}
    20%,63%{opacity:.45;}
  }
  @keyframes fadeDown{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:none;}}
  @keyframes cardIn{from{opacity:0; transform:translateY(18px) scale(.94);} to{opacity:1; transform:none;}}
  @keyframes shakeX{0%,100%{transform:none;} 20%,60%{transform:translateX(-6px);} 40%,80%{transform:translateX(6px);}}

  /* profile plate */
  .profile{
    display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:6px;
    border-radius:16px; border:1px solid rgba(179,136,255,.45);
    background:linear-gradient(135deg, rgba(40,20,70,.82), rgba(14,8,32,.82));
    box-shadow:0 0 18px rgba(179,136,255,.22), 0 0 0 1px rgba(0,0,0,.35) inset;
    animation:cardIn .5s .08s ease-out both;
  }
  .pf-ava{
    flex:none; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Russo One",sans-serif; font-size:20px; color:#fff;
    border:2px solid var(--cyan); box-shadow:0 0 10px var(--cyan), 0 0 10px var(--cyan) inset;
    background:radial-gradient(circle at 35% 30%, #3a2a6a, #120a26);
  }
  .pf-body{flex:1; min-width:0;}
  .pf-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .pf-name{font-weight:800; font-size:15px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pf-stars{font-family:"Russo One",sans-serif; font-size:15px; color:var(--gold); text-shadow:0 0 8px rgba(255,204,51,.7); white-space:nowrap;}
  .pf-stars small{color:#b9a46a; font-size:12px;}
  .pf-bonus-label{font-size:11px; color:#9aa4c4; margin-top:6px;}
  .pf-bonus{font-family:"Russo One",sans-serif; font-size:15px; color:#6cffb0; text-shadow:0 0 8px rgba(61,255,154,.6);}
  .pf-bonus small{font-family:"Segoe UI",sans-serif; font-size:11px; color:#9aa4c4; text-shadow:none;}
  .pf-bar{height:5px; border-radius:3px; margin-top:5px; background:rgba(255,255,255,.08); overflow:hidden;}
  .pf-bar > div{height:100%; width:0; border-radius:3px; background:linear-gradient(90deg,#3dff9a,#22e6ff); box-shadow:0 0 8px #3dff9a; transition:width .8s ease-out;}

  /* difficulty sections — each sets --sec (its neon color) for its cards */
  .sec{margin-top:18px;}
  .sec-head{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
    animation:cardIn .45s ease-out both;
  }
  .sec-title{
    font-family:"Russo One",sans-serif; font-size:15px; letter-spacing:2px; color:#fff;
    text-shadow:0 0 6px var(--sec), 0 0 16px var(--sec);
  }
  .sec-line{flex:1; height:0; border-top:1px dashed var(--sec); opacity:.6;}
  .sec-info{font-size:10.5px; color:#b6bdd8; white-space:nowrap;}
  .sec-info b{color:var(--sec); font-weight:700;}
  .sec-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}

  .lv-card{
    position:relative; border-radius:14px; padding:8px 8px 9px; cursor:pointer;
    background:linear-gradient(165deg, rgba(30,16,56,.92), rgba(10,6,24,.94));
    border:1.5px solid var(--sec);
    box-shadow:0 0 10px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.4) inset;
    box-shadow:0 0 12px color-mix(in srgb, var(--sec) 45%, transparent), 0 0 0 1px rgba(0,0,0,.4) inset;
    animation:cardIn .5s ease-out both;
    transition:transform .15s;
  }
  .lv-card:active{transform:scale(.97);}
  .lv-card.locked{border-color:rgba(150,150,180,.28); box-shadow:none; cursor:default;}
  .lv-card.locked:active{transform:none;}
  .lv-card.in{animation:none;}
  .lv-card.shake{animation:shakeX .35s ease-in-out;}
  .lv-top{display:flex; align-items:baseline; gap:6px; margin:0 2px 6px;}
  .lv-num{font-family:"Russo One",sans-serif; font-size:15px; color:#fff; text-shadow:0 0 8px var(--sec);}
  .lv-name{font-size:11.5px; font-weight:700; color:#dfe6ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lv-card.locked .lv-num{text-shadow:none; color:#8a88a6;}
  .lv-card.locked .lv-name{color:#7d7b98;}
  .lv-thumb{
    position:relative; border-radius:9px; overflow:hidden; aspect-ratio:9/5;
    background:linear-gradient(180deg,#24124a,#0f0824);
    border:1px solid rgba(255,255,255,.08);
  }
  .lv-thumb canvas{position:absolute; inset:0; width:100%; height:100%; opacity:0; transition:opacity .4s;}
  .lv-thumb canvas.ready{opacity:1;}
  .lv-card.locked .lv-thumb canvas{filter:grayscale(.85) brightness(.45);}
  .lv-mid{display:flex; align-items:center; justify-content:space-between; gap:4px; margin-top:6px;}
  .lv-chips{display:flex; gap:6px; font-size:10px; font-weight:700; color:#c9d2ee; white-space:nowrap;}
  .lv-card.locked .lv-chips{color:#7d7b98;}
  .lv-lock{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:#c9c7e6; font-size:10px; font-weight:700;}
  .lv-lock svg{width:26px; height:26px; filter:drop-shadow(0 0 6px rgba(201,199,230,.5));}
  .lv-stars{display:flex; gap:3px; font-size:16px; line-height:1;}
  .lv-stars span{color:rgba(255,255,255,.16);}
  .lv-stars span.on{color:var(--gold); text-shadow:0 0 6px rgba(255,204,51,.9), 0 0 14px rgba(255,170,40,.6);}
  .lv-foot{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px; margin-top:6px;}
  .lv-foot > *{flex:none;}
  .lv-best{font-size:10px; color:#9aa4c4; white-space:nowrap;}
  .lv-best b{color:#eaf6ff; font-weight:700;}
  .lv-badge{
    font-size:9.5px; font-weight:800; white-space:nowrap; padding:2px 6px; border-radius:8px;
    color:var(--sec); border:1px solid var(--sec); background:rgba(255,255,255,.05);
    background:color-mix(in srgb, var(--sec) 12%, transparent);
  }
  .lv-card.locked .lv-badge{color:#7d7b98; border-color:rgba(150,150,180,.3); background:none;}
  @media (prefers-reduced-motion: reduce){
    .logo,.profile,.sec-head,.lv-card,.logo-sub{animation:none !important;}
  }

  /* ---------- game screen — #game-wrap IS #app's full size now, no inner wrapper ---------- */
  canvas{display:block; touch-action:none; position:absolute; inset:0; width:100%; height:100%;}

  /* top 12% UI strip, purely chrome, never covered by game content */
  .hud{
    position:absolute; top:0; left:0; right:0; height:12%; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
    pointer-events:none;
  }
  .hud > *{pointer-events:auto;}
  /* no square frame/box — a plain glowing neon icon, sized relative to
     #app's width (9%), never a fixed px box */
  .icon-btn{
    width:9%; aspect-ratio:1/1; flex:0 0 9%;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--cyan);
    cursor:pointer;
    position:relative; z-index:1; /* always rendered on top of the title pill */
  }
  .icon-btn svg{
    width:72%; height:72%;
    filter:drop-shadow(0 0 3px var(--cyan)) drop-shadow(0 0 9px var(--cyan));
  }
  /* restart icon: an SVG drawn exactly like the back arrow (same .icon-btn
     svg rule: 72% of the 9%-of-screen-width box), never a text glyph sized
     in vw — a vw-based glyph scales with the whole browser viewport, not
     with #app's own (possibly letterboxed) width, which is what made it
     oversized/clipped at a corner before. */
  /* min-width:0 lets this flex child actually shrink to the space the HUD
     has left over once both icon buttons take their fixed 9% — without it
     a flex item's intrinsic content width wins and can push siblings out. */
  .level-pill{
    display:flex; align-items:center; gap:12px; position:relative; padding:2px 4px;
    min-width:0; flex:1 1 auto; justify-content:center; overflow:hidden;
  }
  .level-pill .br{position:relative; width:10px; height:24px; flex:none;}
  .level-pill .br::before{
    content:""; position:absolute; inset:0;
    border-top:3px solid var(--magenta); border-bottom:3px solid var(--magenta);
  }
  .level-pill .br.l::before{border-left:3px solid var(--magenta);}
  .level-pill .br.r::before{border-right:3px solid var(--magenta);}
  /* dashed "-·-" style side lines, not a solid bar */
  .level-pill .ln{width:16px; height:0; border-top:1px dashed var(--magenta); opacity:.8; flex:none;}
  /* font-size/letter-spacing are set from JS (updateGameLabel, see script) —
     computed from the game frame's own cssW, never from vw/window size, and
     shrunk to fit so the title can never push the back/restart buttons out
     of frame or run off-screen. The values below are just a safe fallback
     for the instant before the first JS pass runs. */
  .level-pill .txt{
    font-family:"Russo One","Segoe UI",sans-serif;
    font-weight:400; letter-spacing:3px; font-size:28px; color:#e07aff;
    text-shadow:0 0 10px #b44dff, 0 0 22px #b44dff; white-space:nowrap;
  }

  .hint-toast{
    position:absolute; left:50%; bottom:3%; transform:translateX(-50%); z-index:5;
    background:rgba(10,6,20,.65); border:1px solid var(--cyan); border-radius:20px;
    padding:7px 15px; font-size:11px; color:#dff; white-space:nowrap;
    box-shadow:0 0 12px rgba(34,230,255,.3); transition:opacity .25s;
  }

  /* ---------- result overlay — display:none when hidden, not just opacity ---------- */
  #result-overlay{
    position:absolute; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    background:rgba(5,4,13,.72); backdrop-filter:blur(2px);
  }
  #result-overlay.show{display:flex; pointer-events:auto;}
  .result-card{
    width:84%; max-width:320px; text-align:center; padding:26px 20px;
    background:linear-gradient(160deg,#1c1030,#0c0620);
    border:1.5px solid var(--cyan); border-radius:18px;
    box-shadow:0 0 30px rgba(34,230,255,.35);
  }
  .result-icon{font-size:42px; margin-bottom:6px;}
  .result-title{font-size:19px; font-weight:800; color:#fff;}
  .result-sub{font-size:12px; color:#9aa4c4; margin-top:6px;}
  .result-stars{display:none; justify-content:center; gap:8px; margin:4px 0 2px; font-size:38px; line-height:1;}
  .result-stars.show{display:flex;}
  .result-stars span{color:rgba(255,255,255,.14); transform:scale(.4); opacity:0;}
  .result-stars.show span{animation:starPop .38s cubic-bezier(.2,1.6,.4,1) forwards;}
  .result-stars.show span:nth-child(2){animation-delay:.22s;}
  .result-stars.show span:nth-child(3){animation-delay:.44s;}
  .result-stars span.on{color:var(--gold); text-shadow:0 0 10px rgba(255,204,51,.95), 0 0 24px rgba(255,160,40,.7);}
  @keyframes starPop{to{transform:scale(1); opacity:1;}}
  .result-score{display:none; margin-top:10px; font-family:"Russo One",sans-serif; font-size:20px; color:#fff; text-shadow:0 0 10px var(--cyan);}
  .result-score small{display:block; font-family:"Segoe UI",sans-serif; font-size:11px; color:#9aa4c4; text-shadow:none; margin-top:3px;}
  .result-score .rec{color:var(--gold); font-weight:800; text-shadow:0 0 8px rgba(255,204,51,.7);}
  /* (stage 3) deposit-bonus panel — filled ONLY from the server's answer */
  .result-reward{
    display:none; margin:14px auto 0; max-width:100%; padding:9px 14px; border-radius:14px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04);
    font-size:12px; color:#c9d2ee; line-height:1.35;
  }
  .result-reward.show{display:block;}
  .result-reward .rw-main{font-family:"Russo One","Segoe UI",sans-serif; font-size:20px; color:#6cffb0; text-shadow:0 0 10px rgba(61,255,154,.7);}
  .result-reward .rw-sub{font-size:11px; color:#9aa4c4; margin-top:2px;}
  .result-reward.ok{border-color:rgba(61,255,154,.55); background:rgba(61,255,154,.07); box-shadow:0 0 14px rgba(61,255,154,.18);}
  .result-reward.info{border-color:rgba(255,204,51,.45); color:#ffe39a;}
  .result-reward.err{border-color:rgba(255,90,120,.55); background:rgba(255,90,120,.07); color:#ffc2cf;}
  .result-reward.pending{color:#9aa4c4;}
  .rw-spin{display:inline-block; width:11px; height:11px; margin-right:7px; vertical-align:-1px; border-radius:50%;
    border:2px solid rgba(255,255,255,.2); border-top-color:var(--cyan); animation:rwSpin .8s linear infinite;}
  @keyframes rwSpin{to{transform:rotate(360deg);}}
  .rw-retry{margin-top:7px; padding:5px 14px; border-radius:8px; border:1px solid currentColor; background:none; color:inherit; font-weight:700; font-size:12px; cursor:pointer;}
  .result-btns{display:flex; gap:10px; margin-top:18px;}
  .rbtn{flex:1; padding:11px 0; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; border:none;}
  .rbtn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#09111c;}
  .rbtn.ghost{background:transparent; border:1px solid rgba(255,255,255,.25); color:#eaf6ff;}

  /* ---------- (info) "how it works" entry points + sheet ---------- */
  .how-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin:8px 0 2px;
    padding:10px 12px; border-radius:12px; cursor:pointer;
    font:700 13px "Segoe UI",Roboto,system-ui,sans-serif; color:#e9dcff;
    background:rgba(179,136,255,.10); border:1px dashed rgba(179,136,255,.6);
    animation:cardIn .5s .12s ease-out both;
  }
  .how-btn svg{width:16px; height:16px; flex:none; color:var(--violet); filter:drop-shadow(0 0 4px var(--violet));}
  .how-btn:active{transform:scale(.98);}
  .profile{cursor:pointer;}
  .rw-link{margin-top:6px; padding:0; border:none; background:none; color:var(--cyan); font-size:11.5px; font-weight:700; text-decoration:underline; text-underline-offset:2px; cursor:pointer;}
  button:focus-visible,.lv-card:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}

  #info-sheet{
    position:absolute; inset:0; z-index:40; display:flex; align-items:flex-end;
    background:rgba(5,3,14,.72); backdrop-filter:blur(3px);
  }
  #info-sheet[hidden]{display:none;}
  .is-panel{
    outline:none; position:relative; width:100%; max-height:92%; display:flex; flex-direction:column;
    background:linear-gradient(170deg,#1d1036,#0b0620 60%);
    border:1px solid rgba(179,136,255,.5); border-bottom:none; border-radius:20px 20px 0 0;
    box-shadow:0 -10px 40px rgba(179,136,255,.25);
    animation:sheetUp .32s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes sheetUp{from{transform:translateY(40px); opacity:0;} to{transform:none; opacity:1;}}
  .is-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 16px 10px; border-bottom:1px solid rgba(255,255,255,.07);}
  .is-title{font-family:"Russo One","Segoe UI",sans-serif; font-size:18px; letter-spacing:1px; color:#fff; text-shadow:0 0 10px var(--violet);}
  .is-close{width:34px; height:34px; flex:none; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.05); color:#eaf6ff; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .is-close svg{width:16px; height:16px;}
  .is-body{flex:1; min-height:0; overflow-y:auto; padding:6px 16px 8px; touch-action:pan-y; -webkit-overflow-scrolling:touch; font-size:13px; line-height:1.5; color:#d6dcf2;}
  .is-foot{padding:10px 16px 14px; border-top:1px solid rgba(255,255,255,.07);}
  .is-foot .rbtn{width:100%; padding:12px 0; font-size:14px;}
  .is-hero{margin:8px 0 4px; padding:12px; border-radius:14px; background:rgba(34,230,255,.06); border:1px solid rgba(34,230,255,.25);}
  .is-hero b{display:block; font-family:"Russo One","Segoe UI",sans-serif; font-weight:400; font-size:15px; color:#fff; margin-bottom:4px; text-wrap:balance;}
  .is-sec{margin-top:16px;}
  .is-h{font-family:"Russo One","Segoe UI",sans-serif; font-size:13px; letter-spacing:1.5px; color:var(--cyan); text-transform:uppercase; margin-bottom:8px;}
  .is-steps{list-style:none; margin:0; padding:0; display:grid; gap:8px;}
  .is-steps li{display:grid; grid-template-columns:24px 1fr; gap:10px; align-items:start;}
  .is-steps li > span{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:700 12px "Segoe UI",sans-serif; color:#0b0620; background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  .is-note{margin-top:8px; font-size:12px; color:#9aa4c4;}
  .is-stars{display:grid; gap:6px;}
  .is-stars div{display:flex; align-items:center; gap:10px;}
  .is-stars i{font-style:normal; flex:none; width:58px; letter-spacing:2px; color:rgba(255,255,255,.18);}
  .is-stars i b{color:var(--gold); text-shadow:0 0 6px rgba(255,204,51,.8);}
  .is-table{width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums;}
  .is-table th{font-weight:600; font-size:11px; color:#9aa4c4; text-align:right; padding:0 0 6px;}
  .is-table th:first-child,.is-table td:first-child{text-align:left;}
  .is-table td{padding:7px 0; text-align:right; border-top:1px solid rgba(255,255,255,.07); color:#eaf6ff;}
  .is-table td:first-child{font-weight:700; color:var(--sec);}
  .is-table tr.total td{color:#fff; font-weight:700;}
  .is-me{margin-top:10px; padding:10px 12px; border-radius:12px; border:1px solid rgba(61,255,154,.4); background:rgba(61,255,154,.06);}
  .is-me .pf-bar{margin-top:6px;}
  .is-example{margin-top:8px; padding:10px 12px; border-radius:12px; background:rgba(255,204,51,.07); border:1px solid rgba(255,204,51,.35); color:#ffe9b0;}
  .is-example b{color:#fff;}
  @media (prefers-reduced-motion: reduce){ .is-panel,.how-btn{animation:none !important;} }

  .fps-counter{
    position:absolute; top:4px; left:4px; z-index:20; font:700 11px monospace;
    color:#6cff9a; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:4px;
    pointer-events:none; display:none;

<script>
/* ======================================================================
   SIZES (meters)
   ====================================================================== */
const AMMO_R = 0.45, COIN_R = 1.0;

/* Slingshot geometry (meters) — module-level so the camera-fit code can see
   it too. Purely cosmetic sizing; none of this feeds the physics/launch math
   (anchorM/MAX_PULL_M/LAUNCH_POWER, defined per-scene, are untouched). */
const LEG_THICK_M = 0.55;
const HORN_THICK_M = 0.45, HORN_TIP_THICK_M = 0.38;
// TIP_H_M (3.8) is intentionally a bit above anchorM.y-groundTopM (3.4,
// physics-owned, untouched) so the cosmetic horns visibly rise above the
// resting pouch instead of sitting flush with it — that gap is what makes
// the bands read as a hanging "V" down to the pouch, per reference.
const SPLIT_H_M = 2.0, TIP_H_M = 3.8, TIP_SPREAD_M = 1.8;
const BASE_BOTTOM_W_M = 2.4, BASE_MID_W_M = 2.0, BASE_TOP_W_M = 1.6, BASE_H_M = 0.8;
const BAND_THICK_M = 0.12;

const MATERIALS = {
  // hp unchanged by the 2026-10-04 balance pass: once resting contact
  // stopped counting as damage (see IMPACT_MIN_SPEED), these values give
  // few one-shot clears while every level stays winnable (balance sweep).
  glass:    { density:0.6, friction:0.70, restitution:0, hp:30,  glow:"#22e6ff", glass:true },
  metal:    { density:1.5, friction:0.80, restitution:0, hp:120, glow:"#22e6ff" },
  concrete: { density:3.0, friction:0.90, restitution:0, hp:300, glow:"#ff2bd6" },
};
const NETWORKS = {
  bitcoin:  { color:"#ffb02a" },
  ethereum: { color:"#a259ff" },
  solana:   { color:"#12345e", rim:"#22e6ff" },
  ripple:   { color:"#ff3ac8" },
};
const NET_ORDER = ["bitcoin","ethereum","solana","ripple"];
// neon halo color per coin (reference: each coin wears a bright ring)
const COIN_NEON = { bitcoin:"#ff9a1f", ethereum:"#b46bff", solana:"#22e6ff", ripple:"#ff3ac8" };

/* ======================================================================
   ATMOSPHERE / PALETTE SYSTEM (#3, batch-1) — one object per look, baked
   fresh whenever a level loads (buildBackground(palette) inside
   createScene — see that function for how each field is consumed). A
   level picks its palette by name via `levelDef.palette` (falls back to
   "purpleSunset" if unset/unknown). Shape, documented once here so a
   future batch can add e.g. "night"/"dawn"/"acidNeon" without touching any
   of the drawing code, only this object:
     skyTop/skyMid/skyHorizon  — 3-stop vertical sky gradient (top->horizon)
     sunColors: [core, mid, edge] — the sun disc's own diagonal gradient
     sunHalo                   — the sun's soft outer halo color (rgba str)
     cloudColor                 — flat opaque cloud-silhouette fill
                                   (should read ~1 shade darker than skyTop)
     cityColor / cityRoofRim    — building silhouette fill / 1px roof-rim
     cityWindow: [colorA, colorB] — the two lit-window tint colors
     floorNear / floorFar       — floor slab gradient stops (near->far)
     floorSeam                  — floor tile-seam stroke color
     floorFrontRow              — the lightest front floor-tile row color
     hazeRGB                    — "r,g,b" string for the city's distance haze
     accentNeon1 / accentNeon2  — the two neon accent colors this palette
                                   drives (pit rim glow, platform trim,
                                   reflected-highlight tint, etc. — block
                                   neon stripes/the HUD stay on the fixed
                                   cyan/magenta brand colors on purpose)
     sunPosXFrac/sunPosYFrac/sunRFrac — (batch-3) the sun/moon disc's own
                                   center (as a fraction of cssW/cssH) and
                                   radius (as a fraction of cssW), read by
                                   sunSpec(pal) — lets a palette move/resize
                                   the disc (e.g. a dawn sun sitting lower
                                   and bigger) without touching any drawing
                                   code. Optional: sunSpec() falls back to
                                   the original fixed 0.80/0.40/0.30 when a
                                   palette omits them.
   ====================================================================== */
const PALETTES = {
  purpleSunset: {
    skyTop:"#1c0f52", skyMid:"#4a22a8", skyHorizon:"#7a3cc8",
    sunColors:["#ffb03a","#ff5a8a","#ff3ab0"], sunHalo:"rgba(255,106,176,.35)",
    sunPosXFrac:0.80, sunPosYFrac:0.40, sunRFrac:0.30,
    cloudColor:"#2a1868",
    cityColor:"#1e1650", cityRoofRim:"#3a2e80", cityWindow:["#c05ad8","#8a6aff"],
    floorNear:"#1e1838", floorFar:"#120c26", floorSeam:"#0e0a1e", floorFrontRow:"#2a2250",
    hazeRGB:"74,34,168",
    accentNeon1:"#22e6ff", accentNeon2:"#ff2bd6",
  },
  // Deep blue night (batch-2, levels 3-4): same field shape as purpleSunset
  // above, just restyled cool/dark. `sunColors`/`sunHalo` get the MOON's
  // colors — drawSunBaked()/sunSpec() are untouched (same disc position/
  // radius/gradient/halo/scanline code), so the "sun" bake is literally the
  // moon here purely by handing it different palette colors, per the
  // parametric-by-design palette system (#3, batch-1).
  deepNight: {
    skyTop:"#0a0f3a", skyMid:"#161c5c", skyHorizon:"#2a2a8a",
    sunColors:["#dfe6ff","#c8d0ff","#8a7aff"], sunHalo:"rgba(170,160,255,.30)",
    sunPosXFrac:0.80, sunPosYFrac:0.40, sunRFrac:0.30,
    cloudColor:"#1b2256",
    cityColor:"#10153f", cityRoofRim:"#2e3a8a", cityWindow:["#6a8aff","#8ad4ff"],
    floorNear:"#141a44", floorFar:"#0a0e2c", floorSeam:"#070a20", floorFrontRow:"#1e2558",
    hazeRGB:"42,42,138",
    accentNeon1:"#22e6ff", accentNeon2:"#ff2bd6",
  },
  // Pink-red dawn (batch-3, levels 5-6): warm low-sun palette. The sun sits
  // LOWER (sunPosYFrac 0.58 vs the other palettes' 0.40) and BIGGER
  // (sunRFrac 0.40 vs 0.30) via the new sunPos/sunR fields above — same
  // drawSunBaked() disc/gradient/halo/scanline code, just a different
  // center+radius fed in through sunSpec(pal).
  pinkDawn: {
    skyTop:"#3a0a2a", skyMid:"#8a1f52", skyHorizon:"#c83a6a",
    sunColors:["#fff3b0","#ff8a4a","#ff3a5a"], sunHalo:"rgba(255,138,90,.35)",
    sunPosXFrac:0.78, sunPosYFrac:0.58, sunRFrac:0.40,
    cloudColor:"#5a1842",
    cityColor:"#3a0f2c", cityRoofRim:"#8a3a5a", cityWindow:["#ff9a5a","#ffd27a"],
    floorNear:"#381428", floorFar:"#200a18", floorSeam:"#180810", floorFrontRow:"#4a1e38",
    hazeRGB:"200,58,106",
    accentNeon1:"#22e6ff", accentNeon2:"#ff2bd6",
  },
  // Acid-neon cyberpunk (batch-4, levels 7-8): cool dark teal sky, a
  // teal-to-pink sun gradient (NOT a recolor of any prior palette — the
  // other 3 all use a single warm-or-cool hue family top-to-bottom; this
  // one's sunColors genuinely shifts hue across the disc, teal core ->
  // pink edge) and acid-tinted city/floor values. Same field shape/same
  // drawSunBaked()/sunSpec() code as every other palette.
  acidNeon: {
    skyTop:"#0a1a2a", skyMid:"#123a4a", skyHorizon:"#1a4a5a",
    sunColors:["#5affd6","#3ac8ff","#ff3ac8"], sunHalo:"rgba(120,210,255,.32)",
    sunPosXFrac:0.80, sunPosYFrac:0.38, sunRFrac:0.32,
    cloudColor:"#0d2630",
    cityColor:"#081f28", cityRoofRim:"#1fae9a", cityWindow:["#ff3ac8","#3affea"],
    floorNear:"#0f2a33", floorFar:"#071a20", floorSeam:"#05141a", floorFrontRow:"#163a44",
    hazeRGB:"26,74,90",
    accentNeon1:"#22e6ff", accentNeon2:"#ff2bd6",
  },
};
function getPalette(name){ return PALETTES[name] || PALETTES.purpleSunset; }

/* ======================================================================
   SHAPE HELPERS — block specs carry a `shape` field consumed by
   makeBlockBody(): 'box' | 'circle' | 'tri' | 'wedge' | 'board'. Composite
   structures (frame, arch, antenna) are factory functions that return an
   ARRAY of plain box/tri/circle specs, so the physics stays simple
   (rectangles, triangles-as-polygons, circles) while the level author
   writes one call. Coins are NOT part of block specs any more (see the
   coin-fix in createScene) — levels list them separately as
   { x, restOnYBottom } where restOnYBottom is the world-bottom of
   whatever the coin visually rests on; createScene turns that into
   center.y = groundTopM + restOnYBottom + COIN_R.
   ====================================================================== */
function triVerts(w, h){
  // isosceles "roof" triangle, apex up, already centered on its centroid
  return [ planck.Vec2(-w/2, -h/3), planck.Vec2(w/2, -h/3), planck.Vec2(0, h*2/3) ];
}
function rightTriVerts(w, h, mirror){
  // right-angle triangle (right angle at the bottom corner), centered on
  // centroid. Vertex order is kept CCW in both the mirrored and
  // un-mirrored case — just mirroring x would flip the winding and planck
  // expects CCW polygons — so the mirrored list is written in the opposite
  // traversal order instead of being the same order with x negated.
  const pts = mirror ? [{x:0,y:0},{x:0,y:h},{x:-w,y:0}] : [{x:0,y:0},{x:w,y:0},{x:0,y:h}];
  const cx = (pts[0].x+pts[1].x+pts[2].x)/3, cy = (pts[0].y+pts[1].y+pts[2].y)/3;
  return pts.map(p => planck.Vec2(p.x-cx, p.y-cy));
}
function frameBlocks(mat, cx, yBottom, w, h, t){
  t = t || Math.max(0.35, Math.min(w,h)*0.14);
  return [
    { shape:"box", mat, w, h:t, x:cx, yBottom },
    { shape:"box", mat, w, h:t, x:cx, yBottom: yBottom+h-t },
    { shape:"box", mat, w:t, h:h-2*t, x:cx-w/2+t/2, yBottom: yBottom+t },
    { shape:"box", mat, w:t, h:h-2*t, x:cx+w/2-t/2, yBottom: yBottom+t },
  ];
}
function archBlocks(cx, yBottom, span, pillarH, pillarW){
  pillarW = pillarW || 0.6;
  const blocks = [
    { shape:"box", mat:"concrete", w:pillarW, h:pillarH, x:cx-span/2, yBottom },
    { shape:"box", mat:"concrete", w:pillarW, h:pillarH, x:cx+span/2, yBottom },
  ];
  const segN = 4, lintelY = yBottom+pillarH, R = span/2;
  for (let i=0;i<segN;i++){
    const a0 = Math.PI - (i/segN)*Math.PI, a1 = Math.PI - ((i+1)/segN)*Math.PI;
    const p0 = { x: cx+Math.cos(a0)*R, y: lintelY+Math.sin(a0)*R*0.6 };
    const p1 = { x: cx+Math.cos(a1)*R, y: lintelY+Math.sin(a1)*R*0.6 };
    const midx = (p0.x+p1.x)/2, midy = (p0.y+p1.y)/2;
    const segW = Math.hypot(p1.x-p0.x, p1.y-p0.y)*1.08;
    blocks.push({ shape:"box", mat:"metal", w:segW, h:0.42, xAbs:midx, yAbs:midy, angle:Math.atan2(p1.y-p0.y,p1.x-p0.x) });
  }
  return blocks;
}
function antennaSpire(cx, yBottom, h, w){
  w = w || 0.55;
  return [{ shape:"tri", mat:"metal", w, h, x:cx, yBottom, spireLight:true }];
}

/* ======================================================================
   TERRAIN PRIMITIVES (#2, batch-1) — reusable, data-driven helpers for
   levels 3-8. Each returns a plain block spec (or array of specs), pushed
   into a level's `blocks` array exactly like any box/tri/wedge spec; the
   `static:true` flag (or the dedicated shapes below) is read by
   makeBlockBody() inside createScene to build an indestructible STATIC
   Planck body instead of the usual dynamic-but-asleep destructible one —
   same as the ground itself, so nothing can ever knock a platform or ramp
   out of place.
   ====================================================================== */

// Roof platform: a wide static metal slab, neon edge trim baked into its
// sprite (same getBlockSprite() board-neon path, since shape:"platform"
// is treated as board-like for sprite purposes — see getBlockSprite), with
// cosmetic support legs/struts drawn underneath (drawBlock's platform
// branch), purely visual — no extra physics bodies for the legs. `yTop` is
// the platform's own top surface height in world-m (groundTopM-relative),
// so callers (e.g. an elevated slingshot, or a block resting on top) can
// read back exactly where its top surface sits: platformTopM = yTop.
// legStyle: "struts" (default, diagonal X-struts) | "pillars" (two
// straight legs down to the ground, for a taller platform).
function makePlatformBody(x, yTop, w, legStyle){
  const h = 0.5;
  return { shape:"platform", mat:"metal", w, h, x, yBottom: yTop-h, static:true, legStyle: legStyle||"struts", platformYTop:yTop };
}

// Inclined ramp: a static right-triangle wedge a circle/"reactor" block can
// roll down. `mirror` picks which side the high edge is on (same convention
// as the existing dynamic "wedge" shape's rightTriVerts(w,h,mirror)).
function makeRampBody(x, yBottom, w, h, mirror){
  return { shape:"rampStatic", mat:"metal", w, h, x, yBottom, static:true, mirror: !!mirror };
}

// Pit/gap helper: just a plain {x0,x1} descriptor consumed by
// buildGroundSegments() inside createScene (see levelDef.pits) — kept here
// as documentation of the shape every level's `pits` array uses.
function makePit(x0, x1){ return { x0, x1 }; }

/* ======================================================================
   LEVEL 1 BUILDER (2026-10-03 rebuild) — three wide, massive towers per
   the reference image, replacing the old 1-block-wide columns with
   directly-stacked coins. Centers are solved so every tower's WIDEST
   element (the overhang slabs/base) clears its neighbor by the required
   0.2-0.4m gap while the whole level stays inside the established x
   6.0-17.3 world-anchor convention used by every other level:
     leftX=7.75 (half-width 1.7 via its 3.4m slab)  -> left edge 6.05
     centerX=11.4 (half-width 1.7 via its 3.4m slab)
     rightX=15.3 (half-width 2.0 via its 4.0m base) -> right edge 17.3
   gaps: left-slab(9.45) to center-slab(9.7) = 0.25m;
         center-slab(13.1) to right-base(13.3) = 0.2m.
   Coins sit ONLY at a tower top or inside a niche, never two directly
   stacked through a thin beam — see the coin-distance notes per tower.
   No triangular roofs here (reference level 1 has none; other levels
   keep theirs, untouched).
   ====================================================================== */
function buildLevel1(){
  const blocks = [], coins = [];

  // ---- LEFT tower: low, ~3.2m wide, no coin ----
  const Lx = 7.75;
  let y = 0;
  blocks.push({ shape:"box", mat:"concrete", w:1.6, h:1.2, x:Lx-0.8, yBottom:y });
  blocks.push({ shape:"box", mat:"concrete", w:1.6, h:1.2, x:Lx+0.8, yBottom:y });
  y += 1.2;
  blocks.push({ shape:"box", mat:"metal", w:1.0, h:2.4, x:Lx-1.0, yBottom:y });
  blocks.push({ shape:"box", mat:"metal", w:2.0, h:2.4, x:Lx+0.5, yBottom:y });
  y += 2.4;
  blocks.push({ shape:"board", mat:"metal", w:3.4, h:0.5, x:Lx, yBottom:y }); // wide slab, overhangs the tier below
  y += 0.5;
  blocks.push({ shape:"box", mat:"metal", w:1.2, h:1.6, x:Lx-0.8, yBottom:y });
  blocks.push({ shape:"box", mat:"metal", w:1.6, h:1.6, x:Lx+0.6, yBottom:y });
  y += 1.6;
  blocks.push({ shape:"box", mat:"metal", w:1.0, h:1.0, x:Lx-0.4, yBottom:y });
  blocks.push({ shape:"box", mat:"metal", w:0.7, h:0.7, x:Lx+0.55, yBottom:y });

  // ---- CENTER tower: tallest (~14m), 4 tiers of 3m + inter-tier slabs + cap, BTC on top ----
  const Cx = 11.4;
  y = 0;
  blocks.push({ shape:"box", mat:"concrete", w:1.0, h:3.0, x:Cx-1.0, yBottom:y });
  blocks.push({ shape:"box", mat:"concrete", w:1.0, h:3.0, x:Cx,     yBottom:y });
  blocks.push({ shape:"box", mat:"concrete", w:1.0, h:3.0, x:Cx+1.0, yBottom:y });
  y += 3.0;
  blocks.push({ shape:"board", mat:"metal", w:3.4, h:0.5, x:Cx, yBottom:y });
  y += 0.5;
  blocks.push({ shape:"box", mat:"metal", w:1.5, h:3.0, x:Cx-0.75, yBottom:y });
  blocks.push({ shape:"box", mat:"metal", w:1.5, h:3.0, x:Cx+0.75, yBottom:y });
  y += 3.0;
  blocks.push({ shape:"board", mat:"metal", w:3.4, h:0.5, x:Cx, yBottom:y });
  y += 0.5;
  blocks.push({ shape:"box", mat:"metal", w:0.9, h:3.0, x:Cx-1.05, yBottom:y });
  blocks.push({ shape:"box", mat:"metal", w:1.2, h:3.0, x:Cx,      yBottom:y });
  blocks.push({ shape:"box", mat:"metal", w:0.9, h:3.0, x:Cx+1.05, yBottom:y });
  y += 3.0;
  blocks.push({ shape:"board", mat:"metal", w:3.4, h:0.5, x:Cx, yBottom:y });
  y += 0.5;
  blocks.push({ shape:"box", mat:"concrete", w:1.6, h:3.0, x:Cx-0.7, yBottom:y }); // spans [Cx-1.5, Cx+0.1]
  blocks.push({ shape:"box", mat:"concrete", w:1.4, h:3.0, x:Cx+0.8, yBottom:y }); // spans [Cx+0.1, Cx+1.5]
  y += 3.0;
  blocks.push({ shape:"board", mat:"metal", w:3.2, h:0.5, x:Cx, yBottom:y }); // top cap
  y += 0.5;
  coins.push({ key:"bitcoin", x:Cx, restOnYBottom:y });

  // ---- RIGHT tower: ~3.8-4.0m wide, ~11m tall — base, XRP niche, SOL niche, upper tier, cap + ETH ----
  const Rx = 15.3;
  y = 0;
  blocks.push({ shape:"box", mat:"concrete", w:1.3, h:1.2, x:Rx-1.35, yBottom:y });
  blocks.push({ shape:"box", mat:"concrete", w:1.4, h:1.2, x:Rx,      yBottom:y });
  blocks.push({ shape:"box", mat:"concrete", w:1.3, h:1.2, x:Rx+1.35, yBottom:y });
  y += 1.2;
  blocks.push({ shape:"box", mat:"metal", w:0.8, h:2.8, x:Rx-1.6, yBottom:y }); // XRP niche, left pillar
  blocks.push({ shape:"box", mat:"metal", w:0.8, h:2.8, x:Rx+1.6, yBottom:y }); // XRP niche, right pillar
  blocks.push({ shape:"box", mat:"glass", w:2.4, h:2.8, x:Rx, yBottom:y, decorative:true });
  coins.push({ key:"ripple", x:Rx, restOnYBottom:y });
  y += 2.8;

/* ======================================================================
   LEVEL 2 BUILDER ("Мост", rebuilt 2026-10-03 batch-1) — two towers of
   DIFFERENT heights flanking a pit/gap (no ground fixture under
   x in [PIT_X0,PIT_X1] — see `pits` on the level object, consumed by
   buildGroundSegments() in createScene), a board-bridge resting on both
   tower caps at y=7m with 2 coins on it, and a third coin low on the
   ground UNDER AN ARCH that forms tower A's base (an actual archway you
   can see through, not just a decorative frame). Demonstrates the new
   terrain-gap plumbing end-to-end for levels 3-8 to copy.
   ====================================================================== */
function buildLevel2(){
  const blocks = [], coins = [];
  const PIT_X0 = 11.0, PIT_X1 = 13.0; // gap: no ground fixture in this range

  // ---- Standalone archway (decorative, NOT load-bearing — nothing is
  // built on top of it) on solid ground between the slingshot and tower A,
  // with coin #1 resting on the ground inside its opening: "under an
  // arch". Built as two pillars + a flat lintel with generous overlap on
  // both ends (same box-on-box resting every stable stack in this game
  // uses) rather than archBlocks()'s curved multi-segment arc: that arc is
  // a chain of thin boxes touching only at their corners, which the
  // stability check shows sliding 0.5-1.6m even carrying NO load at all —
  // fine for a cosmetic standalone decoration elsewhere, but not something
  // to rely on here, so this level uses the flat-lintel shape instead.
  const archX = 5.5;
  blocks.push({ shape:"box", mat:"concrete", w:0.5, h:2.0, x:archX-1.0, yBottom:0 }); // left pillar
  blocks.push({ shape:"box", mat:"concrete", w:0.5, h:2.0, x:archX+1.0, yBottom:0 }); // right pillar
  blocks.push({ shape:"board", mat:"metal", w:2.8, h:0.4, x:archX, yBottom:2.0 });    // lintel, overlaps both pillar tops
  coins.push({ key:"ripple", x:archX, restOnYBottom:0.3 });

  // ---- TOWER A (left, shorter — a plain solid stack capping out at 7m,
  // where the bridge lands):
  const Ax = 8.3;
  blocks.push({ shape:"box", mat:"concrete", w:1.3, h:1.3, x:Ax-0.7, yBottom:0 });
  blocks.push({ shape:"box", mat:"concrete", w:1.3, h:1.3, x:Ax+0.7, yBottom:0 });
  blocks.push({ shape:"box", mat:"metal",    w:2.2, h:2.0, x:Ax,     yBottom:1.3 });
  blocks.push({ shape:"box", mat:"concrete", w:2.0, h:2.0, x:Ax,     yBottom:3.3 });
  blocks.push({ shape:"box", mat:"metal",    w:1.8, h:1.3, x:Ax,     yBottom:5.3 });
  blocks.push({ shape:"board", mat:"metal",  w:3.0, h:0.4, x:Ax,     yBottom:6.6 }); // cap slab, top=7.0 — spans [6.8,9.8], the bridge's left seat

  // ---- TOWER B (right, taller — solid stack to 7m, then a NARROWER
  // column keeps rising to ~9.4m with an antenna spire on top, well past
  // the bridge-attach height; the cap slab at y=7.0 is wide enough that
  // the bridge rests on its LEFT shoulder while the narrower column above
  // sits on its center/right — the two never compete for the same spot):
  const Bx = 16.0;
  blocks.push({ shape:"box", mat:"concrete", w:2.4, h:2.0, x:Bx, yBottom:0 });
  blocks.push({ shape:"box", mat:"metal",    w:2.2, h:2.0, x:Bx, yBottom:2.0 });
  blocks.push({ shape:"box", mat:"concrete", w:2.0, h:2.0, x:Bx, yBottom:4.0 });
  blocks.push({ shape:"box", mat:"metal",    w:2.0, h:0.6, x:Bx, yBottom:6.0 });
  blocks.push({ shape:"board", mat:"metal",  w:3.0, h:0.4, x:Bx, yBottom:6.6 }); // cap slab, top=7.0 — spans [14.5,17.5]
  blocks.push({ shape:"box", mat:"metal",    w:1.6, h:1.5, x:Bx, yBottom:7.0 }); // keeps rising, centered — spans [15.2,16.8]
  // cap: an actual roof-PLATFORM (static terrain primitive, #2) — proves
  // the antenna spire (a normal dynamic block) can rest on top of one.
  blocks.push(makePlatformBody(Bx, 9.0, 1.8, "pillars"));
  blocks.push(...antennaSpire(Bx, 9.0, 1.4, 0.5));

  // ---- Bridge: rests on tower A's cap-slab (0.5m in from its 9.8 right
  // edge) and tower B's cap-slab LEFT SHOULDER (clear of the column
  // above, which only occupies [15.2,16.8]) — generous overlap on both
  // ends, never just touching an exact edge.
  const bridgeX0 = 9.3, bridgeX1 = 14.9;
  const bridgeW = bridgeX1 - bridgeX0, bridgeCx = (bridgeX0+bridgeX1)/2;
  blocks.push({ shape:"board", mat:"metal", w:bridgeW, h:0.3, x:bridgeCx, yBottom:7.0 });
  // 2 coins on the bridge — centers kept >=2.0m apart (COIN_R*2) and clear
  // of both tower caps.
  coins.push({ key:"bitcoin", x:10.5, restOnYBottom:7.3 });
  coins.push({ key:"solana",  x:13.5, restOnYBottom:7.3 });

  // ---- an inclined ramp past tower B, demonstrating the new ramp terrain
  // primitive end-to-end. The standalone reactor ball sits on FLAT ground
  // well clear of the slope itself, not balanced on the incline — a
  // circle on ANY incline rolls on its own in a Box2D-style solver no
  // matter the friction coefficient (there is no rolling resistance, only
  // sliding friction), so resting one on the slope at level-load would
  // violate "nothing falls on its own" the moment the level opens. The
  // ramp is still fully functional terrain: a shot that knocks this ball
  // onto it will roll down realistically, which is the point of the
  // primitive — it's simply never resting there unprompted.
  blocks.push(makeRampBody(20.5, 0, 3.0, 1.6, true));
  blocks.push({ shape:"circle", mat:"metal", r:0.5, x:23.3, yBottom:0 });

  return {
    name:"Мост", charges:4, blocks, coins,
    worldWidth:26, palette:"purpleSunset",
    pits:[ { x0:PIT_X0, x1:PIT_X1 } ],
  };
}

/* ======================================================================
   LEVEL 3 BUILDER («Крепость на крыше» / "Fortress on the roof", batch-2)
   worldWidth 24, palette "deepNight". The whole structure sits on a static
   makePlatformBody() ~4m above the ground (on top of a wide static
   concrete base, for the "wide concrete base" look), with 3 hollow
   frameBlocks() niches (glass + coin each) and reactor-ball caps — same
   composite helpers levels past used, just elevated onto a platform this
   time, per #2's anchorLiftM/platform plumbing (the SLINGSHOT stays at
   ground level here — anchorLiftM is left at its default 0 — it's the
   STRUCTURE that's elevated, not the shooter).

   ARC-SHOT GEOMETRY (verified by hand, see the batch report for the full
   derivation): anchor sits at (2.8, 4.0) world-m. A concrete parapet wall
   at x=7.0 (on the platform's leading/left edge) tops out at y=6.2. The
   straight anchor->coin1(10, 6.1) line passes under the parapet at only
   y~=5.1-5.4 across its width — i.e. BLOCKED — while a lofted shot (pull
   ~43% of max, ~45.6 deg above horizontal: vx=7.03, vy=7.17 m/s) clears
   the parapet by 0.3m at x=7 and lands exactly on coin1's center at x=10,
   proving the level is solvable only by an arc, not a flat/direct shot.
   ====================================================================== */
function buildLevel3(){
  const blocks = [], coins = [];
  const PX = 13, PW = 14;       // platform/base center + width -> spans x[6,20]
  const BASE_H = 3.5;           // concrete base: ground -> platform underside
  const PLAT_Y = 4.0;           // platform top surface (groundTopM-relative)

  // wide static concrete base the whole fortress stands on
  blocks.push({ shape:"box", mat:"concrete", w:PW, h:BASE_H, x:PX, yBottom:0, static:true });
  // thin metal roof-platform slab on top (adds its own neon trim + legs)
  blocks.push(makePlatformBody(PX, PLAT_Y, PW, "pillars"));

  // parapet wall at the platform's leading edge — the thing that blocks a
  // flat/direct shot (see geometry note above)
  blocks.push({ shape:"box", mat:"concrete", w:1.0, h:1.6, x:7.0, yBottom:PLAT_Y });

  // left hollow frame + glass niche + coin
  blocks.push(...frameBlocks("concrete", 10, PLAT_Y, 3.0, 3.0, 0.5));
  blocks.push({ shape:"box", mat:"glass", w:2.0, h:2.0, x:10, yBottom:PLAT_Y+0.5, decorative:true });
  coins.push({ key:"bitcoin", x:10, restOnYBottom:PLAT_Y+0.5 });

  // right hollow frame + glass niche + coin
  blocks.push(...frameBlocks("concrete", 16, PLAT_Y, 3.0, 3.0, 0.5));
  blocks.push({ shape:"box", mat:"glass", w:2.0, h:2.0, x:16, yBottom:PLAT_Y+0.5, decorative:true });
  coins.push({ key:"ethereum", x:16, restOnYBottom:PLAT_Y+0.5 });

  // reactor balls capping each side frame
  blocks.push({ shape:"circle", mat:"metal", r:0.7, x:10, yBottom:PLAT_Y+3.0 });
  blocks.push({ shape:"circle", mat:"metal", r:0.7, x:16, yBottom:PLAT_Y+3.0 });

  // center frame, raised on its own flat metal pedestal (NOT balanced on
  // top of the two side reactor balls — a flat box resting on a circle is
  // a 1-2-point contact and is unstable; physics_check.js caught this
  // exact mistake falling ~3.6-4.0m during the 180-tick blind settle test
  // on an earlier pass of this level, hence the dedicated pedestal here)
  blocks.push({ shape:"box", mat:"metal", w:2.0, h:1.4, x:13, yBottom:PLAT_Y });
  const midY = PLAT_Y + 1.4;
  blocks.push(...frameBlocks("metal", 13, midY, 3.0, 3.0, 0.5));
  blocks.push({ shape:"box", mat:"glass", w:2.0, h:2.0, x:13, yBottom:midY+0.5, decorative:true });
  coins.push({ key:"solana", x:13, restOnYBottom:midY+0.5 });
  blocks.push({ shape:"circle", mat:"metal", r:0.7, x:13, yBottom:midY+3.0 });

  // a ramp + loose reactor ball past the fortress (ball rests on FLAT
  // ground beside the ramp, never on the incline itself — see the batch-1
  // note on makeRampBody: a circle on any slope rolls on its own, no
  // rolling resistance, so it can only be resting terrain if it's hit onto
  // the ramp during play, never at level-load)
  blocks.push(makeRampBody(21.3, 0, 1.6, 1.3, true));
  blocks.push({ shape:"circle", mat:"metal", r:0.5, x:22.8, yBottom:0 });

  return { name:"Крепость на крыше", charges:4, blocks, coins, worldWidth:24, palette:"deepNight" };
}

/* ======================================================================
   LEVEL 5 BUILDER («Небоскрёб» / "Skyscraper", batch-3) — worldWidth 22,
   palette "pinkDawn", target distance ~10m (CX = anchorXM(2.8) + 10.0).
   ONE narrow 16m-tall spire tower, deliberately built as a SINGLE
   DEPENDENT STACK, never widened into independent support: every tier
   (foundation -> column -> balcony -> column -> balcony -> ... -> spire)
   is a plain DYNAMIC (destructible) block resting directly on the one
   below it — there is no makePlatformBody()/static anchor anywhere in
   this tower, so there is nothing else propping up the upper sections. A
   balcony is a wide board centered OFF-AXIS from the column (full column
   footprint covered with >=0.3m margin on the attached side, a clear
   ~1.3-1.4m ledge projecting out the other side, carrying one coin), and
   the next column segment resumes dead-center on top of it — so knocking
   out the foundation/base genuinely drops every tier above it, while the
   level still stands on its own (verified by the existing 180-tick
   runStabilityCheck()). Alternating left/right projection keeps the
   silhouette from leaning/reading as lopsided.
   ====================================================================== */
function buildLevel5(){
  const blocks = [], coins = [];
  const CX = 12.8; // anchorXM(2.8) + 10.0m target distance
  // (2026-10-04 balance) Every storey now stands on TWO side-by-side columns
  // (a twin core) instead of one: breaking a single block no longer drops
  // the whole spire and every coin with it — the player has to take the
  // core apart storey by storey. Coin heights/sides are unchanged.
  const twin = (mat, w, h, yBottom) => {
    blocks.push({ shape:"box", mat, w, h, x:CX - w/2, yBottom });
    blocks.push({ shape:"box", mat, w, h, x:CX + w/2, yBottom });
  };

  // tier 0: foundation
  blocks.push({ shape:"box", mat:"concrete", w:3.2, h:1.4, x:CX, yBottom:0 }); // top=1.4

  // storey 1 -> balcony 1 (projects RIGHT), coin: bitcoin
  twin("concrete", 0.8, 1.6, 1.4);                                                   // top=3.0
  blocks.push({ shape:"board", mat:"metal", w:3.3, h:0.4, x:CX+0.55, yBottom:3.0 }); // spans [CX-1.1,CX+2.2], top=3.4
  coins.push({ key:"bitcoin", x:CX+1.6, restOnYBottom:3.4 });

  // storey 2 -> balcony 2 (projects LEFT), coin: ethereum
  twin("concrete", 0.8, 2.0, 3.4);                                                   // top=5.4
  blocks.push({ shape:"board", mat:"metal", w:3.3, h:0.4, x:CX-0.55, yBottom:5.4 }); // spans [CX-2.2,CX+1.1], top=5.8
  coins.push({ key:"ethereum", x:CX-1.6, restOnYBottom:5.8 });

  // storey 3 -> balcony 3 (projects RIGHT), coin: solana
  twin("concrete", 0.75, 2.0, 5.8);                                                   // top=7.8
  blocks.push({ shape:"board", mat:"metal", w:3.1, h:0.4, x:CX+0.5, yBottom:7.8 });  // spans [CX-1.05,CX+2.05], top=8.2
  coins.push({ key:"solana", x:CX+1.5, restOnYBottom:8.2 });

  // storey 4 -> balcony 4 (projects LEFT), coin: ripple
  twin("concrete", 0.75, 2.2, 8.2);                                                   // top=10.4
  blocks.push({ shape:"board", mat:"metal", w:3.1, h:0.4, x:CX-0.5, yBottom:10.4 }); // spans [CX-2.05,CX+1.05], top=10.8
  coins.push({ key:"ripple", x:CX-1.5, restOnYBottom:10.8 });

  // tapering spire cap: narrow column + metal antenna spire, top = 16.0m
  blocks.push({ shape:"box", mat:"metal", w:1.1, h:2.4, x:CX, yBottom:10.8 }); // top=13.2
  blocks.push(...antennaSpire(CX, 13.2, 2.8, 0.5)); // tri apex at 13.2+2.8=16.0

  return { name:"Небоскрёб", charges:4, blocks, coins, worldWidth:22, palette:"pinkDawn" };
}

/* ======================================================================
   LEVEL 7 BUILDER («Рампа» / "Ramp", batch-4) — worldWidth 28, palette
   "acidNeon". First real use of a LONG makeRampBody() connecting an
   elevated shelf to the ground (prior ramps were short cosmetic inclines
   next to a standalone ball — see levels 2/3's notes): a static
   makePlatformBody() shelf at x=23.5, top = groundTopM+7.0, carries 3
   reactor balls resting on its FLAT top (never on the incline itself — a
   circle on any slope rolls on its own with no rolling resistance in this
   solver, so it can only ever be resting terrain, never placed mid-slope
   at level-load — same rule every prior batch's ramp note states). Each
   ball is held by a thin GLASS stopper block flush against its
   ramp-facing (left) side — purely a shootable target, since the shelf
   itself is flat and already holds the balls with zero help from the
   glass; breaking a stopper just gives that ball room to be knocked over
   the shelf's edge.
   The ramp itself (RAMP_CX=17.5, w=9, h=7, mirror:true) has its TALL edge
   at x=20.5 (flush with the shelf's own left edge, same 7.0m height) and
   its LOW edge at x=11.5 (buried slightly below ground so there's no
   floating gap at the tip) — i.e. it slopes down as x DECREASES, directly
   toward the crash structure at x=10, so a ball knocked off the shelf
   rolls left and down into it. See the batch-4 report for the exact
   vertex derivation (rightTriVerts(w,h,mirror) puts the tall edge on the
   larger-x side when mirror:true).
   ====================================================================== */
function buildLevel7(){
  const blocks = [], coins = [];

  // ---- crash structure at the ramp's base: a glass-and-coin niche a
  // freed ball rolls into, plus two extra ground coins clear of the
  // ramp's own footprint (which spans x[11.5,20.5], so everything here
  // stays at x<=10.7) ----
  blocks.push({ shape:"box", mat:"concrete", w:3.0, h:1.0, x:10, yBottom:0 });
  blocks.push({ shape:"box", mat:"glass", w:0.6, h:2.0, x:9.3, yBottom:1.0 });
  blocks.push({ shape:"box", mat:"glass", w:0.6, h:2.0, x:10.7, yBottom:1.0 });
  blocks.push({ shape:"board", mat:"glass", w:2.4, h:0.4, x:10, yBottom:3.0 });
  coins.push({ key:"bitcoin", x:10, restOnYBottom:3.4 });
  coins.push({ key:"solana", x:7.6, restOnYBottom:0.3 });
  coins.push({ key:"ethereum", x:5.0, restOnYBottom:0.3 });

  // ---- the ramp — h/yBottom solved so the tall edge lands flush on the
  // shelf's own top (groundTopM-relative 7.0) and the low edge buries
  // ~0.3m into the ground (no floating gap at the tip): for
  // rightTriVerts(w,h,mirror:true), the tall-edge world-y comes out to
  // yBottom+7h/6 and the low-edge world-y to yBottom+h/6, so solving
  // yBottom+7h/6=7.0 and yBottom+h/6=-0.3 gives h=7.3, yBottom=-1.5167 ----
  const RAMP_CX = 17.5, RAMP_W = 9.0, RAMP_H = 7.3, RAMP_YBOTTOM = -1.5167;
  blocks.push(makeRampBody(RAMP_CX, RAMP_YBOTTOM, RAMP_W, RAMP_H, true));

  // ---- elevated shelf + 3 reactor balls behind glass stoppers ----
  const SHELF_X = 23.5, SHELF_W = 6.0, SHELF_TOP = 7.0; // top matches the ramp's tall edge
  blocks.push(makePlatformBody(SHELF_X, SHELF_TOP, SHELF_W, "pillars"));
  for (const bx of [22.0, 23.7, 25.3]){
    blocks.push({ shape:"box", mat:"glass", w:0.3, h:1.0, x:bx-0.70, yBottom:SHELF_TOP }); // stopper, flush against the ball's ramp-facing side
    blocks.push({ shape:"circle", mat:"metal", r:0.55, x:bx, yBottom:SHELF_TOP }); // reactor ball, resting on the flat shelf top
  }

  return { name:"Рампа", charges:4, blocks, coins, worldWidth:28, palette:"acidNeon" };
}

/* ======================================================================
   LEVEL 8 BUILDER («Мегаполис» / "Megalopolis", batch-4) — worldWidth 32,
   palette "acidNeon". The finale: 4 towers of different final heights
   (A=5.4m, B=9.4m, D=11.3m, C=12.8m) on different footings, a pit at
   x[13,15], a board bridge between towers B and C (same flat-lintel-arch
   and board-bridge patterns level 2 established, both reused here rather
   than the curved archBlocks() helper — see level 2's own note on why: a
   chain of thin corner-touching boxes is measurably unstable, while a
   flat lintel with generous overlap is the proven-stable shape), and 5
   coins total. Shape/material mix across the 4 towers: box, tri (the
   antenna spire), wedge (tower D's pyramid-skirt base), circle (tower D's
   reactor-ball cap), frame+glass niche (towers C and D), board (every cap
   + the bridge), arch (tower B's base) — concrete/metal/glass all used.
   Terrain primitives: a static makePlatformBody() (tower B's footing) and
   a pit (makePit, via levelDef.pits) — both of #2's primitives, per spec.
   ====================================================================== */
function buildLevel8(){
  const blocks = [], coins = [];

  // ---- TOWER A (x=9, shortest at 5.4m, plain ground stack + flat cap) ----
  blocks.push({ shape:"box", mat:"concrete", w:3.0, h:1.4, x:9, yBottom:0 });
  blocks.push({ shape:"box", mat:"metal",    w:2.2, h:2.0, x:9, yBottom:1.4 });
  blocks.push({ shape:"box", mat:"concrete", w:1.6, h:1.6, x:9, yBottom:3.4 });
  blocks.push({ shape:"board", mat:"metal",  w:1.8, h:0.4, x:9, yBottom:5.0 }); // top=5.4
  coins.push({ key:"bitcoin", x:9, restOnYBottom:5.4 });

  // ---- PIT (no ground fixture in x[13,15]) ----
  const PIT_X0 = 13, PIT_X1 = 15;

  // ---- TOWER B (x=18.5, on a static roof-platform footing — the first
  // terrain primitive — with a flat-lintel ARCH at its base, coin inside,
  // reaching a cap at 9.4m that seats the bridge's left end) ----
  const Bx = 18.5, PLAT_B = 3.0;
  blocks.push(makePlatformBody(Bx, PLAT_B, 5.0, "pillars"));
  blocks.push({ shape:"box", mat:"concrete", w:0.5, h:2.0, x:Bx-1.0, yBottom:PLAT_B }); // left arch pillar
  blocks.push({ shape:"box", mat:"concrete", w:0.5, h:2.0, x:Bx+1.0, yBottom:PLAT_B }); // right arch pillar
  blocks.push({ shape:"board", mat:"metal",  w:2.8, h:0.4, x:Bx,     yBottom:PLAT_B+2.0 }); // lintel, overlaps both pillar tops, top=5.4
  coins.push({ key:"ripple", x:Bx, restOnYBottom:PLAT_B+0.3 }); // under the arch, on the platform floor
  blocks.push({ shape:"box", mat:"metal",    w:2.2, h:2.0, x:Bx, yBottom:5.4 }); // top=7.4
  blocks.push({ shape:"box", mat:"concrete", w:1.8, h:1.6, x:Bx, yBottom:7.4 }); // top=9.0
  blocks.push({ shape:"board", mat:"metal",  w:2.4, h:0.4, x:Bx, yBottom:9.0 }); // cap, top=9.4 — spans[17.3,19.7], the bridge's left seat

  // ---- TOWER C (x=23.5, tallest at 12.8m incl. antenna — a mid-stack
  // frame+glass niche, a cap at 9.4m matching tower B's for the bridge's
  // right seat, then a narrower column shifted to the cap's RIGHT shoulder
  // — same "bridge sits on the clear shoulder" pattern level 2's tower B
  // used — rising to an antenna spire) ----
  const Cx = 23.5;
  blocks.push({ shape:"box", mat:"concrete", w:2.6, h:1.4, x:Cx, yBottom:0 }); // top=1.4
  blocks.push({ shape:"box", mat:"metal",    w:2.2, h:2.0, x:Cx, yBottom:1.4 }); // top=3.4
  blocks.push({ shape:"box", mat:"concrete", w:2.0, h:2.0, x:Cx, yBottom:3.4 }); // top=5.4
  blocks.push(...frameBlocks("metal", Cx, 5.4, 1.8, 2.0, 0.4)); // hollow niche, 5.4-7.4
  blocks.push({ shape:"box", mat:"glass", w:1.0, h:1.2, x:Cx, yBottom:5.8, decorative:true });
  coins.push({ key:"solana", x:Cx, restOnYBottom:5.8 });
  blocks.push({ shape:"box", mat:"concrete", w:1.6, h:1.6, x:Cx, yBottom:7.4 }); // top=9.0
  blocks.push({ shape:"board", mat:"metal",  w:2.4, h:0.4, x:Cx, yBottom:9.0 }); // cap, top=9.4 — spans[22.3,24.7]
  blocks.push({ shape:"box", mat:"metal",    w:1.4, h:1.8, x:Cx+0.5, yBottom:9.4 }); // shifted right — spans[23.3,24.7], top=11.2
  blocks.push(...antennaSpire(Cx+0.5, 11.2, 1.6, 0.5)); // apex=12.8

  // ---- BRIDGE: left end seated 0.5m inside tower B's cap (right edge
  // 19.7), right end seated on tower C's cap's LEFT SHOULDER, clear of the
  // column above (which starts at 23.3) ----
  const bridgeX0 = 19.2, bridgeX1 = 23.0;
  const bridgeW = bridgeX1-bridgeX0, bridgeCx = (bridgeX0+bridgeX1)/2;
  blocks.push({ shape:"board", mat:"metal", w:bridgeW, h:0.3, x:bridgeCx, yBottom:9.4 });
  coins.push({ key:"ethereum", x:bridgeCx, restOnYBottom:9.7 });

  // ---- TOWER D (x=28, finale centerpiece — wedge pyramid-skirt base, a
  // frame+glass niche, capped with a reactor ball resting flush on a flat
  // box top, same stable "ball-caps-a-flat-tier" pattern level 3 uses) ----
  const Dx = 28;
  blocks.push({ shape:"box", mat:"concrete", w:3.2, h:1.4, x:Dx, yBottom:0 }); // top=1.4
  blocks.push({ shape:"wedge", mat:"metal", w:0.8, h:1.4, x:Dx-1.9, yBottom:0, mirror:true });
  blocks.push({ shape:"wedge", mat:"metal", w:0.8, h:1.4, x:Dx+1.9, yBottom:0 });
  blocks.push({ shape:"box", mat:"metal",    w:2.6, h:2.2, x:Dx, yBottom:1.4 }); // top=3.6
  blocks.push({ shape:"box", mat:"concrete", w:2.2, h:2.2, x:Dx, yBottom:3.6 }); // top=5.8
  blocks.push(...frameBlocks("concrete", Dx, 5.8, 2.2, 2.2, 0.4)); // hollow niche, 5.8-8.0
  blocks.push({ shape:"box", mat:"glass", w:1.2, h:1.2, x:Dx, yBottom:6.2, decorative:true });
  coins.push({ key:"bitcoin", x:Dx, restOnYBottom:6.2 });
  blocks.push({ shape:"box", mat:"metal", w:1.8, h:2.0, x:Dx, yBottom:8.0 }); // top=10.0
  blocks.push({ shape:"circle", mat:"metal", r:0.65, x:Dx, yBottom:10.0 }); // reactor-ball cap, flush on the flat top

  return {
    name:"Мегаполис", charges:5, blocks, coins,
    worldWidth:32, palette:"acidNeon",
    pits:[ { x0:PIT_X0, x1:PIT_X1 } ],
  };
}

/* ======================================================================
   LEVEL DATA — 4 hand-built levels, each its own array of block specs
   (box/tri/wedge/circle/board + the frame/arch/antenna composites above),
   x always inside 6.0..17.3, heights up to ~15m. Coins are listed
   separately per level.
   ====================================================================== */
const LEVELS = [
  // ---- Level 1: "Три башни" — rebuilt 2026-10-03 to match the reference
  // image's three wide, massive towers (see buildLevel1() above).
  buildLevel1(),

  // ---- Level 2: "Мост" — rebuilt 2026-10-03 batch-1, see buildLevel2() above.
  buildLevel2(),

  // ---- Level 3: "Крепость на крыше" — batch-2 rebuild, see buildLevel3() above.
  buildLevel3(),

  // ---- Level 4: "Пирамида" — batch-2 rebuild, see buildLevel4() above.
  buildLevel4(),

  // ---- Level 5: "Небоскрёб" — batch-3, see buildLevel5() above.
  buildLevel5(),

  // ---- Level 6: "Снайпер" — batch-3, see buildLevel6() above.
  buildLevel6(),

  // ---- Level 7: "Рампа" — batch-4, see buildLevel7() above.
  buildLevel7(),

  // ---- Level 8: "Мегаполис" — batch-4, see buildLevel8() above.
  buildLevel8(),
];
LEVELS.forEach(lvl => { if (lvl.extraBlocks){ lvl.blocks = lvl.blocks.concat(lvl.extraBlocks); } });

/* ======================================================================
   STAGE-1 DISTANCE REWORK (2026-10-03) — "like Angry Birds": the target
   structure now sits far from the slingshot instead of 2-4m away. Each
   level's ENTIRE structure (every block/coin/pit x-coordinate) is
   translated right by a fixed per-level offset — internal relative
   geometry is untouched, only where the whole thing sits on the x-axis.
   Shift amounts were computed by hand from each level's PRE-shift nearest-
   block distance from the shared anchor (anchorM.x=2.8, confirmed constant
   across all 8 levels — no level sets levelDef.anchorXM) to land inside
   its tier's target range (see the stage-1 spec):
     tier          levels   target nearest-dist   old nearest  shift   new nearest
     easy          1,2      12-14m                 1: 3.35m    1:+9.65  1: 13.00m
                                                    2: 1.45m    2:+10.55 2: 12.00m
     medium        3,4      15-18m                 3: 3.20m    3:+12.80 3: 16.00m
                                                    4: 4.40m    4:+12.60 4: 17.00m
     hard          5,6      19-24m                 5: 8.90m    5:+12.10 5: 21.00m
                                                    6: 23.20m   6:+0     6: 23.20m (already in [19,24], no shift needed)
     expert        7,8      24-30m                 7: 5.70m    7:+21.30 7: 27.00m
                                                    8: 4.70m    8:+24.30 8: 29.00m
   Level 6 ("Снайпер") was purpose-built in a prior batch with a ~24m
   target and already satisfies the newly-formalized hard-tier upper bound
   (19-24m), so it is intentionally left unshifted.
   The slingshot's own stand (level 6's roof platform at SLING_X=2.8) is
   NOT part of "the structure" and must never move — shiftLevel() below
   only ever touches levelDef.blocks/coins/pits, which for every level is
   exactly the target structure (the one shared-x exception, level 6's
   roof platform, has shift 0 anyway so this is moot in practice).
   worldWidth is then recomputed per the spec's rule
   ("rightmost block's extent + 4m") programmatically from the POST-shift
   data, rather than hand-picked, so it can never drift out of sync with
   the actual shifted geometry.
   ====================================================================== */
const LEVEL_SHIFTS_M = [9.65, 10.55, 12.8, 12.6, 12.1, 0, 21.3, 24.3];
function shiftLevelX(level, shift){
  if (shift){
    for (const b of level.blocks){
      if (b.x !== undefined) b.x += shift;
      if (b.xAbs !== undefined) b.xAbs += shift;
    }
    for (const c of level.coins) c.x += shift;
    if (level.pits) for (const p of level.pits){ p.x0 += shift; p.x1 += shift; }
  }
  return level;
}
function computeWorldWidthM(level){
  let maxX = 0;
  for (const b of level.blocks){
    const bx = (b.xAbs !== undefined) ? b.xAbs : b.x;
    if (bx === undefined) continue;
    const half = (b.r !== undefined) ? b.r : ((b.w||0)/2);
    maxX = Math.max(maxX, bx + half);
  }
  for (const c of level.coins) maxX = Math.max(maxX, c.x + COIN_R);
  return Math.ceil(maxX + 4);
}
LEVELS.forEach((lvl, i) => {
  shiftLevelX(lvl, LEVEL_SHIFTS_M[i] || 0);
  lvl.worldWidth = computeWorldWidthM(lvl);
});
/* STAGE1_SHIFT_END */

/* ======================================================================
   SEEDED RNG — used ONLY when building static assets (background bake,
   sprite bake). Never called from a draw/render function.
   ====================================================================== */
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash01(a){ const v = Math.sin(a*12.9898)*43758.5453; return v - Math.floor(v); }

/* ======================================================================
   DIFFICULTY (stage 2) — 4 tiers, matching the stage-1 distance tiers
   (easy 12-14m / medium 15-18m / hard 19-24m / expert 24-30m). A tier
   drives, per level:
     charges   — shots per attempt (+ optional per-level chargesDelta, used
                 only by level 6 "Снайпер" to keep its 1-shot-less design)
     hpMul     — material durability multiplier (every block's HP; density/
                 friction are NOT touched, so the physics-checked stability
                 of every level is unchanged)
     coinValue — points per coin collected
     color     — the section's neon color in the menu
     rewardPerStar — DISPLAY ONLY: the deposit-bonus rate the server applies
                 per star (stage 3 — the client never computes a bonus).
   Coin COUNT is not changed by the tier: every coin sits in a niche/cap
   that was hand-built and physics-checked around it, so adding/removing
   coins means rebuilding that geometry (see the stage-2 report).
   ====================================================================== */
const REWARDS = { easy:0.1, medium:0.2, hard:0.35, expert:0.5 }; // % per star — mirrors the server config, display only
const MAX_BONUS = 5.0;                                            // % — mirrors the server cap, display only
const DIFFICULTY = {
  easy:   { label:"ЛЁГКИЕ",  dist:"12–14 м", color:"#3dff9a", charges:5, hpMul:0.80, coinValue:1000 },
  medium: { label:"СРЕДНИЕ", dist:"15–18 м", color:"#22e6ff", charges:4, hpMul:1.00, coinValue:1500 },
  hard:   { label:"СЛОЖНЫЕ", dist:"19–24 м", color:"#ff2bd6", charges:4, hpMul:1.15, coinValue:2000 },
  expert: { label:"ЭКСПЕРТ", dist:"24–30 м", color:"#ffb02a", charges:5, hpMul:1.30, coinValue:3000 },
};
const TIER_ORDER = ["easy","medium","hard","expert"];
const LEVEL_TIERS = ["easy","easy","medium","medium","hard","hard","expert","expert"];
const LEVEL_CHARGES_DELTA = { 5: -1 }; // level 6 "Снайпер": 3 shots by design
const UNUSED_SHOT_BONUS = 2000;        // points per unused shot on a win
const BLOCK_POINTS = 500;
LEVELS.forEach((lvl, i) => {
  const tier = LEVEL_TIERS[i];
  const d = DIFFICULTY[tier];
  lvl.tier = tier;
  lvl.charges = d.charges + (LEVEL_CHARGES_DELTA[i] || 0);
  lvl.hpMul = d.hpMul;
  lvl.coinValue = d.coinValue;
});
// Stars: 1 for clearing the level, +1 for each unused shot, capped at 3
// ("every saved shot is a star") — identical rule on every level.
function starsFor(chargesLeft){ return Math.max(1, Math.min(3, 1 + chargesLeft)); }

/* ======================================================================
   PROGRESS (stage 2: persistent, no daily reset) — best stars + best
   score per level. Unlock rule: level i is playable once level i-1 has
   at least one star. Stars/records are local UI state only; the deposit
   bonus is NEVER derived from them on the client (stage 3: server).
   ====================================================================== */
const PROGRESS_KEY = "lq_arena_progress_v1";
const PROFILE_KEY = "lq_arena_profile_v1";
function loadProgress(){
  try{
    const raw = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null");
    if (raw && raw.levels && typeof raw.levels === "object") return raw;
  }catch(e){}
  return { levels: {} };
}
let progress = loadProgress();
function saveProgress(){ try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }catch(e){} }
function levelProgress(i){ return progress.levels[i] || { stars:0, best:0 }; }
function isUnlocked(i){ return i === 0 || levelProgress(i-1).stars > 0; }
function totalStars(){ let n = 0; for (let i = 0; i < LEVELS.length; i++) n += levelProgress(i).stars; return n; }
// Server-confirmed bonus cache (stage 3 fills this from the API response).
// The client only DISPLAYS it — it is never computed here.
function loadProfileCache(){
  try{
    const raw = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
    if (raw && typeof raw.bonusPct === "number") return raw;
  }catch(e){}
  return { bonusPct: 0 };
}
function telegramUser(){
  try{
    const tw = window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user;
    return tw || (window.LQApi && LQApi.unsafeUser()) || null;
  }catch(e){ return null; }
}

/* ======================================================================
   MENU / LEVEL SELECT (stage 2) — profile plate + 4 difficulty sections.
   Cards call loadLevel(i), same function the restart button calls.
   Thumbnails + the blurred menu background are real renders of each
   level, made by createScene(..., {snapshot:true}) — see makeMenuArt().
   ====================================================================== */
const levelSections = document.getElementById("level-sections");
const menuBgCanvas = document.getElementById("menu-bg");
const thumbCache = [];          // [i] -> canvas, filled lazily by makeMenuArt()
const THUMB_W = 360, THUMB_H = 200;
const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function fmtScore(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

function renderProfile(){
  const u = telegramUser();
  const name = u ? [u.first_name, u.last_name].filter(Boolean).join(" ") : "Игрок";
  document.getElementById("pf-name").textContent = name;
  document.getElementById("pf-ava").textContent = (name.trim()[0] || "И").toUpperCase();
  document.getElementById("pf-stars").innerHTML = `★ ${totalStars()}<small>/${LEVELS.length*3}</small>`;
  const bonus = Math.min(MAX_BONUS, Math.max(0, loadProfileCache().bonusPct));
  document.getElementById("pf-bonus").innerHTML = `+${bonus.toFixed(2)}% <small>из ${MAX_BONUS.toFixed(1)}%</small>`;
  const bar = document.getElementById("pf-bar");
  bar.style.width = "0";
  requestAnimationFrame(() => { bar.style.width = (100*bonus/MAX_BONUS).toFixed(1) + "%"; });
}

function drawThumbInto(cardCanvas, i){
  const src = thumbCache[i];
  if (!src) return;
  cardCanvas.width = src.width; cardCanvas.height = src.height;
  cardCanvas.getContext("2d").drawImage(src, 0, 0);
  cardCanvas.classList.add("ready");
}

// (stage 3) pull the server's view (bonus + best stars) once per menu visit.
let profileSyncInFlight = false;
function syncProfileFromServer(){
  const api = window.LQApi;
  if (!api || !api.hasTelegram() || profileSyncInFlight) return;
  profileSyncInFlight = true;
  api.getProfile().then(p => {
    saveServerBonus(p.bonusTotalPct);
    let changed = false;
    for (const [k, v] of Object.entries(p.levels || {})){
      const i = Number(k);
      if (!(i >= 0 && i < LEVELS.length)) continue;
      const lp = levelProgress(i);
      const s = Math.max(0, Math.min(3, v.bestStars|0));
      if (s > lp.stars){ progress.levels[i] = { stars:s, best: Math.max(lp.best, v.bestScore|0) }; changed = true; }
    }
    if (changed) saveProgress();
    if (levelsWrap.classList.contains("active")){ if (changed) renderLevelSelect(true); else renderProfile(); }
  }).catch(e => console.warn("[api] profile failed:", e.kind, e.code || ""))
    .finally(() => { profileSyncInFlight = false; });
}

function renderLevelSelect(fromSync){
  progress = loadProgress();
  renderProfile();
  if (!fromSync) setTimeout(syncProfileFromServer, 0);
  levelSections.innerHTML = "";
  let cardIdx = 0;
  TIER_ORDER.forEach((tier, si) => {
    const d = DIFFICULTY[tier];
    const sec = document.createElement("div");
    sec.className = "sec";
    sec.style.setProperty("--sec", d.color);
    sec.innerHTML = `
      <div class="sec-head" style="animation-delay:${(0.12 + si*0.12).toFixed(2)}s">
        <div class="sec-title">${d.label}</div>
        <div class="sec-line"></div>
        <div class="sec-info">${d.dist} · <b>+${REWARDS[tier]}%/★</b></div>
      </div>
      <div class="sec-grid"></div>`;
    const grid = sec.querySelector(".sec-grid");
    LEVELS.forEach((lvl, i) => {
      if (lvl.tier !== tier) return;
      const lp = levelProgress(i);
      const unlocked = isUnlocked(i);
      const card = document.createElement("div");
      card.className = "lv-card" + (unlocked ? "" : " locked");
      card.dataset.level = String(i);
      card.style.animationDelay = (0.18 + si*0.12 + (cardIdx%2)*0.06).toFixed(2) + "s";
      cardIdx++;
      const stars = [0,1,2].map(k => `<span class="${k < lp.stars ? "on" : ""}">★</span>`).join("");
      card.innerHTML = `
        <div class="lv-top"><span class="lv-num">${String(i+1).padStart(2,"0")}</span><span class="lv-name">${lvl.name}</span></div>
        <div class="lv-thumb">
          <canvas></canvas>
          ${unlocked ? "" : `<div class="lv-lock">${LOCK_SVG}<span>Пройди уровень ${i}</span></div>`}
        </div>
        <div class="lv-mid">
          <div class="lv-chips" title="монет · снарядов"><span>🪙 ${lvl.coins.length}</span><span>🎯 ${lvl.charges}</span></div>
          <div class="lv-stars">${stars}</div>
        </div>
        <div class="lv-foot">
          <span class="lv-best">${lp.best > 0 ? `Рекорд <b>${fmtScore(lp.best)}</b>` : "Рекорд —"}</span>
          <span class="lv-badge">+${REWARDS[tier]}%/★</span>
        </div>`;
      drawThumbInto(card.querySelector("canvas"), i);
      card.addEventListener("click", () => {
        if (!isUnlocked(i)){
          card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
          return;
        }
        loadLevel(i);
      });
      // replay-safe: the entrance animation must not re-run when "shake" ends
      card.addEventListener("animationend", (e) => {
        if (e.animationName === "cardIn") card.classList.add("in");
        else if (e.animationName === "shakeX") card.classList.remove("shake");
      });
      grid.appendChild(card);
    });
    levelSections.appendChild(sec);
  });
}
renderLevelSelect();

/* ======================================================================
   SCREEN WIRING — menu, game, win/lose are ALL children of the one sized
   #app box; showScreen() is the single place that decides which is visible,
   so exactly one top-level screen is ever shown at a time.
   ====================================================================== */
const stageEl = document.getElementById("stage");
const appEl = document.getElementById("app");
const canvas = document.getElementById("game-canvas");
// `let`, not const: createScene's snapshot mode (menu thumbnails/background)
// temporarily points ctx at an offscreen canvas while it renders one frame,
// so a snapshot can never draw over the live game canvas.
let ctx = canvas.getContext("2d");
const levelsWrap = document.getElementById("levels-wrap");
const gameWrap = document.getElementById("game-wrap");
const backBtn = document.getElementById("back-btn");
const restartBtn = document.getElementById("restart-btn");
const gameLabel = document.getElementById("game-label");
const hintToast = document.getElementById("hint-toast");

const resultIcon = document.getElementById("result-icon");
const resultTitle = document.getElementById("result-title");
const resultSub = document.getElementById("result-sub");

const resultReward = document.getElementById("result-reward");

const nextBtn = document.getElementById("next-btn");
