let scene = null;

// FPS counter toggle — press F. A plain keyboard listener on window is fine;
// only the slingshot's own pointer handlers are restricted to the canvas.
let showFPS = false;
window.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F"){
    showFPS = !showFPS;
    fpsCounterEl.classList.toggle("show", showFPS);
  }
});

/* ---- canvas sizing: #app (the ONE 9:16 frame) is sized from #stage,
   purely in JS, no vh/dvh/min() — the menu now lives inside this same box
   instead of stretching to the full window. ---- */
let cssW = 0, cssH = 0, dpr = 1;
function resizeCanvas(){
  const W = stageEl.clientWidth, H = stageEl.clientHeight;
  let w = H * 9/16, h = H;
  if (w > W) { w = W; h = W * 16/9; }
  cssW = w; cssH = h;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  appEl.style.width = cssW + "px";
  appEl.style.height = cssH + "px";
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  console.log("canvas size:", cssW.toFixed(1) + "x" + cssH.toFixed(1));
  if (scene) scene.onResize();
  // the title's font-size/letter-spacing are derived from cssW (see
  // updateGameLabel below) — re-fit on every resize, not just on level load,
  // so rotating/resizing the window never leaves a stale, wrongly-sized title.
  if (gameWrap.classList.contains("active")) updateGameLabel(currentLevelIndex);
  // menu bg is a cssW-sized render: rebuild it once it exists and the size changed
  if (menuBgCanvas.classList.contains("ready") && Math.abs(menuBgCanvas.width - Math.round(cssW*dpr)) > 1) rebuildMenuBackground();
}
window.addEventListener("resize", resizeCanvas);
new ResizeObserver(resizeCanvas).observe(stageEl);

/* ---- level title fit: font-size is ALWAYS derived from cssW (the game
   frame's own CSS width), never from window size or canvas.width*dpr, per
   the 2026-10-03 fix — vw-based sizing used the actual browser viewport,
   which can be wider than the letterboxed #app frame, making the title
   oversized/clipped and shoving the back/restart buttons out of the HUD.
   A scratch (never-appended, never-drawn-to-screen) canvas context is used
   purely to call measureText() for an exact fit; it never touches the game
   canvas or the render loop. ---- */
const titleMeasureCtx = document.createElement("canvas").getContext("2d");
function measureTitleWidth(text, fontPx, letterSpacingPx){
  titleMeasureCtx.font = `400 ${fontPx}px "Russo One", "Segoe UI", sans-serif`;
  return titleMeasureCtx.measureText(text).width + letterSpacingPx * Math.max(0, text.length - 1);
}
function updateGameLabel(i){
  const text = `УРОВЕНЬ ${i + 1}`;
  const maxWidth = cssW * 0.5;
  let fontSize = cssW * 0.06;
  for (let iter = 0; iter < 10; iter++){
    const letterSpacing = fontSize * 0.09;
    const w = measureTitleWidth(text, fontSize, letterSpacing);
    if (w <= maxWidth) break;
    fontSize *= maxWidth / w; // shrink proportionally and re-measure
  }
  const letterSpacing = fontSize * 0.09;
  gameLabel.textContent = text;
  gameLabel.style.fontSize = fontSize.toFixed(2) + "px";
  gameLabel.style.letterSpacing = letterSpacing.toFixed(2) + "px";
  console.log("[title] fit", text, "fontSize=", fontSize.toFixed(1),
    "measuredWidth=", measureTitleWidth(text, fontSize, letterSpacing).toFixed(1),
    "maxWidth=", maxWidth.toFixed(1), "cssW=", cssW.toFixed(1));
}

resizeCanvas();

// The ONE place that decides which top-level screen is visible — every
// other screen gets display:none (via losing .active), never just opacity.
function showScreen(name){
  levelsWrap.classList.remove("active");
  gameWrap.classList.remove("active");
  if (name === "menu") levelsWrap.classList.add("active");
  else if (name === "game") gameWrap.classList.add("active");
}

/* ---- (stage 3) server run per attempt. Each loadLevel() (including
   restart) opens a fresh server-side run; the win report must reference it.
   `activeRun` guards against a late answer from a previous attempt
   touching the current screen. ---- */
const API = window.LQApi || null;
let activeRun = null;
function beginRun(i){
  const run = { levelId:i, runId:null, startError:null, start:null };
  if (API && API.hasTelegram()){
    run.start = API.startLevel(i)
      .then(r => { run.runId = r && r.runId || null; })
      .catch(e => { run.startError = e; console.warn("[api] level-start failed:", e.kind, e.code || ""); });
  }
  activeRun = run;
}

function loadLevel(i){
  console.log("loadLevel", i);
  currentLevelIndex = i;
  beginRun(i);
  showScreen("game");
  updateGameLabel(i);
  resultOverlay.classList.remove("show");
  if (scene) scene.destroy();
  scene = createScene(LEVELS[i], { onSettle, onHint });
}
function closeLevel(){
  showScreen("menu");
  if (scene) { scene.destroy(); scene = null; }
  renderLevelSelect();
  pumpMenuArt();
}

/* ---- (stage 2) menu art: the blurred menu background (level 1, resting
   framing) and one thumbnail per level, each a real one-frame render of
   that level via createScene(..., {snapshot:true}). Built lazily, one job
   per timer tick so the menu stays responsive, and only while the menu is
   the visible screen (never competes with a running level). Thumbnails are
   cached for the session; the background is rebuilt on resize. ---- */
let menuArtJobs = ["bg", 0, 1, 2, 3, 4, 5, 6, 7];
let menuArtTimer = null;
function runMenuArtJob(job){
  const lvlIdx = job === "bg" ? 0 : job;
  const snap = createScene(LEVELS[lvlIdx], {}, { snapshot:true });
  try{
    if (job === "bg"){
      const img = snap.snapshot("rest");
      menuBgCanvas.width = img.width; menuBgCanvas.height = img.height;
      menuBgCanvas.getContext("2d").drawImage(img, 0, 0);
      menuBgCanvas.classList.add("ready");
    } else {
      thumbCache[job] = snap.snapshot("thumb", THUMB_W, THUMB_H);
      const cv = levelSections.querySelector(`.lv-card[data-level="${job}"] canvas`);
      if (cv) drawThumbInto(cv, job);
    }
  } finally { snap.destroy(); }
}
function pumpMenuArt(){
  if (menuArtTimer || !menuArtJobs.length) return;
  menuArtTimer = setTimeout(() => {
    menuArtTimer = null;
    if (!levelsWrap.classList.contains("active") || cssW <= 0) return; // resumes from closeLevel()
    const job = menuArtJobs.shift();
    try { runMenuArtJob(job); } catch(e){ console.error("[menu-art] job", job, "failed:", e); }
    pumpMenuArt();
  }, 30);
}
function rebuildMenuBackground(){
  if (!menuArtJobs.includes("bg")) menuArtJobs.unshift("bg");
  pumpMenuArt();
}
setTimeout(pumpMenuArt, 0); // after the whole script (shared sprites etc.) has run
backBtn.addEventListener("click", closeLevel);
restartBtn.addEventListener("click", () => loadLevel(currentLevelIndex));
retryBtn.addEventListener("click", () => { resultOverlay.classList.remove("show"); loadLevel(currentLevelIndex); });
// resultIsWin: set by onSettle. On a loss the primary button reads
// "Заново" and must restart THIS level (it used to advance to the next one).
let resultIsWin = false;
nextBtn.addEventListener("click", () => {
  resultOverlay.classList.remove("show");
  if (!resultIsWin){ loadLevel(currentLevelIndex); return; }
  const next = currentLevelIndex + 1;
  if (next < LEVELS.length && isUnlocked(next)) loadLevel(next); else closeLevel();
});

function onHint(text, visible){
  hintToast.textContent = text;
  hintToast.style.opacity = visible ? "1" : "0";
}

/* ---- (stage 3) deposit-bonus panel on the win screen ---- */
function showReward(kind, html){
  resultReward.className = "result-reward" + (kind ? " show " + kind : "");
  const link = (kind === "ok" || kind === "info") ? '<div><button class="rw-link" type="button" data-info="bonus">Что это за бонус?</button></div>' : "";
  resultReward.innerHTML = (html || "") + link;
}
resultReward.addEventListener("click", (e) => { if (e.target.closest("[data-info]")) openInfo("bonus"); });
function pct(v){ return (Math.round(Number(v)*100)/100).toFixed(2) + "%"; }
function saveServerBonus(totalPct){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify({ bonusPct: Number(totalPct) || 0, at: Date.now() })); }catch(e){}
}
const REJECT_TEXT = {
  run_not_found: "Сессия уровня истекла. Переиграй уровень, чтобы получить бонус.",
  run_expired:   "Сессия уровня истекла. Переиграй уровень, чтобы получить бонус.",
  level_locked:  "Этот уровень ещё не открыт на сервере. Пройди предыдущий уровень в Telegram.",
  config_mismatch: "Версия игры устарела. Перезапусти игру.",
};
function rewardErrorText(e){
  switch (e && e.kind){
    case "no-telegram":  return { cls:"info", text:"Бонус к депозиту начисляется только при игре в Telegram." };
    case "unauthorized": return { cls:"err", text:"Сессия Telegram устарела. Закрой и открой игру заново, затем переиграй уровень." };
    case "rate-limited": return { cls:"err", text:"Слишком много попыток. Подожди пару минут.", retry:true };
    case "rejected":     return { cls:"err", text: REJECT_TEXT[e.code] || "Сервер не принял результат. Бонус не начислен." };
    case "offline":
    case "timeout":      return { cls:"err", text:"Нет связи с сервером. Бонус пока не начислен.", retry:true };
    default:             return { cls:"err", text:"Ошибка сервера. Бонус пока не начислен.", retry:true };
  }
}
function reportWin(run, facts){
  if (!API){ showReward("err", "Модуль API не загрузился. Бонус не начислен."); return; }
  if (!API.hasTelegram()){ showReward("info", rewardErrorText({kind:"no-telegram"}).text); return; }
  showReward("pending", '<span class="rw-spin"></span>Начисляем бонус…');
  const onScreen = () => activeRun === run && resultOverlay.classList.contains("show");
  Promise.resolve(run && run.start).then(() => {
    if (!run || !run.runId){
      // level-start never reached the server: there is no run to report against,
      // and retrying now would fail the server's minimum-time check anyway.
      const e = run && run.startError;
      if (e && e.kind !== "offline" && e.kind !== "timeout") throw e;
      throw Object.assign(new Error("no run"), { kind:"no-run" });
    }
    return API.completeLevel(Object.assign({ runId: run.runId }, facts));
  }).then(r => {
    saveServerBonus(r.bonusTotalPct);   // the server's number, as-is
    if (!onScreen()) return;
    const total = `Всего ${pct(r.bonusTotalPct)} из ${Number(r.maxBonusPct).toFixed(1)}%`;
    if (r.bonusAddedPct > 0){
      showReward("ok", `<div class="rw-main">+${pct(r.bonusAddedPct)} к депозиту</div><div class="rw-sub">${total}${r.capped ? " · достигнут максимум" : ""}</div>`);
    } else if (r.capped || r.bonusTotalPct >= r.maxBonusPct){
      showReward("info", `Бонус уже на максимуме.<div class="rw-sub">${total}</div>`);
    } else {
      showReward("info", `Бонус за ${r.bestStars}★ на этом уровне уже получен. Больше звёзд — больше бонус.<div class="rw-sub">${total}</div>`);
    }
  }).catch(e => {
    console.warn("[api] level-complete failed:", e && e.kind, e && e.code || "");
    if (!onScreen()) return;
    if (e && e.kind === "no-run"){
      showReward("err", "Не удалось связаться с сервером в начале уровня. Бонус не начислен — переиграй уровень с интернетом.");
      return;
    }
    const t = rewardErrorText(e);
    showReward(t.cls, t.text + (t.retry ? '<div><button class="rw-retry" type="button">Повторить</button></div>' : ""));
    const btn = resultReward.querySelector(".rw-retry");
    // safe to repeat: the server answers a repeated runId with the stored result
    if (btn) btn.addEventListener("click", () => reportWin(run, facts), { once:true });
  });
}

// first launch: show the explainer once, after the menu has animated in
(function(){

// stats = { score } from the scene (blocks + coins collected so far).
function onSettle(cleared, total, chargesLeft, stats){
  const i = currentLevelIndex;
  const lvl = LEVELS[i];
  if (cleared === total){
    resultIsWin = true;
    const stars = starsFor(chargesLeft);
    const score = ((stats && stats.score) || 0) + chargesLeft * UNUSED_SHOT_BONUS;
    const prev = levelProgress(i);
    const newRecord = score > prev.best;
    const wasLocked = i+1 < LEVELS.length && !isUnlocked(i+1);
    progress.levels[i] = { stars: Math.max(prev.stars, stars), best: Math.max(prev.best, score) };
    saveProgress();
    resultIcon.textContent = "🏆";
    resultTitle.textContent = "Башни сбиты!";
    resultStars.querySelectorAll("span").forEach((el, k) => el.classList.toggle("on", k < stars));
    resultStars.classList.remove("show"); void resultStars.offsetWidth; resultStars.classList.add("show");
    const unlockMsg = (wasLocked && isUnlocked(i+1)) ? ` Открыт уровень ${i+2}!` : "";
    resultSub.textContent = (chargesLeft > 0 ? `Сэкономлено снарядов: ${chargesLeft}.` : "Все снаряды израсходованы.") + unlockMsg;
    resultScore.style.display = "block";
    resultScore.innerHTML = `${fmtScore(score)}<small>${newRecord ? '<span class="rec">Новый рекорд!</span>' : `Рекорд ${fmtScore(prev.best)}`}`
      + (chargesLeft > 0 ? ` · бонус за снаряды +${fmtScore(chargesLeft*UNUSED_SHOT_BONUS)}` : "") + `</small>`;
    // stage 3: "+X% к депозиту" appears ONLY after the server's answer
    reportWin(activeRun, { levelId:i, shotsUsed: lvl.charges - chargesLeft, coinsCollected: cleared, score });
    nextBtn.textContent = i < LEVELS.length-1 ? "Дальше" : "В меню";
    retryBtn.style.display = "block";
    resultOverlay.classList.add("show");
  } else if (chargesLeft <= 0){
    resultIsWin = false;
    resultIcon.textContent = "💥";
    resultTitle.textContent = "Заряды закончились";
    resultStars.classList.remove("show");
    resultSub.textContent = `Собрано монет: ${cleared} из ${total}. Попробуй ещё раз.`;
    resultScore.style.display = "none";
    showReward(null);
    nextBtn.textContent = "Заново";
    retryBtn.style.display = "none";
    resultOverlay.classList.add("show");
  }
}

/* ======================================================================
   SHARED, MODULE-LEVEL STATIC ASSETS — built once, reused by every scene.
   Nothing here depends on canvas size, so it never needs rebuilding.
   ====================================================================== */

// one blurred-ellipse shadow sprite, reused (scaled) for every floor shadow.
// The blur happens once, here, at load — never inside the game loop.
let shadowSprite = (function(){
  const c = document.createElement("canvas");
  c.width = 160; c.height = 80;
  const g = c.getContext("2d");
  g.filter = "blur(7px)";
  g.fillStyle = "rgba(4,2,8,0.55)";
  g.beginPath(); g.ellipse(80,40,58,24,0,0,Math.PI*2); g.fill();
  return c;
})();

// small soft glow blobs, one per color, built once with shadowBlur (not in
// the game loop) and reused everywhere via drawImage instead of live bloom.
const glowSpriteCache = new Map();
function getGlowSprite(color){
  let spr = glowSpriteCache.get(color);
  if (spr) return spr;
  const size = 96;
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const g = c.getContext("2d");
  g.shadowColor = color; g.shadowBlur = size*0.32;
  g.fillStyle = color;
  g.beginPath(); g.arc(size/2,size/2,size*0.1,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(size/2,size/2,size*0.1,0,Math.PI*2); g.fill(); // double-stamp, cheap extra density
  glowSpriteCache.set(color, c);
  return c;
}
function drawGlow(gctx, xpx, ypx, radiusPx, color, alpha){
  if (alpha <= 0.01 || radiusPx <= 0) return;
  const spr = getGlowSprite(color);
  const size = radiusPx*2.4;
  gctx.save();
  gctx.globalAlpha = alpha;
  gctx.globalCompositeOperation = "lighter";
  gctx.drawImage(spr, xpx-size/2, ypx-size/2, size, size);
  gctx.restore();
}

/* ======================================================================
   SCENE: Planck.js (Box2D) physics — world.step, damage system (post-solve
   impulse → HP → crack/shatter), the drag/release shot mechanic, screen
   sizing, camera and level layout are ALL UNCHANGED. This round only fixes
   bugs (the rolling ammo, menu wiring, input scoping, overlay hiding) and
   rendering performance/flicker (no more live blur/gradients per block,
   no more adaptive bloom, no more per-frame randomness).
   ====================================================================== */
function createScene(levelDef, hooks, opts){
  let destroyed = false;
  // (stage 2) snapshot mode: build the level exactly as in play, but attach
  // no input listeners and start no rAF loop — the caller renders single
  // frames via the returned snapshot() (menu thumbnails + menu background).
  const SNAPSHOT = !!(opts && opts.snapshot);
  const HP_MUL = levelDef.hpMul || 1;
  const COIN_VALUE = levelDef.coinValue || 1000;
  let score = 0;

  // One fixed scale for every level. WORLD_W_M stays the PHYSICS ground's
  // own sizing (untouched — the ground fixture below is 2*WORLD_W_M wide,
  // so it already spans well past the camera's new framing either way).
  // VISIBLE_W_M is the camera's own field of view in meters (2026-10-03:
  // zoomed out from 18 to 22, ~20% more world visible) and CAM_LEFT_M is
  // the world-x shown at the frame's left edge at rest, so SCALE/framing
  // are entirely independent of level data or body sizes.
  const WORLD_W_M = 18;
  const VISIBLE_W_M = 22;     // camera width in meters AT REST/zoom=1 — the
                              // established default framing, unchanged; a
                              // level's own worldWidth (22-34m) can be wider
                              // than this, meaning distant content is
                              // legitimately off-screen at rest (per spec).
  // (stage-1, 2026-10-03) CAM_LEFT_M is no longer a fixed world-space
  // convention — it is computed so the slingshot's anchor sits at 15% of
  // VISIBLE_W_M in from the frame's left edge at rest:
  //   CAM_LEFT_M = anchorM.x - 0.15*VISIBLE_W_M
  // anchorM itself isn't built until a bit further down (it depends on
  // levelDef.anchorLiftM), but anchorM.x only ever depends on
  // levelDef.anchorXM, which — checked across every one of the 8 level
  // builders above — no level ever sets (anchorXM is always the 2.8
  // default), so this is safe to compute right here from the same
  // `levelDef.anchorXM || 2.8` expression anchorM.x uses below, rather
  // than forward-referencing anchorM. If a future level ever DOES set a
  // custom anchorXM, this line (not anchorM's own definition) is the one
  // to make per-level — it already reads from levelDef, not a hardcoded
  // constant.
  const ANCHOR_X_M = levelDef.anchorXM || 2.8;
  const CAM_LEFT_M = ANCHOR_X_M - 0.15*VISIBLE_W_M; // = 2.8-3.3 = -0.5 for every current level
  let SCALE = 1, groundPxY = 0;

  function computeCamera(){
    SCALE = cssW / VISIBLE_W_M;
    groundPxY = cssH * 0.88; // ground sits 12% up from the bottom
  }

  /* ========================================================================
     CAMERA STATE MACHINE (#1, batch-1) — shared by every level, built to be
     reused/extended by levels 3-8 without touching this plumbing.

     camera.state is exactly one of:
       'flyover'   — level just loaded: holds on the whole structure, then
                     eases to the resting framing. Any tap anywhere skips
                     straight to resting.
       'resting'   — the default/idle framing (slingshot near the left
                     edge + VISIBLE_W_M of world, camera.camX===CAM_LEFT_M,
                     camera.zoom===1) — same convention every prior level
                     used, just now expressed as camera state.
       'following' — a shot is in the air: camX tracks the projectile on X
                     (margin-based, like the old camPanXm follow-cam) while
                     zoom eases toward a DYNAMIC target in [0.65,0.75]
                     (closer to the target structure -> nearer 0.75, farther
                     -> down to 0.65 — see followZoomTarget()) so both ammo
                     and target stay visible; once the shot settles this
                     starts an eased return to 'resting'.
       'panning'   — the player is swiping empty canvas space (not the
                     slingshot/pouch): camX tracks the drag 1:1, clamped to
                     the level's world bounds. After 1.5s with no further
                     pan input it starts an eased return to 'resting'.
       'pulling'   — (stage-1, #4) the pouch is currently being dragged:
                     an eased, FIXED 0.65x zoom-out + a pan that fits both
                     the anchor and the whole target structure in frame
                     (see startPullCamera()). Released without shooting
                     (dragged back under the anchor threshold) eases back
                     to 'resting' (endPullCameraToResting()); released as
                     an actual shot goes straight to 'following' instead.
                     A 2-finger pinch starting mid-pull cancels the pull
                     (pouch snaps back) and also returns to 'resting'.

     camera.camX is the world-x (meters) shown at the frame's LEFT edge —
     exactly what CAM_LEFT_M used to be, just now a live, mutable value.
     camera.zoom multiplies the base SCALE (1 = rest, 0.75 = zoomed out
     while following a shot). toPx()/toM() below are the ONLY two places
     that read camera.camX/zoom, so every draw call and every input
     coordinate conversion is automatically camera-aware.

     Transitions never snap: camera.easing + startCameraEase()/
     updateCameraEase() smoothly interpolate (easeInOut) camX+zoom toward a
     target over a given duration, independent of which state requested it
     (flyover-end, post-shot return, and pan-idle-return all reuse it) —
     see updateCameraState(), called once per step().
     ======================================================================== */
  function easeInOut(t){ return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }

  // Frame the flyover around the level's actual content bounding box
  // (blocks + coins + the slingshot itself), not the nominal `worldWidth`
  // param — robust regardless of exactly where a level's blocks sit inside
  // that nominal width.
  function computeStructureBoundsM(){
    let minX = Infinity, maxX = -Infinity;
    for (const b of levelDef.blocks){
      const cx = b.xAbs != null ? b.xAbs : b.x;
      if (cx == null) continue;
      const halfW = b.shape === "circle" ? (b.r||0.5) : (b.w||1)/2;
      minX = Math.min(minX, cx-halfW); maxX = Math.max(maxX, cx+halfW);
    }
    for (const c of levelDef.coins){ minX = Math.min(minX, c.x-COIN_R); maxX = Math.max(maxX, c.x+COIN_R); }
    minX = Math.min(minX, (levelDef.anchorXM||2.8) - 1.8);
    if (!isFinite(minX) || !isFinite(maxX)) return { minX:0, maxX:VISIBLE_W_M };
    return { minX, maxX };
  }
  const structureBoundsM = computeStructureBoundsM();
  const flyoverZoom = Math.max(0.5, Math.min(1, VISIBLE_W_M / Math.max(1,(structureBoundsM.maxX-structureBoundsM.minX)*1.12)));
  const flyoverCamX = (structureBoundsM.minX+structureBoundsM.maxX)/2 - (VISIBLE_W_M/flyoverZoom)/2;
  const worldWidthM = levelDef.worldWidth || VISIBLE_W_M;

  const camera = {
    state: "flyover",
    camX: flyoverCamX, zoom: flyoverZoom,
    phaseStartMs: performance.now(),
    easing: false, easeFromX:0, easeFromZoom:0, easeToX:0, easeToZoom:0, easeStartMs:0, easeDurMs:0,
  };
  function startCameraEase(toX, toZoom, durMs){
    camera.easeFromX = camera.camX; camera.easeFromZoom = camera.zoom;
    camera.easeToX = toX; camera.easeToZoom = toZoom;
    camera.easeStartMs = performance.now(); camera.easeDurMs = durMs; camera.easing = true;
  }
  function updateCameraEase(){
    if (!camera.easing) return;
    const t = Math.min(1, (performance.now()-camera.easeStartMs)/camera.easeDurMs);
    const e = easeInOut(t);
    camera.camX = camera.easeFromX + (camera.easeToX-camera.easeFromX)*e;
    camera.zoom = camera.easeFromZoom + (camera.easeToZoom-camera.easeFromZoom)*e;
    if (t >= 1) camera.easing = false;
  }
  function skipFlyover(){
    if (camera.state !== "flyover") return;
    camera.easing = false;
    camera.state = "resting"; camera.camX = CAM_LEFT_M; camera.zoom = 1;
  }
  function camVisibleWidthM(){ return VISIBLE_W_M / camera.zoom; }
  // `zoom` is optional and defaults to the camera's CURRENT zoom — pass the
  // TARGET zoom explicitly when clamping a camX that's about to be eased
  // toward a different zoom (e.g. startPullCamera() below), otherwise the
  // clamp uses the stale pre-ease zoom and can wrongly cut off a pan that
  // would have been in-range at the target zoom.
  function clampCamX(x, zoom){
    const visW = VISIBLE_W_M / (zoom || camera.zoom);
    const minX = -3;
    const maxX = Math.max(minX, worldWidthM - visW + 3);
    return Math.max(minX, Math.min(maxX, x));
  }
  // Called once per physics tick from step() — drives the flyover hold/ease
  // timer and the pan-idle-return timer; the 'following' state's own
  // per-frame zoom/camX update lives in updateCameraFollow() below (it
  // needs `flying`, which isn't known at camera-definition time).
  function updateCameraState(){
    if (camera.state === "flyover" && !camera.easing){
      if (performance.now() - camera.phaseStartMs >= 1000){
        camera.state = "resting";
        startCameraEase(CAM_LEFT_M, 1, 1200);
      }
    }
    if (camera.state === "panning" && inputMode !== "pan"){
      if (performance.now() - panLastMoveMs >= 1500){
        camera.state = "resting";
        startCameraEase(CAM_LEFT_M, 1, 600);
      }
    }
    updateCameraEase();
  }

  function toPx(xm, ym){ const s = SCALE*camera.zoom; return { x: (xm-camera.camX)*s, y: groundPxY - (ym-groundTopM)*s }; }
  function toM(xp, yp){ const s = SCALE*camera.zoom; return { x: xp/s + camera.camX, y: groundTopM + (groundPxY-yp)/s }; }

  const world = planck.World(planck.Vec2(0, -10));
  const DT = 1/60;

  const GROUND_M = 0.6;
  const groundTopM = GROUND_M;

  /* ---------------------------------------------------------------------
     TERRAIN PRIMITIVE: pit/gap (#2, batch-1). The ground used to be ONE
     static body spanning the whole world; it is now an ARRAY of static
     segments, with a gap left open wherever levelDef.pits says so (each
     {x0,x1} in world-m). Every segment is still tagged isGround:true (the
     coin ground-contact/rest-timer logic above only checks that flag, so
     it needs no change), and a level with no pits gets exactly the same
     single full-span segment as before — zero behavior change for levels
     that don't use this. groundSpanM is generous padding past worldWidth
     so levels up to 34m never run out of ground on either side.
     --------------------------------------------------------------------- */
  const pits = (levelDef.pits || []).slice().sort((a,b) => a.x0-b.x0);
  const groundSpanM = Math.max(40, (levelDef.worldWidth || WORLD_W_M) + 20);
  const groundX0 = -10, groundX1 = groundX0 + groundSpanM;
  function buildGroundSegments(){
    const segs = [];
    let cursor = groundX0;
    for (const p of pits){
      if (p.x0 > cursor) segs.push({ x0:cursor, x1:p.x0 });
      cursor = Math.max(cursor, p.x1);
    }
    if (cursor < groundX1) segs.push({ x0:cursor, x1:groundX1 });
    return segs.map(seg => {
      const w = seg.x1 - seg.x0, cx = (seg.x0+seg.x1)/2;
      const b = world.createBody({ type:"static", position: planck.Vec2(cx, GROUND_M/2) });
      b.createFixture(planck.Box(w/2, GROUND_M/2), { friction:0.9 });
      b.setUserData({ isGround:true });
      return { x0:seg.x0, x1:seg.x1 };
    });
  }
  const groundSegments = buildGroundSegments();

  // Slingshot elevation (#2, batch-1): a level can stand the slingshot on
  // a platform 2-4m tall via `levelDef.anchorLiftM` (the platform's own top
  // height, world-m above groundTopM) — the anchor's Y simply adds that on
  // top of the SAME fixed 3.4m pouch-above-its-stance constant every level
  // has always used, so the geometry/feel of the sling itself never
  // changes, only where its "ground" effectively is. Neither anchorM.x's
  // formula nor MAX_PULL_M/LAUNCH_POWER (below) are touched by this —
  // levels 1-2 this round both use the default (anchorLiftM:0, i.e.
  // identical to before); a future level sets anchorLiftM and places a
  // makePlatformBody(anchorM.x, anchorLiftM, ...) under the slingshot's feet.
  const anchorLiftM = levelDef.anchorLiftM || 0;
  const anchorM = { x: ANCHOR_X_M, y: groundTopM + anchorLiftM + 3.4 };
  // (batch-3, first real anchorLiftM use, level 6) the slingshot's own
  // COSMETIC pedestal/leg/horn geometry in drawSlingshot() below needs to
  // start from wherever the shooter is actually standing, not always the
  // true ground — this is purely where the visual "floor" is for drawing
  // that structure (groundTopM itself, plus whatever platform the level
  // stands it on); anchorM/MAX_PULL_M/LAUNCH_POWER above/below are the only
  // things that actually drive the pull/launch math, and none of them
  // reference standTopM at all.
  const standTopM = groundTopM + anchorLiftM;
  const MAX_PULL_M = 2.2;
  // (stage-1, 2026-10-03) raised from 10.6 to 11.8 so a full-pull 45-degree
  // shot's unobstructed range clears the longest level (8, worldWidth=59
  // post-shift) by >=20% margin — see render-check/launch_power_check.js
  // for the full derivation/numbers (old value failed the margin check by
  // a wide margin once the stage-1 distance rework made levels this long;
  // new value: range ~67.4m vs the required ~62.2m, ~30% margin).
  const LAUNCH_POWER = 11.8;
  const AMMO_CHARGES = levelDef.charges;
  let chargesUsed = 0;

  let ammoBody = null;     // kinematic, zero velocity, while loaded in the sling — not a free physics body
  let dragging = false;
  let flying = null;
  computeCamera();
  // Stage-1 verification: the rendered floor line (drawn at groundPxY in
  // buildBackground) and the physics ground-top must agree. Both already
  // derive from groundTopM via toPx(), so this just confirms it numerically
  // instead of silently assuming it — logs once per level load.
  console.log('[ground] groundTopM=', groundTopM, 'groundPxY=', groundPxY,
    'toPx(groundTopM).y=', toPx(0, groundTopM).y,
    'aligned:', Math.abs(toPx(0, groundTopM).y - groundPxY) < 0.01);
  let trail = [];
  let settledTimer = null;
  let ammoSlowAccum = 0;   // seconds the flying ammo has been under 0.3 m/s
  let sceneTime = 0;
  let wakeSafetyAccum = 0; // wall-clock seconds since the last wake-safety-net sweep

  const blocks = [];
  // coins are an INDEPENDENT entity list (see section 1 fix below) — never
  // attached to a block/body, so they can't be physically pushed out.
  const coins = [];
  // decorative-only records (e.g. niche glass backdrops): drawn, never a body
  const decor = [];

  // bounded effect pools: max 150 particles total, max 60 of them "shard"
  const MAX_PARTICLES = 150, MAX_SHARDS = 60;
  let particles = [];
  let shardCount = 0;
  function pushParticle(p){
    if (p.kind === "shard"){
      if (shardCount >= MAX_SHARDS) return;
      shardCount++;
    }
    if (particles.length >= MAX_PARTICLES){
      const removed = particles.shift();
      if (removed && removed.kind === "shard") shardCount--;
    }
    particles.push(p);
  }
  const dust = [];
  const MAX_DEBRIS = 40;
  let debris = [];
  const rings = [];
  const floatTexts = [];
  const comboTexts = []; // "COMBO x<n>" — bigger/glowing, separate from floatTexts

  /* ---- Ambient "life"/juice (#4): 20-30 drifting neon dust motes + 1-2
     far-background flying-car silhouettes, both SEEDED (mulberry32, keyed
     off this level's index) so they never flicker/reshuffle frame to frame
     — only updateAmbientFX() (called once per step()) moves them, drawn by
     drawAmbientFX() (called once per render(), screen-space, behind
     gameplay objects but in front of the background). ---- */
  const ambientSeed = 7301 + LEVELS.indexOf(levelDef) * 97;
  const dustMotes = (function(){
    const rng = mulberry32(ambientSeed);
    const n = 20 + Math.floor(rng()*11); // 20-30
    const neonColors = ["#22e6ff","#ff2bd6","#b388ff","#ffcc33"];
    const arr = [];
    for (let i=0;i<n;i++){
      arr.push({
        xFrac: rng(), yFrac: rng()*0.75,
        speed: 0.004+rng()*0.007, drift: (rng()-0.5)*0.0018,
        r: 1+rng()*1.8, color: neonColors[Math.floor(rng()*neonColors.length)],
        alpha: 0.22+rng()*0.33,
      });
    }
    return arr;
  })();
  const flyingCars = (function(){
    const rng = mulberry32(ambientSeed + 31);
    const n = 1 + (rng()>0.5?1:0); // 1-2
    const arr = [];
    for (let i=0;i<n;i++){
      arr.push({ xFrac: rng(), yFrac: 0.30+rng()*0.10, speed: 0.0010+rng()*0.0007, len: 16+rng()*9, color: rng()>0.5 ? "#22e6ff" : "#ff2bd6" });
    }
    return arr;
  })();
  function updateAmbientFX(dt){
    for (const m of dustMotes){
      m.xFrac += m.speed*dt; m.yFrac += m.drift*dt;
      if (m.xFrac > 1.05) m.xFrac -= 1.1; if (m.xFrac < -0.05) m.xFrac += 1.1;
      if (m.yFrac < 0) m.yFrac = 0; if (m.yFrac > 0.78) m.yFrac = 0.78;
    }
    for (const c of flyingCars){ c.xFrac += c.speed*dt; if (c.xFrac > 1.15) c.xFrac -= 1.3; }
  }
  function drawAmbientFX(){
    for (const m of dustMotes){
      const x = m.xFrac*cssW, y = m.yFrac*cssH*0.9 + cssH*0.03;
      ctx.globalAlpha = m.alpha; ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(x,y,m.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const c of flyingCars){
      const x = c.xFrac*cssW, y = c.yFrac*cssH;
      ctx.save();
      ctx.globalAlpha = 0.3; ctx.fillStyle = "#0b0816";
      ctx.beginPath(); ctx.ellipse(x,y,c.len*0.5,c.len*0.16,0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.55; ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.ellipse(x-c.len*0.42,y,c.len*0.13,c.len*0.05,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  const levelStartT = performance.now();
  let lastSpawnT = levelStartT;
  function inGrace(){
    const now = performance.now();
    return (now - levelStartT < 1500) || (now - lastSpawnT < 500);
  }

  let blockIdSeq = 0;
  // `spec` is one of the level-data block specs: { shape, mat, w,h (or r for
  // circle), x, yBottom (or xAbs/yAbs+angle for the pre-placed arch segments),
  // decorative (niche glass: no body at all — purely a backdrop sprite),
  // spireLight (tag a tri as carrying a blinking tip light), mirror (flips
  // tri/wedge polygons). NOTHING here attaches a coin to a block any more.
  function makeBlockBody(spec){
    const mat = spec.mat, matDef = MATERIALS[mat];
    const shape = spec.shape || "box";
    const w = spec.w, h = spec.h, r = spec.r;
    const cx = spec.xAbs != null ? spec.xAbs : spec.x;
    const cy = spec.yAbs != null ? spec.yAbs : (groundTopM + spec.yBottom + (shape==="circle" ? r : h)/2);

    if (spec.decorative){
      // glass niche backdrop: NO physical body — can never be pushed by
      // overlap, it's just a sprite drawn under the coin (section 1 fix).
      const rec = { decorative:true, mat, shape:"box", w, h, x:cx, y:cy, id:blockIdSeq++ };
      decor.push(rec);
      return rec;
    }

    // Terrain primitives (#2, batch-1): a spec can set `static:true` (or use
    // the dedicated `shape:"rampStatic"` / `shape:"platform"` shapes, which
    // imply it) to get an indestructible STATIC Planck body instead of the
    // usual dynamic-but-asleep destructible block — exactly like the ground
    // itself. These never take damage (damageBody() below skips any rec with
    // `terrain:true`) and never move, so circle/"reactor" blocks can roll
    // down a ramp or rest on a platform without ever nudging it.
    const isStatic = !!spec.static || shape === "rampStatic" || shape === "platform";
    const body = world.createBody({
      type: isStatic ? "static" : "dynamic",
      position: planck.Vec2(cx,cy),
      awake: isStatic ? undefined : false,
    });
    let fixture;
    if (shape === "circle"){
      fixture = planck.Circle(r);
    } else if (shape === "tri"){
      fixture = planck.Polygon(triVerts(w, h));
    } else if (shape === "wedge" || shape === "rampStatic"){
      fixture = planck.Polygon(rightTriVerts(w, h, !!spec.mirror));
    } else { // box, board, platform, frame-walls, arch segments
      fixture = planck.Box(w/2, h/2);
    }
    body.createFixture(fixture, { density: matDef.density, friction: matDef.friction, restitution: matDef.restitution });
    if (spec.angle) body.setAngle(spec.angle);
    const id = blockIdSeq++;
    const rec = {
      body, mat, shape, w: w||r*2, h: h||r*2, r, hp: matDef.hp*HP_MUL, maxHp: matDef.hp*HP_MUL, dead:false, crackStage:0,
      id, variant: id % 4, mirror: !!spec.mirror, terrain: isStatic,
    };
    body.setUserData(rec);
    blocks.push(rec);
    if (spec.spireLight) spireLights.push({ rec, dy: h/2 });
    return rec;
  }

  const spireLights = []; // [{body, dy}] — blinking tip light tracks its tri block
  levelDef.blocks.forEach(b => makeBlockBody(b));

  // ---- decor linking (bugfix): each niche-glass decorative backdrop (no
  // body of its own) is matched to whichever real block(s) physically
  // flank/support it, by AABB-overlap-with-margin at spawn time, so it can
  // stop being drawn once ALL of those support blocks are dead instead of
  // persisting forever as an orphaned "frame". This never attaches the
  // decor to a coin — coins aren't blocks and are never considered here.
  const DECOR_LINK_MARGIN = 0.3;
  decor.forEach(dRec => {
    const dx0 = dRec.x - dRec.w/2 - DECOR_LINK_MARGIN, dx1 = dRec.x + dRec.w/2 + DECOR_LINK_MARGIN;
    const dy0 = dRec.y - dRec.h/2 - DECOR_LINK_MARGIN, dy1 = dRec.y + dRec.h/2 + DECOR_LINK_MARGIN;
    dRec.linkedBlocks = blocks.filter(r => {
      const p = r.body.getPosition();
      const bx0 = p.x - r.w/2, bx1 = p.x + r.w/2;
      const by0 = p.y - r.h/2, by1 = p.y + r.h/2;
      return bx1 > dx0 && bx0 < dx1 && by1 > dy0 && by0 < dy1;
    });
  });

  // ---- coins: a fully independent entity list, each a DYNAMIC SENSOR body
  // (sensor = no collision response, so nothing can ever shove it out of
  // place; dynamic = it obeys gravity and actually falls once awake). It is
  // spawned ASLEEP at exactly beam_top + r, so it rests visually in place —
  // identical to the old static body — right up until something wakes it
  // (killBlock's neighbor-wake / the 0.5s safety net below), at which point
  // it starts falling for real instead of floating in mid-air.
  function spawnCoinEntities(){
    levelDef.coins.forEach(c => {
      const y = groundTopM + c.restOnYBottom + COIN_R;
      // (2026-10-04) A coin is now a KINEMATIC sensor that never moves on
      // its own. It used to be a dynamic sensor: with no physical support,
      // any wake-up (a hit up to 4m away) made it fall straight THROUGH its
      // tower to the ground, where it counted as collected — one shot
      // anywhere cleared whole levels. Now a coin is knocked out only when
      // its own support breaks/moves, the ammo touches it, or a block slams
      // into it (see SUPPORT/KNOCK RULES below).
      const body = world.createBody({ type:"kinematic", position: planck.Vec2(c.x, y) });
      const fx = body.createFixture(planck.Circle(COIN_R), { isSensor:true, density:0.3 });
      const rec = {
        body, fixture:fx, x:c.x, y, key:c.key, dead:false, id:"coin"+coins.length,
        touchingGround:false, groundRestTimer:0,
        supports: [],   // filled after the settle check: [{ rec, x, y, a }]
      };
      body.setUserData({ isCoin:true, coinRec:rec });
      coins.push(rec);
    });
  }
  spawnCoinEntities();

  // ---- Coin/block overlap check (load-time, diagnostic + the real fix) ----
  // Coins are sensor fixtures (see above: isSensor:true), so Planck never
  // gives them a collision response — nothing at runtime can push two
  // overlapping coins apart. The ONLY thing that prevents an overlap is the
  // declared position in the level data being correct to begin with (see
  // the level-4 fix above). This check runs once per level load, after
  // every coin/block exists, as a broad-phase AABB check followed by an
  // exact circle-distance check for every coin-coin pair, and reports any
  // remaining overlap with both ids/keys — so a regression is caught here
  // instead of silently shipping as an invisible bug again.
  function circleRectOverlap(cx,cy,cr, rx,ry,rw,rh){
    const dx = Math.max(Math.abs(cx-rx)-rw/2, 0);
    const dy = Math.max(Math.abs(cy-ry)-rh/2, 0);
    return (dx*dx+dy*dy) < cr*cr;
  }
  function checkLevelOverlaps(){
    for (let i=0;i<coins.length;i++){
      for (let j=i+1;j<coins.length;j++){
        const a = coins[i], c = coins[j];
        // broad AABB check first (cheap), then exact circle-distance
        const aabbHit = Math.abs(a.x-c.x) < COIN_R*2 && Math.abs(a.y-c.y) < COIN_R*2;
        if (!aabbHit) continue;
        const d = Math.hypot(a.x-c.x, a.y-c.y);
        if (d < COIN_R*2){
          console.error('[overlap] COIN-COIN OVERLAP:', a.id, a.key, 'vs', c.id, c.key,
            'dist=', d.toFixed(3), 'required>=', (COIN_R*2).toFixed(3));
        }
      }
    }
    // coin-vs-block is informational only (several levels intentionally
    // rest a coin flush against a niche's flanking blocks) — never auto-fixed.
    for (const c of coins){
      for (const r of blocks){
        const bp = r.body.getPosition();
        if (circleRectOverlap(c.x, c.y, COIN_R, bp.x, bp.y, r.w, r.h)){
          console.warn('[overlap] coin-block contact:', c.id, c.key, 'vs block#', r.id, r.mat, r.shape);
        }
      }
    }
  }
  checkLevelOverlaps();

  // ---- Stage-1 coin resolution ----
  // Coins are SENSOR fixtures, so they get no physical collision response
  // from the ground (or anything else) — a woken coin that is never given
  // another way to stop would just free-fall through the floor forever,
  // which is the actual root cause of "coins fall through the floor
  // texture and never break/get collected" (the visual floor line and the
  // physics groundTopM already agree — see the '[ground]' log above).
  // Ground contact is instead detected via contact EVENTS (sensors still
  // fire begin/end-contact, they just skip the solver), combined with a
  // per-coin rest timer and an out-of-bounds sweep. Every destruction path
  // funnels through destroyCoin() so logging + the win-check stay in sync.
  const COIN_ABSORB = 0.6;       // ammo keeps 60% of its speed after taking a coin
  const COIN_SLAM_SPEED = 3.5;   // m/s — a block hitting a coin this fast knocks it out
  const SUPPORT_MOVE_M = 0.45;   // a coin's support shifted this far -> the coin falls
  const SUPPORT_TILT_RAD = 0.30; // ~17 deg of tilt -> the coin rolls off
  let pendingCoinCollect = [];   // hit by the ammo -> always a real "collected" kill
  let pendingCoinSpeedKill = []; // an elevated coin reached the ground -> knocked down
  let pendingCoinHit = [];       // a hard knock from a block/debris (post-solve impulse)
  world.on("begin-contact", (contact) => {
    const ua = contact.getFixtureA().getBody().getUserData();
    const ub = contact.getFixtureB().getBody().getUserData();
    const coinUD = ua && ua.isCoin ? ua : (ub && ub.isCoin ? ub : null);
    if (!coinUD) return;
    const otherUD = coinUD === ua ? ub : ua;
    if (otherUD && otherUD.isAmmo){
      if (!coinUD.coinRec.dead && !pendingCoinCollect.includes(coinUD.coinRec)){
        pendingCoinCollect.push(coinUD.coinRec);
        // the coin absorbs part of the hit: the ammo can't punch straight
        // through a whole column of coins in one flight
        const ab = coinUD === ua ? contact.getFixtureB().getBody() : contact.getFixtureA().getBody();
        ammoBrake.push(ab);
      }
      return;
    }
    // a block/debris that slams into the coin knocks it out
    if (otherUD && otherUD.mat && !otherUD.terrain && !otherUD.dead){
      const ob = coinUD === ua ? contact.getFixtureB().getBody() : contact.getFixtureA().getBody();
      const v = ob.getLinearVelocity();
      if (Math.hypot(v.x, v.y) > COIN_SLAM_SPEED && !inGrace()) pendingCoinHit.push(coinUD.coinRec);
    }
  });
  world.on("end-contact", (contact) => {
    const ua = contact.getFixtureA().getBody().getUserData();
    const ub = contact.getFixtureB().getBody().getUserData();
    const coinUD = ua && ua.isCoin ? ua : (ub && ub.isCoin ? ub : null);
    if (!coinUD) return;
    const otherUD = coinUD === ua ? ub : ua;
    if (otherUD && otherUD.isGround) coinUD.coinRec.touchingGround = false;
  });
  // The single coin-destruction path: marks it dead+resolved, logs the
  // reason ('ammo-hit' | 'speed' | 'rest-timer' | 'out-of-bounds' |
  // 'end-of-turn'), gives the "+5000" collection feedback for every reason
  // EXCEPT out-of-bounds (that's a loss, not a clear — it must still count
  // toward the win-check's resolved total so a lost coin can never block
  // the level from being completable, but it gets no reward feedback), and
  // reports once every coin in the level has been resolved.
  function destroyCoin(rec, reason){
    if (rec.dead) return;
    rec.dead = true;
    rec.reason = reason; rec.deadAtTick = sceneTime;
    console.log('[coin] destroyed', rec.id, rec.key, 'reason:', reason);
    if (reason !== 'out-of-bounds'){
      const cp = rec.body.getPosition();
      spawnCoinBurst(cp.x, cp.y, rec.key);
      // (stage 2) coin points scale with the level's difficulty tier
      score += COIN_VALUE;
      floatTexts.push({ x:cp.x, y:cp.y+0.6, vy:1.0, life:1, text:"+"+COIN_VALUE, color:"#ffcc33" });
    }
    if (reason === 'ammo-hit'){
      const cp = rec.body.getPosition();
      shotKillCount++; shotKillSumX += cp.x; shotKillSumY += cp.y;
    }
    world.destroyBody(rec.body);
    if (coins.length && coins.every(c => c.dead)){
      console.log('[win-check] all coins resolved for level', LEVELS.indexOf(levelDef));
    }
  }
  let ammoBrake = [];
  function applyPendingCoinCollect(){
    for (const b of ammoBrake){ const v = b.getLinearVelocity(); b.setLinearVelocity(planck.Vec2(v.x*COIN_ABSORB, v.y*COIN_ABSORB)); }
    ammoBrake = [];
    for (const rec of pendingCoinCollect) destroyCoin(rec, 'ammo-hit');
    pendingCoinCollect = [];
    for (const rec of pendingCoinSpeedKill) destroyCoin(rec, 'fell');
    pendingCoinSpeedKill = [];
    for (const rec of pendingCoinHit) destroyCoin(rec, 'hit');
    pendingCoinHit = [];
  }
  // Per-coin rest timer ("knocked out" after 1.5s continuously on the
  // ground) + out-of-bounds cleanup. Called once per frame right after the
  // physics step — never from inside a contact callback, so destroying
  // bodies here is always safe.
  // OOB_X_MAX scales with the level's own worldWidth (batch-3: level 6's
  // 34m-wide "Снайпер" has real, intentionally-resting coins out past
  // x=24-34, which the old hardcoded ">25" would have destroyed the
  // instant the level loaded). +3m margin matches the old constant
  // exactly for level 1 (worldWidth 22 -> 25) and only ever LOOSENS the
  // bound for every other existing level (worldWidth 24/26 -> 27/29), so
  // no previously-enforced out-of-bounds case stops firing.
  const OOB_X_MAX = (levelDef.worldWidth || 22) + 3;
  function updateCoinTimersAndBounds(frameDt){
    for (const c of coins){
      if (c.dead) continue;
      const p = c.body.getPosition();
      if (p.x < -5 || p.x > OOB_X_MAX || p.y < -3){ destroyCoin(c, 'out-of-bounds'); continue; }
      // SUPPORT RULE: the coin is knocked off as soon as anything it rests on
      // is destroyed, shifted or tilted — the moment it would really fall.
      for (const s of c.supports){
        const r = s.rec;
        if (r.dead){ destroyCoin(c, 'support-lost'); break; }
        const sp = r.body.getPosition();
        if (Math.hypot(sp.x - s.x, sp.y - s.y) > SUPPORT_MOVE_M || Math.abs(r.body.getAngle() - s.a) > SUPPORT_TILT_RAD){
          destroyCoin(c, 'support-moved'); break;
        }
      }
    }
    // Pit cleanup: anything (block or flying ammo) that falls below the
    // ground line with nothing catching it — i.e. it fell into a pit/gap,
    // since solid ground would have stopped it well above y<-3 — is
    // silently removed. Blocks get no destruction FX (it wasn't "killed",
    // it just fell out of the world) but still needs its body destroyed so
    // it doesn't sit there consuming physics time forever.
    for (const r of blocks){
      if (r.dead) continue;
      const p = r.body.getPosition();
      if (p.y < -3){ r.dead = true; world.destroyBody(r.body); }
    }
    if (flying){
      const p = flying.getPosition();
      if (p.y < -3){ world.destroyBody(flying); flying = null; }
    }
  }

  function runStabilityCheck(){
    const initial = blocks.map(r => { const p = r.body.getPosition(); return { r, x:p.x, y:p.y }; });
    for (const r of blocks) r.body.setAwake(true);
    for (let i=0;i<180;i++) world.step(DT, 10, 8);
    for (const { r, x, y } of initial){
      if (r.dead) continue;
      const p = r.body.getPosition();
      const d = Math.hypot(p.x-x, p.y-y);
      if (d > 0.05) console.warn(`[stability] block #${r.id} (${r.mat} ${r.shape} ${r.w.toFixed(2)}x${r.h.toFixed(2)}) moved ${d.toFixed(3)}m during blind settle test`);
    }
    for (const r of blocks) r.body.setAwake(false);
  }
  runStabilityCheck();
  /* ---- SUPPORT/KNOCK RULES for coins (2026-10-04) ----
     A coin's supports are the destructible blocks right under it: their top
     is within 0.35m of the coin's bottom and they overlap it horizontally.
     Measured after the settle check, from where things really rest. A coin
     with no destructible support (on the ground or on static terrain) can
     only be taken by the ammo or by a block slamming into it. */
  for (const c of coins){
    const cp = c.body.getPosition(), bottom = cp.y - COIN_R;
    for (const r of blocks){
      if (r.dead || r.terrain) continue;
      for (let f = r.body.getFixtureList(); f; f = f.getNext()){
        const bb = f.getAABB(0);
        const overlapX = Math.min(bb.upperBound.x, cp.x + COIN_R*0.8) - Math.max(bb.lowerBound.x, cp.x - COIN_R*0.8);
        const isFloor = overlapX > 0.05 && Math.abs(bb.upperBound.y - bottom) <= 0.35;
        // NICHE WALLS/LID: any block whose box reaches into the coin's
        // circle encloses it — breaking or shifting that wall spills the
        // coin out too (a coin sealed in a niche used to be untakeable)
        const nx = Math.max(bb.lowerBound.x, Math.min(cp.x, bb.upperBound.x));
        const ny = Math.max(bb.lowerBound.y, Math.min(cp.y, bb.upperBound.y));
        const isWall = Math.hypot(cp.x - nx, cp.y - ny) < COIN_R + 0.25;
        if (isFloor || isWall){
          const p = r.body.getPosition();
          c.supports.push({ rec:r, x:p.x, y:p.y, a:r.body.getAngle(), wall: !isFloor });
          break;
        }
      }
    }
    // walls only count for a real niche: the coin must be boxed in on BOTH
    // sides. A single neighbouring column (level 5's balconies) is not a
    // niche and must not spill the coin when it is merely bumped.
    {
      const walls = c.supports.filter(s => s.wall);
      const left = walls.some(s => s.rec.body.getPosition().x < cp.x - 0.3);
      const right = walls.some(s => s.rec.body.getPosition().x > cp.x + 0.3);
      if (!(left && right)) c.supports = c.supports.filter(s => !s.wall);
    }
    console.log('[coin] supports', c.id, c.key, c.supports.map(s => '#'+s.rec.id+' '+s.rec.mat+' '+s.rec.shape+(s.wall?' (wall)':'')).join(', ') || '(none: ground/terrain)');
  }
  pendingCoinCollect = []; pendingCoinSpeedKill = []; pendingCoinHit = [];

  // Section-1 required check: live coin count must match the level's coin
  // count right after the structure settles.
  {
    const liveCoins = coins.filter(c => !c.dead).length;
    const expectedCoins = levelDef.coins.length;
    console.log(`[coins] live=${liveCoins} expected=${expectedCoins}`);
    if (liveCoins !== expectedCoins) console.error(`[coins] MISMATCH: expected ${expectedCoins} live coins but found ${liveCoins}`);
  }

  function spawnAmmo(){
    // kinematic + never given a velocity while loaded = it cannot roll off on its own
    ammoBody = world.createBody({ type:"kinematic", position: planck.Vec2(anchorM.x, anchorM.y) });
    ammoBody.createFixture(planck.Circle(AMMO_R), { density:4, friction:0.5, restitution:0.3 });
    ammoBody.setUserData({ isAmmo:true });
    ammoBody.setAngularDamping(0.5);
    lastSpawnT = performance.now();
    ammoSlowAccum = 0;
  }
  spawnAmmo();

  const DAMAGE_MULT = 16;

  const IMPULSE_THRESHOLD = 1.5;
  const IMPACT_MIN_SPEED = 1.2;  // m/s closing speed — below this a contact is resting, not a hit
  let pendingDamage = [];
  let shakeTime = 0;
  // ---- "Life"/juice (#4, batch-1): hit-stop + flash on a strong hit ----
  let hitStopUntilMs = 0;      // performance.now() deadline — physics/fx are fully frozen (timeScale=0) until this passes
  let slowMoUntilMs = 0;       // performance.now() deadline — timeScale=0.4 until this passes (end-of-turn victory beat)
  let levelWon = false;         // set once, the instant every coin is down
  let pendingVictoryArgs = null; // {cleared,total,chargesLeft} — queued, fired once slowMoUntilMs passes
  let impactFlashQueue = [];   // [{x,y}] world-m points — drained into real flash particles once per frame (never inside the post-solve callback itself, which must stay cheap/allocation-light)
  /* (2026-10-04) Damage comes from IMPACTS only. Before, every post-solve
     impulse above the threshold dealt damage EVERY physics step — including
     the steady contact force of blocks simply resting on each other (a
     heavy concrete block presses ~2.4 per step, above the 1.5 threshold).
     Any woken tower therefore crushed itself within seconds, so one shot
     anywhere levelled whole structures. pre-solve measures how fast the two
     bodies were actually closing at the contact point; slower than
     IMPACT_MIN_SPEED is resting/sliding contact and deals no damage. */
  world.on("pre-solve", (contact) => {
    const wm = contact.getWorldManifold(null);
    const pt = wm && wm.points && wm.points[0];
    if (!pt){ contact.__approach = 0; return; }
    const bA = contact.getFixtureA().getBody(), bB = contact.getFixtureB().getBody();
    const vA = bA.getLinearVelocityFromWorldPoint(pt), vB = bB.getLinearVelocityFromWorldPoint(pt);
    contact.__approach = -((vB.x - vA.x)*wm.normal.x + (vB.y - vA.y)*wm.normal.y);
  });
  world.on("post-solve", (contact, impulse) => {
    if (!(contact.__approach >= IMPACT_MIN_SPEED)) return;
    const j = impulse.normalImpulses[0] || 0;
    if (j < IMPULSE_THRESHOLD) return;
    const fA = contact.getFixtureA(), fB = contact.getFixtureB();
    pendingDamage.push([fA.getBody(), fB.getBody(), j]);
    if (j > 4.5) shakeTime = Math.max(shakeTime, Math.min(1, (j-4.5)/12));
    if (j > 7){ // "a strong hit" — ~60ms hit-stop + an impact flash, per spec
      hitStopUntilMs = Math.max(hitStopUntilMs, performance.now() + 60);
      const pa = fA.getBody().getPosition(), pb = fB.getBody().getPosition();
      impactFlashQueue.push({ x:(pa.x+pb.x)/2, y:(pa.y+pb.y)/2 });
    }
  });
  // ---- combo tracking (#4): counts blocks+coins destroyed within one shot's
  // settle window; shown as "COMBO x<n>" once the shot settles if n>=3.
  let shotKillCount = 0, shotKillSumX = 0, shotKillSumY = 0;

  function applyPendingDamage(){
    if (inGrace()){ pendingDamage = []; return; }
    for (const [bA, bB, j] of pendingDamage){
      const dA = bA.getUserData(), dB = bB.getUserData();
      const dmg = j * DAMAGE_MULT;
      damageBody(dA, dmg, dB);
      damageBody(dB, dmg, dA);
    }
    pendingDamage = [];
  }
  function damageBody(rec, dmg, other){
    // terrain primitives (platforms/ramps/ground) are indestructible, same
    // as the ground itself — never take damage, never crack, never die.
    if (!rec || rec.dead || rec.isAmmo || rec.terrain) return;
    const matDef = MATERIALS[rec.mat];
    if (!matDef) return;
    if (matDef.glass && other && other.isAmmo) dmg *= 2;
    rec.hp -= dmg;
    const pct = Math.max(0, rec.hp / rec.maxHp);
    rec.crackStage = pct <= 0.33 ? 2 : (pct <= 0.66 ? 1 : 0);
    if (rec.hp <= 0 && !rec.dead) killBlock(rec);
  }
  // Wake every body touching `body` right now, plus every body whose
  // fixtures lie within a 4m-radius AABB of `body`'s center (broad-phase
  // query — sensors included, so a nearby resting coin gets caught even
  // though it was never in physical contact with this block). Must run
  // BEFORE the body is destroyed, since destroyBody() tears down its
  // contacts first.
  function wakeContactsAndNeighbors(body){
    for (let ce = body.getContactList(); ce; ce = ce.next){
      if (ce.contact.isTouching()) ce.other.setAwake(true);
    }
    const p = body.getPosition();
    const R = 4;
    const aabb = new planck.AABB(planck.Vec2(p.x-R, p.y-R), planck.Vec2(p.x+R, p.y+R));
    world.queryAABB(aabb, (fixture) => { fixture.getBody().setAwake(true); return true; });
  }
  function killBlock(rec){
    rec.dead = true;
    const p = rec.body.getPosition();
    spawnShatter(p.x, p.y, rec.mat, rec.shape);
    // score popup (#4): "+500" per block destroyed, colored to match the
    // material's own glow/accent color.
    score += BLOCK_POINTS;
    floatTexts.push({ x:p.x, y:p.y, vy:1.0, life:1, text:"+"+BLOCK_POINTS, color: MATERIALS[rec.mat].glow });
    shotKillCount++; shotKillSumX += p.x; shotKillSumY += p.y;
    wakeContactsAndNeighbors(rec.body);
    world.destroyBody(rec.body);
    let awakeCount = 0;
    for (let b = world.getBodyList(); b; b = b.getNext()) if (b.isAwake()) awakeCount++;
    console.log('[wake] awake bodies after kill:', awakeCount);
  }

  // Safety net (bugfix #1): every ~0.5s, force-wake any coin or block that
  // is asleep but has zero currently-touching contacts. Catches anything
  // that should be falling (its support is gone) but never got a wake call
  // — e.g. a coin whose only touching neighbor was destroyed in a frame
  // where, for whatever reason, the radius-wake above missed it.
  function hasTouchingContact(body){
    for (let ce = body.getContactList(); ce; ce = ce.next){
      if (ce.contact.isTouching()) return true;
    }
    return false;
  }
  function runWakeSafetyNet(){
    for (const c of coins){
      if (c.dead) continue;
      if (!c.body.isAwake() && !hasTouchingContact(c.body)) c.body.setAwake(true);
    }
    for (const r of blocks){
      if (r.dead) continue;
      if (!r.body.isAwake() && !hasTouchingContact(r.body)) r.body.setAwake(true);
    }
  }

  // destruction effects: Math.random() here is fine — this runs once per
  // break event, not once per frame, so it never causes a steady-state flicker.
  // `shape` picks shape-aware debris/shard geometry (circle→round, tri/wedge→
  // triangular shards) instead of always generic rectangles.
  function spawnShatter(xm, ym, mat, shape){
    const col = MATERIALS[mat].glow;
    const isRound = shape === "circle";
    const isTriangular = shape === "tri" || shape === "wedge";
    if (mat === "metal"){
      for (let i=0;i<8;i++){
        const ang = -0.3 + Math.random()*1.2 - Math.PI*0.15;
        const sp = 2 + Math.random()*3.5;
        pushParticle({ kind:"spark", x:xm, y:ym, vx:Math.cos(ang)*sp, vy:Math.abs(Math.sin(ang))*sp+1.5, life:1, color:"#ffd65c" });
      }
    } else if (mat === "glass"){
      for (let i=0;i<13;i++){
        const ang = Math.random()*Math.PI*2, sp = 1.5+Math.random()*2.8;
        pushParticle({ kind:"shard", x:xm, y:ym, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp+1, life:1, color:col, size:0.12+Math.random()*0.14, rot:Math.random()*6, vr:(Math.random()-0.5)*0.6 });
      }
      rings.push({ x:xm, y:ym, life:1, color:"#9fe9ff", maxR: 1.6 });
    } else {
      for (let i=0;i<6;i++) dust.push({ x:xm, y:ym, vx:(Math.random()-0.5)*0.5, vy:Math.random()*0.5, life:1, r:0.3+Math.random()*0.35 });
      for (let i=0;i<6;i++){
        const ang = Math.random()*Math.PI*2, sp = 1+Math.random()*2;
        pushParticle({ kind: isTriangular ? "shard" : "chip", x:xm, y:ym, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp+1, life:1, color:"#cfc8d8", size:0.07+Math.random()*0.08, rot:Math.random()*6, vr:(Math.random()-0.5)*0.4 });
      }
    }
    const n = 4 + Math.floor(Math.random()*3);
    for (let i=0;i<n;i++){
      if (debris.length >= MAX_DEBRIS) debris.shift();
      const ang = Math.random()*Math.PI*2, sp = 1.4+Math.random()*2.2;
      debris.push({
        x:xm, y:ym, vx:Math.cos(ang)*sp, vy:Math.abs(Math.sin(ang))*sp+1.2,
        rot:Math.random()*6, vr:(Math.random()-0.5)*0.5,
        mat, shape: isRound ? "circle" : (isTriangular ? "tri" : "box"), settled:false, ttl:2, fade:1,
        size: 0.18+Math.random()*0.22,
      });
    }
  }
  function spawnCoinBurst(xm, ym, coinKey){
    const col = NETWORKS[coinKey].color;
    rings.push({ x:xm, y:ym, life:1, color:col, maxR: 2.2 });
    pushParticle({ kind:"flash", x:xm, y:ym, vx:0, vy:0.4, life:1, color:col, size:1.2 });
    floatTexts.push({ x:xm, y:ym, vy:1.1, life:1, text:"+5000", color:col });
  }

  /* ---- input: Pointer Events, attached ONLY to the canvas. setPointerCapture
     keeps the drag alive even if the finger/mouse leaves the canvas rect.
     Ignored entirely while the level-select menu is the active screen. ---- */
  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  // ---- camera pan input (#1): swipe on empty canvas space (never the
  // slingshot/pouch) pans the camera; a separate `inputMode` keeps this
  // from ever fighting the pouch-drag ('drag') handling below. ----
  let inputMode = "none"; // "none" | "drag" | "pan"
  let panLastPx = null, panLastMoveMs = 0;

  // (stage-1 #4) tension-camera framing: while the pouch is being pulled,
  // zoom out to a FIXED 0.65x (spec'd exactly, unlike the following-state's
  // dynamic range below) and pan so both the anchor and the whole target
  // structure's bounding box are inside frame — reuses structureBoundsM,
  // the same bounding box the flyover already computes once per level
  // load, just at a different fixed zoom.
  // (2026-10-04) The pull framing is no longer a fixed 0.65x centred on
  // the whole scene: on the long levels (7-8, ~55m from sling to the far
  // tower) that pushed the slingshot itself off the left edge, so players
  // aimed blind and under-powered their shots. Now the slingshot is ALWAYS
  // kept in frame (left-anchored), and the zoom eases out as far as needed
  // to show the target, between PULL_ZOOM_MAX and PULL_ZOOM_MIN.
  const PULL_ZOOM_MAX = 0.65, PULL_ZOOM_MIN = 0.45;
  function startPullCamera(){
    const lo = Math.min(structureBoundsM.minX, anchorM.x) - 1.0;
    const hi = Math.max(structureBoundsM.maxX, anchorM.x) + 1.5;
    const zoom = Math.max(PULL_ZOOM_MIN, Math.min(PULL_ZOOM_MAX, VISIBLE_W_M / (hi - lo)));
    const visW = VISIBLE_W_M / zoom;
    // centre the span when it fits; otherwise keep the sling's side in view
    const camX = clampCamX((hi - lo) <= visW ? (lo + hi)/2 - visW/2 : anchorM.x - 0.12*visW, zoom);
    camera.state = "pulling";
    startCameraEase(camX, zoom, 400);
  }
  function endPullCameraToResting(){
    camera.state = "resting";
    startCameraEase(CAM_LEFT_M, 1, 500);
  }

  let dragStartPx = { x:0, y:0 };
  function onDown(e){
    if (!gameWrap.classList.contains("active")) return; // menu open: ignore
    if (resultOverlay.classList.contains("show")) return; // result popup: ignore
    if (pinchActive) return; // a 2-finger pinch is in progress — ignore new single-pointer presses

    // Flyover skip (#1): a tap anywhere during the flyover jumps straight
    // to the resting framing — consumes the tap, never also starts a
    // drag/pan on this same press.
    if (camera.state === "flyover"){ skipFlyover(); return; }

    const p = pointerPos(e);
    if (ammoBody && chargesUsed < AMMO_CHARGES){
      const pos = toPx(ammoBody.getPosition().x, ammoBody.getPosition().y);
      const d = Math.hypot(p.x-pos.x, p.y-pos.y);
      if (d < AMMO_R*SCALE*camera.zoom*2.8){
        inputMode = "drag"; dragging = true;
        dragStartPx = { x:p.x, y:p.y };
        hooks.onHint && hooks.onHint("", false);
        try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
        startPullCamera();
        e.preventDefault();
        return;
      }
    }
    // Not on the pouch: swipe-to-pan, only while resting/already-panning —
    // never fights the flyover-ease or the shot-follow camera.
    if (camera.state === "resting" || camera.state === "panning"){
      inputMode = "pan";
      camera.state = "panning";
      camera.easing = false;
      panLastPx = p; panLastMoveMs = performance.now();
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    }
  }
  function onMove(e){
    if (inputMode === "drag"){
      if (!dragging || !ammoBody) return;
      e.preventDefault();
      // (2026-10-04) pull strength is measured in SCREEN pixels from the
      // sling (full power = PULL_PX), independent of the camera zoom — at
      // the far levels' zoomed-out framing the old world-space pull meant
      // full power was only ~20px of finger travel.
      // measured from where the finger first touched the pouch, so the
      // pull camera easing out underneath can't change the shot strength
      const p = pointerPos(e);
      const dxp = p.x - dragStartPx.x, dyp = p.y - dragStartPx.y;
      const distPx = Math.hypot(dxp, dyp);
      const PULL_PX = Math.max(70, Math.min(140, cssW*0.25));
      const pullM = Math.min(1, distPx / PULL_PX) * MAX_PULL_M;
      const ang = Math.atan2(-dyp, dxp); // screen y grows down
      ammoBody.setPosition(planck.Vec2(anchorM.x + Math.cos(ang)*pullM, anchorM.y + Math.sin(ang)*pullM));
      return;
    }
    if (inputMode === "pan"){
      e.preventDefault();
      const p = pointerPos(e);
      const dxPx = p.x - panLastPx.x;
      camera.camX = clampCamX(camera.camX - dxPx/(SCALE*camera.zoom));
      panLastPx = p; panLastMoveMs = performance.now();
    }
  }
  function onUp(e){
    if (inputMode === "drag"){
      inputMode = "none";
      if (!dragging || !ammoBody){ try{ canvas.releasePointerCapture(e.pointerId); }catch(err){} return; }
      e.preventDefault();
      dragging = false;
      try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
      releaseShot();
      return;
    }
    if (inputMode === "pan"){
      inputMode = "none";
      try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
      panLastMoveMs = performance.now(); // idle-return timer (see updateCameraState) starts counting from release
    }
  }
  // Fires the loaded ammo from wherever the pouch currently is. Shared by
  // the real pointer release and the debug/test hook (scene.__debug.shoot).
  let shotMaxX = 0;
  function releaseShot(){
      if (!ammoBody) return false;
      const pos = ammoBody.getPosition();
      const dx = anchorM.x - pos.x, dy = anchorM.y - pos.y;
      const pull = Math.hypot(dx, dy);
      if (pull < 0.12){
        ammoBody.setPosition(planck.Vec2(anchorM.x, anchorM.y));
        // released without shooting (dragged back to the anchor/cancelled):
        // ease the tension camera back to the normal resting framing.
        endPullCameraToResting();
        return false;
      }
      shotMaxX = pos.x;
      const vx = dx * LAUNCH_POWER, vy = dy * LAUNCH_POWER;
      ammoBody.setType("dynamic");
      ammoBody.setBullet(true);
      ammoBody.setLinearVelocity(planck.Vec2(vx, vy));
      ammoBody.setAngularDamping(3); // extra spin damping once launched, so it can't roll forever
      flying = ammoBody;
      trail = [];
      chargesUsed += 1;
      shotKillCount = 0; shotKillSumX = 0; shotKillSumY = 0;
      // purely cosmetic: let the empty pouch snap back with a short damped
      // bounce instead of just vanishing — does not touch ammoBody/physics
      pouchReleaseT = sceneTime;
      pouchReleaseFromM = { x: pos.x, y: pos.y };
      ammoBody = null;
      settledTimer = { ticks:0 };
      ammoSlowAccum = 0;
      // camera (#1): a shot is now in the air — switch to 'following'
      camera.state = "following";
      camera.easing = false;
      return true;
  }
  if (!SNAPSHOT){
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
  }

  /* ---- (stage-1 #6) pinch-zoom, 0.55-1.0x, standard two-finger gesture.
     Handled via raw TouchEvents (touchstart/touchmove/touchend), separate
     from the Pointer-Event-driven single-pointer drag/pan above, which on
     a touchscreen ALSO fires for the same physical touches (Pointer Events
     are built on top of touch on every browser that supports both) — so
     the two co-exist by having the touch handlers below do nothing at all
     unless a SECOND touch point is already down (e.touches.length>=2):
     a single-finger touch is left entirely to the existing pointer-event
     path (aiming/shooting on the pouch, or swipe-to-pan on empty canvas),
     unchanged. The moment a 2nd finger lands, any single-pointer drag in
     progress is cancelled (pouch snaps back to the anchor, not launched)
     and the gesture becomes a pinch exclusively until back down to <2
     touches — this is the "standard multi-touch disambiguation" the spec
     calls for: 1 finger = existing aim/pan, 2 fingers = pinch, never both
     at once. Pan-while-pinching (re-centering as you zoom) was judged out
     of scope for this stage — pinch only changes zoom, keeping camera.camX
     exactly where it already was; a future stage can add a 2-finger pan
     delta on top of this same gesture if wanted. ---- */
  let pinchActive = false, pinchStartDist = 1, pinchStartZoom = 1;
  function touchDist(t0, t1){ return Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY); }
  function onTouchStart(e){
    if (!gameWrap.classList.contains("active")) return;
    if (e.touches.length < 2) return; // single touch: leave entirely to pointer events above
    e.preventDefault();
    // a 2nd finger just landed — cancel any in-progress single-pointer
    // drag/pan so it can never fight the pinch.
    if (inputMode === "drag" && ammoBody){
      ammoBody.setPosition(planck.Vec2(anchorM.x, anchorM.y));
      endPullCameraToResting();
    }
    dragging = false; inputMode = "none";
    camera.easing = false;
    if (camera.state !== "following") camera.state = "resting";
    pinchActive = true;
    pinchStartDist = Math.max(1, touchDist(e.touches[0], e.touches[1]));
    pinchStartZoom = camera.zoom;
  }
  function onTouchMove(e){
    if (!pinchActive || e.touches.length < 2) return;
    e.preventDefault();
    const dist = touchDist(e.touches[0], e.touches[1]);
    const rawZoom = pinchStartZoom * (dist / pinchStartDist);
    camera.zoom = Math.max(0.55, Math.min(1.0, rawZoom));
    camera.camX = clampCamX(camera.camX); // re-clamp: the visible width in meters just changed with zoom
  }
  function onTouchEnd(e){
    if (e.touches.length < 2) pinchActive = false;
  }
  if (!SNAPSHOT){
    canvas.addEventListener("touchstart", onTouchStart, { passive:false });
    canvas.addEventListener("touchmove", onTouchMove, { passive:false });
    canvas.addEventListener("touchend", onTouchEnd, { passive:false });
    canvas.addEventListener("touchcancel", onTouchEnd, { passive:false });
  }

  let accumulator = 0;
  let lastT = performance.now();
  let raf = null;

  // (stage-1 #8) only the first 40% of the predicted arc is shown while
  // pulling — TRAJ_N stays the full point count the fade (`a`) is computed
  // against, TRAJ_SHOWN is the truncated loop bound, so the dots that DO
  // show keep the same fade-out curve they always had, just cut short.
  const TRAJ_N = 18, TRAJ_FRAC = 0.4, TRAJ_SHOWN = Math.ceil(TRAJ_N * TRAJ_FRAC);
  function trajectoryPoints(){
    if (!ammoBody) return [];
    const pos = ammoBody.getPosition();
    const dx = anchorM.x - pos.x, dy = anchorM.y - pos.y;
    const vx = dx*LAUNCH_POWER, vy = dy*LAUNCH_POWER;
    const pts = [];
    for (let i=1;i<=TRAJ_SHOWN;i++){
      const t = i*0.085;
      const px = pos.x + vx*t, py = pos.y + vy*t + 0.5*(-10)*t*t;
      if (py < groundTopM) break;
      pts.push({ x:px, y:py, a: 1 - i/TRAJ_N });
    }
    return pts;
  }

  // 'following' state (#1): while a shot is in the air, the camera eases
  // its zoom out to 0.75x (so both the projectile and the target stay
  // visible) and pans on X to keep the projectile inside a margin, same
  // margin-based follow the old camPanXm code used. Once the shot settles
  // (flying becomes null — see step()'s settledTimer block), this instead
  // eases smoothly back to the resting framing.
  // (stage-1 #5) the follow-zoom target is no longer the fixed 0.75 it used
  // to be: it's computed per-frame from how far the projectile currently
  // is from the target structure's own bounding box (structureBoundsM,
  // the same box the flyover/pull-tension framing use) — close to the
  // target needs less zoom-out (near 0.75), far from it needs more
  // (down to 0.65) so both stay in frame. This was judged a reasonably
  // scoped dynamic computation (one lerp against a precomputed bounding
  // box, no extra per-frame geometry work) rather than a fixed constant.
  function followZoomTarget(px){
    const targetCx = (structureBoundsM.minX + structureBoundsM.maxX) / 2;
    const dist = Math.abs(targetCx - px);
    const frac = Math.max(0, Math.min(1, dist / VISIBLE_W_M));
    return 0.75 - 0.10*frac; // 0.75 near the target, down to 0.65 far from it
  }
  function updateCameraFollow(){
    if (camera.state !== "following") return;
    if (flying){
      const p0 = flying.getPosition();
      camera.zoom += (followZoomTarget(p0.x) - camera.zoom) * 0.06;
      const p = flying.getPosition();
      const s = SCALE*camera.zoom;
      const screenX = (p.x - camera.camX)*s;
      const margin = cssW*0.18;
      if (screenX > cssW - margin) camera.camX = clampCamX(camera.camX + (screenX-(cssW-margin))/s);
      else if (screenX < margin) camera.camX = clampCamX(camera.camX - (margin-screenX)/s);
    } else {
      // shot settled: ease back to resting
      camera.state = "resting";
      startCameraEase(CAM_LEFT_M, 1, 600);
    }
  }

  function step(){
    if (destroyed) return;
    const now = performance.now();
    let frameDt = (now - lastT)/1000;
    lastT = now;
    if (frameDt > 0.1) frameDt = 0.1;

    // "Life"/juice (#4) time-scaling: hit-stop (timeScale 0, ~60ms, on a
    // strong hit) takes priority over the end-of-turn victory slow-mo
    // (timeScale 0.4, 1s); both just scale frameDt, so every timer/particle
    // update below (which all key off frameDt, not DT) naturally slows with
    // it — no separate "is it slow-mo" branch needed anywhere else.
    let timeScale = 1;
    if (now < hitStopUntilMs) timeScale = 0;
    else if (now < slowMoUntilMs) timeScale = 0.4;
    frameDt *= timeScale;

    accumulator += frameDt;
    while (accumulator >= DT){
      world.step(DT, 10, 8);
      // ground-contact damping for the flying ammo so it can't roll forever
      if (flying){
        const p = flying.getPosition();
        if (p.y <= groundTopM + AMMO_R*1.08){
          const v = flying.getLinearVelocity();
          flying.setLinearVelocity(planck.Vec2(v.x*0.98, v.y*0.98));
        }
      }
      accumulator -= DT;
    }
    applyPendingDamage();
    applyPendingCoinCollect();
    updateCoinTimersAndBounds(frameDt);
    // drain the impact-flash queue (post-solve filled it; never spawn FX
    // from inside that callback itself)
    for (const f of impactFlashQueue){ pushParticle({ kind:"flash", x:f.x, y:f.y, vx:0, vy:0, life:1, color:"#ffffff", size:1.6 }); }
    impactFlashQueue = [];
    sceneTime++;
    wakeSafetyAccum += frameDt;
    if (wakeSafetyAccum >= 0.5){ wakeSafetyAccum = 0; runWakeSafetyNet(); }
    updateCameraState();
    updateCameraFollow();
    updateAmbientFX(frameDt);

    if (flying){
      const v = flying.getLinearVelocity();
      const speed = Math.hypot(v.x, v.y);
      ammoSlowAccum = speed < 0.3 ? ammoSlowAccum + frameDt : 0;
      const p = flying.getPosition();
      if (p.x > shotMaxX) shotMaxX = p.x;
      trail.push({x:p.x,y:p.y});
      if (trail.length > 22) trail.shift();
    } else {
      ammoSlowAccum = 0;
    }

    // "shard" particles get a hard, wall-clock 2s TTL (life 1→0 over 2 real
    // seconds) instead of the old frame-coupled decay, so a glass shard can
    // never linger/dangle longer than 2s; other particle kinds (spark,
    // chip, flash) keep their original per-frame decay, unchanged.
    for (const pt of particles){ pt.x+=pt.vx*DT*4; pt.y+=pt.vy*DT*4; pt.vy-=0.02; if (pt.rot!==undefined) pt.rot+=pt.vr; pt.life -= (pt.kind === "shard") ? frameDt/2 : 0.03; }
    particles = particles.filter(pt => { const alive = pt.life>0; if (!alive && pt.kind==="shard") shardCount--; return alive; });
    for (const d of dust){ d.x+=d.vx*DT*4; d.y+=d.vy*DT*4; d.r+=0.012; d.life-=0.025; }
    for (let i=dust.length-1;i>=0;i--) if (dust[i].life<=0) dust.splice(i,1);
    for (const r of rings){ r.life -= 0.025; }
    for (let i=rings.length-1;i>=0;i--) if (rings[i].life<=0) rings.splice(i,1);
    for (const ft of floatTexts){ ft.y += ft.vy*DT; ft.vy *= 0.985; ft.life -= 0.012; }
    for (let i=floatTexts.length-1;i>=0;i--) if (floatTexts[i].life<=0) floatTexts.splice(i,1);
    for (const ct of comboTexts){ ct.life -= 0.01; }
    for (let i=comboTexts.length-1;i>=0;i--) if (comboTexts[i].life<=0) comboTexts.splice(i,1);
    for (const d of debris){
      if (!d.settled){
        d.vy -= 0.11;
        d.x += d.vx*DT*4; d.y += d.vy*DT*4;
        d.rot += d.vr;
        if (d.y <= groundTopM + 0.05){ d.y = groundTopM + 0.05; d.settled = true; d.vx = 0; d.vy = 0; d.vr *= 0.15; }
      }
      // hard 2s TTL from spawn regardless of settle state, with fade over
      // the last 0.5s — debris can never "dangle" indefinitely.
      d.ttl -= frameDt;
      d.fade = d.ttl <= 0.5 ? Math.max(0, d.ttl/0.5) : 1;
    }
    debris = debris.filter(d => d.ttl > 0);
    if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - 0.05);

    if (settledTimer){
      settledTimer.ticks++;
      let maxSpeed = 0;
      for (const rec of blocks){ if (rec.dead) continue; const v = rec.body.getLinearVelocity(); maxSpeed = Math.max(maxSpeed, Math.hypot(v.x,v.y)); }
      const flyingAsleep = flying ? !flying.isAwake() : true;
      if ((maxSpeed < 0.25 && flyingAsleep) || ammoSlowAccum >= 1.5 || settledTimer.ticks > 240){
        settledTimer = null;
        if (flying){ world.destroyBody(flying); flying = null; }
        const clearedCount = coins.filter(c=>c.dead).length;
        // Combo text (#4): >=3 destructions in this single shot.
        if (shotKillCount >= 3){
          comboTexts.push({
            x: shotKillSumX/shotKillCount, y: shotKillSumY/shotKillCount,
            life:1, text:"COMBO x"+shotKillCount,
          });
        }
        shotKillCount = 0;
        if (levelWon){
          // already handled the moment the last coin went down (see below)
        } else if (clearedCount === coins.length && coins.length > 0){
          // End-of-turn victory beat (#4): 0.4x slow-mo for 1s, THEN the
          // result overlay — queued rather than fired immediately, see the
          // timeScale block at the top of step().
          slowMoUntilMs = now + 1000;
          pendingVictoryArgs = { cleared: clearedCount, total: coins.length, chargesLeft: AMMO_CHARGES - chargesUsed, score };
        } else {
